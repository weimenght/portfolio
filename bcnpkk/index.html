<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Handoff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; transition: background 1.2s ease, color 0.6s ease; }
        input, textarea, select { font-size: 16px !important; }
        .glass { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body id="app-body" class="bg-slate-950 text-white font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-amber-400 selection:text-black">

    <!-- TOP BAR: LANGUAGE + ACCOUNT CONTROLS -->
    <nav class="w-full max-w-md mx-auto px-6 pt-5 pb-1 flex items-center justify-between text-xs z-30">
        <div class="flex space-x-1 glass px-2 py-1 rounded-full">
            <button onclick="setLang('en')" id="lang-en" class="px-2 py-0.5 rounded-full transition">EN</button>
            <button onclick="setLang('zh-CN')" id="lang-zh-CN" class="px-2 py-0.5 rounded-full transition">简</button>
            <button onclick="setLang('zh-TW')" id="lang-zh-TW" class="px-2 py-0.5 rounded-full transition">繁</button>
            <button onclick="setLang('es')" id="lang-es" class="px-2 py-0.5 rounded-full transition">ES</button>
        </div>

        <div id="nav-user-controls" class="hidden flex items-center space-x-2">
            <button onclick="openEditModal()" class="glass px-3 py-1 rounded-full opacity-80 hover:opacity-100 transition flex items-center space-x-1">
                <span>⚙</span>
                <span data-i18n="editAccount">Account</span>
            </button>
            <button onclick="logout()" class="glass px-3 py-1 rounded-full opacity-60 hover:opacity-100 transition" data-i18n="logout">Exit</button>
        </div>
    </nav>

    <!-- ================================================================= -->
    <!-- SCREEN 1: SUPABASE LOGIN & CREDENTIAL UPDATER                     -->
    <!-- ================================================================= -->
    <section id="login-screen" class="w-full max-w-md mx-auto px-6 py-8 flex-1 flex flex-col justify-center">
        <div class="glass rounded-3xl p-7 space-y-6 shadow-2xl">
            <div class="space-y-1">
                <h1 class="text-2xl font-light tracking-tight" data-i18n="appTitle">Twilight Handoff</h1>
                <p class="text-xs opacity-60" data-i18n="loginSub">Sign in with your account</p>
            </div>

            <!-- Dynamic Supabase Connection Config (if not set in code) -->
            <div id="supabase-config-banner" class="hidden p-4 rounded-2xl bg-amber-500/10 border border-amber-400/30 space-y-2.5 text-xs">
                <div class="font-semibold text-amber-300" data-i18n="dbConfigTitle">Connect Database</div>
                <input id="cfg-url" type="text" placeholder="https://your-project.supabase.co" class="w-full glass rounded-xl px-3 py-2 text-xs focus:outline-none">
                <input id="cfg-key" type="password" placeholder="Supabase Anon Public Key" class="w-full glass rounded-xl px-3 py-2 text-xs focus:outline-none">
                <button onclick="saveSupabaseConfig()" class="w-full py-2 rounded-xl bg-amber-400 text-black font-semibold text-xs" data-i18n="connectDbBtn">Save & Connect</button>
            </div>

            <!-- Login Form -->
            <div class="space-y-4">
                <div>
                    <label class="text-[11px] uppercase tracking-wider opacity-60 block mb-1" data-i18n="nameLabel">Name</label>
                    <input id="login-name" type="text" class="w-full glass rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-white/50">
                </div>
                <div>
                    <label class="text-[11px] uppercase tracking-wider opacity-60 block mb-1" data-i18n="passLabel">Password</label>
                    <input id="login-pass" type="password" class="w-full glass rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-white/50">
                </div>

                <!-- Toggle Update Info Section on Login Page -->
                <div class="pt-1">
                    <button type="button" onclick="toggleLoginUpdateBox()" class="text-xs underline opacity-60 hover:opacity-100 transition" data-i18n="wantToChangeInfo">
                        Update my Name, City, or Password →
                    </button>
                </div>

                <!-- Collapsible Info Update Box (Verifies previous info in Supabase first) -->
                <div id="login-update-box" class="hidden p-4 rounded-2xl bg-white/5 border border-white/10 space-y-3">
                    <p class="text-[11px] opacity-60" data-i18n="updateHint">Verify your current Name & Password above, then enter new details below:</p>
                    <div>
                        <label class="text-[10px] uppercase opacity-50 block mb-1" data-i18n="newNameLabel">New Name</label>
                        <input id="update-new-name" type="text" class="w-full glass rounded-xl px-3 py-2 text-xs focus:outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase opacity-50 block mb-1" data-i18n="newCityLabel">Your City</label>
                        <input id="update-new-city" type="text" data-i18n-placeholder="cityInputPlaceholder" placeholder="e.g. Beijing, Barcelona" class="w-full glass rounded-xl px-3 py-2 text-xs focus:outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase opacity-50 block mb-1" data-i18n="newPassLabel">New Password</label>
                        <input id="update-new-pass" type="password" class="w-full glass rounded-xl px-3 py-2 text-xs focus:outline-none">
                    </div>
                </div>

                <p id="login-error" class="text-xs text-rose-400 hidden"></p>

                <div class="flex space-x-2 pt-2">
                    <button id="login-submit-btn" onclick="handleLogin(false)" class="flex-1 py-3 rounded-full bg-white text-black text-xs font-semibold tracking-wide hover:opacity-90 transition" data-i18n="loginBtn">
                        Enter
                    </button>
                    <button id="save-login-btn" onclick="handleLogin(true)" class="hidden flex-1 py-3 rounded-full bg-amber-400 text-black text-xs font-semibold tracking-wide hover:opacity-90 transition" data-i18n="VerifyAndUpdateBtn">
                        Verify & Update
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- ================================================================= -->
    <!-- SCREEN 2: MAIN APPLICATION                                        -->
    <!-- ================================================================= -->
    <div id="app-screen" class="hidden flex-1 flex flex-col justify-between">

        <!-- HEADER: DYNAMIC NAME, GEOCODED CITY, LIVE TIME & WEATHER -->
        <header class="w-full max-w-md mx-auto px-6 pt-4 pb-3 flex items-center justify-between">
            <!-- You -->
            <div class="flex flex-col">
                <span class="text-[10px] uppercase tracking-widest opacity-50" data-i18n="youTag">You</span>
                <div class="flex items-baseline space-x-1.5 mt-0.5">
                    <span id="name-you" class="text-sm font-semibold text-white">--</span>
                    <span class="opacity-40 text-xs">·</span>
                    <span id="label-you" class="text-xs font-medium uppercase tracking-wider text-amber-300">--</span>
                </div>
                <div id="time-you" class="text-3xl font-light tracking-tight mt-0.5">--:--</div>
                <div id="weather-you" class="text-xs opacity-60 mt-0.5">--</div>
            </div>

            <!-- Auto Mode Badge -->
            <div class="flex flex-col items-center justify-center px-3 py-1.5 rounded-full glass">
                <span id="mode-pill" class="text-[10px] font-mono uppercase tracking-widest">--</span>
            </div>

            <!-- Partner -->
            <div class="flex flex-col text-right items-end">
                <div class="flex items-center space-x-1.5">
                    <span id="partner-mood-dot" class="w-2 h-2 rounded-full bg-amber-400"></span>
                    <span class="text-[10px] uppercase tracking-widest opacity-50" data-i18n="partnerTag">Partner</span>
                </div>
                <div class="flex items-baseline space-x-1.5 mt-0.5">
                    <span id="name-partner" class="text-sm font-semibold text-white">--</span>
                    <span class="opacity-40 text-xs">·</span>
                    <span id="label-partner" class="text-xs font-medium uppercase tracking-wider text-amber-300">--</span>
                </div>
                <div id="time-partner" class="text-3xl font-light tracking-tight mt-0.5">--:--</div>
                <div id="weather-partner" class="text-xs opacity-60 mt-0.5">--</div>
            </div>
        </header>

        <!-- MAIN INTERACTION STACK -->
        <main class="w-full max-w-md mx-auto px-6 py-3 flex-1 flex flex-col justify-center space-y-4">

            <!-- VIBE SELECTOR -->
            <div class="glass rounded-3xl p-4 space-y-2.5">
                <div class="flex items-center justify-between text-xs px-1">
                    <span class="opacity-60" data-i18n="yourVibe">Your vibe (colors partner's sky)</span>
                    <span id="current-vibe-label" class="font-mono text-[11px] opacity-80"></span>
                </div>
                <div class="flex space-x-1.5 overflow-x-auto no-scrollbar pb-1" id="mood-buttons">
                    <!-- Good -->
                    <button onclick="setMyMood('radiant')" data-mood="radiant" class="shrink-0 px-3 py-1.5 rounded-full glass text-xs opacity-60 hover:opacity-100 transition" data-i18n="vibeRadiant">☀️ Radiant</button>
                    <button onclick="setMyMood('warm')" data-mood="warm" class="shrink-0 px-3 py-1.5 rounded-full glass text-xs opacity-60 hover:opacity-100 transition" data-i18n="vibeWarm">✨ Warm</button>
                    <button onclick="setMyMood('playful')" data-mood="playful" class="shrink-0 px-3 py-1.5 rounded-full glass text-xs opacity-60 hover:opacity-100 transition" data-i18n="vibePlayful">🎈 Playful</button>
                    <!-- Neutral -->
                    <button onclick="setMyMood('calm')" data-mood="calm" class="shrink-0 px-3 py-1.5 rounded-full glass text-xs opacity-60 hover:opacity-100 transition" data-i18n="vibeCalm">🌊 Calm</button>
                    <button onclick="setMyMood('focus')" data-mood="focus" class="shrink-0 px-3 py-1.5 rounded-full glass text-xs opacity-60 hover:opacity-100 transition" data-i18n="vibeFocus">⚡ Focus</button>
                    <button onclick="setMyMood('drifting')" data-mood="drifting" class="shrink-0 px-3 py-1.5 rounded-full glass text-xs opacity-60 hover:opacity-100 transition" data-i18n="vibeDrifting">☁️ Drifting</button>
                    <!-- Low / Bad -->
                    <button onclick="setMyMood('drained')" data-mood="drained" class="shrink-0 px-3 py-1.5 rounded-full glass text-xs opacity-60 hover:opacity-100 transition" data-i18n="vibeDrained">🥀 Drained</button>
                    <button onclick="setMyMood('overwhelmed')" data-mood="overwhelmed" class="shrink-0 px-3 py-1.5 rounded-full glass text-xs opacity-60 hover:opacity-100 transition" data-i18n="vibeOverwhelmed">🌧️ Overwhelmed</button>
                    <button onclick="setMyMood('missing')" data-mood="missing" class="shrink-0 px-3 py-1.5 rounded-full glass text-xs opacity-60 hover:opacity-100 transition" data-i18n="vibeMissing">🌙 Missing You</button>
                </div>
            </div>

            <!-- 1. INCOMING CAPSULE CARD -->
            <div id="incoming-card" class="glass rounded-3xl p-6 transition-all duration-500">
                <div class="flex items-center justify-between text-xs opacity-70 mb-3">
                    <span id="incoming-from" class="font-medium">--</span>
                    <span id="incoming-status" class="font-mono uppercase tracking-wider text-amber-300">--</span>
                </div>

                <!-- Empty State -->
                <div id="state-empty" class="py-3 text-center text-sm opacity-40 font-light" data-i18n="emptyCapsule">
                    No locked thoughts waiting right now.
                </div>

                <!-- Locked State -->
                <div id="state-locked" class="hidden space-y-4">
                    <p class="text-lg font-light leading-relaxed break-words">
                        <span id="masked-dots" class="opacity-30 select-none tracking-widest"></span>
                        <span id="teaser-words" class="font-normal underline underline-offset-4 text-amber-300"></span>
                    </p>
                    <div class="flex items-center space-x-2 pt-1">
                        <input id="guess-input" type="text" data-i18n-placeholder="guessPlaceholder" class="w-full bg-transparent border-b border-current/20 py-2 text-sm focus:outline-none focus:border-current transition placeholder:opacity-40">
                        <button onclick="unlockCapsule()" class="px-4 py-2 rounded-full bg-white text-black text-xs font-medium tracking-wide shrink-0 hover:opacity-90 transition" data-i18n="unlockBtn">
                            Unlock
                        </button>
                    </div>
                </div>

                <!-- Unlocked State -->
                <div id="state-unlocked" class="hidden space-y-3">
                    <p id="full-sentence" class="text-lg font-light leading-relaxed break-words"></p>
                    <p id="guess-result" class="text-xs opacity-60 italic border-l-2 border-current/40 pl-3 py-0.5"></p>
                    <div id="audio-player-wrap" class="hidden pt-2">
                        <audio id="capsule-audio" controls playsinline preload="metadata" class="w-full h-10 rounded-lg"></audio>
                    </div>
                </div>
            </div>

            <!-- 2. COMPOSER CARD -->
            <div id="composer-card" class="glass rounded-3xl p-6 space-y-4 transition-all duration-500">
                <div class="flex justify-between items-center">
                    <span id="composer-prompt" class="text-xs opacity-70">--</span>
                    <span id="partner-sleep-badge" class="text-[10px] font-mono uppercase px-2.5 py-0.5 rounded-full glass">--</span>
                </div>

                <textarea id="composer-input" rows="2" data-i18n-placeholder="composerPlaceholder" class="w-full bg-transparent text-lg font-light placeholder:opacity-30 focus:outline-none resize-none leading-relaxed"></textarea>

                <!-- Cross-Browser Recorded Audio Preview -->
                <div id="recorded-preview-wrap" class="hidden flex items-center justify-between text-xs py-2 px-3 rounded-2xl glass">
                    <audio id="recorded-preview" controls playsinline class="h-8 w-52"></audio>
                    <button type="button" onclick="clearRecording()" class="text-[11px] opacity-60 hover:opacity-100 px-2 py-1" data-i18n="clearAudio">✕ Clear</button>
                </div>

                <p id="mic-error-msg" class="text-[11px] text-rose-300 hidden"></p>

                <div class="flex items-center justify-between pt-2 border-t border-current/10">
                    <button type="button" id="mic-btn" onclick="toggleRecording()" class="flex items-center space-x-2 text-xs opacity-90 hover:opacity-100 transition py-2.5 px-4 rounded-full glass active:scale-95">
                        <span id="mic-dot" class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
                        <span id="mic-label" data-i18n="recordAudio">Record 6s sound</span>
                        <span id="mic-timer" class="font-mono text-[11px] text-amber-300 hidden">6.0s</span>
                    </button>

                    <button type="button" onclick="sendHandoff()" id="send-btn" class="px-6 py-2.5 rounded-full bg-white text-black text-xs font-medium tracking-wide hover:opacity-90 transition">
                        <span data-i18n="sendBtn">Send</span>
                    </button>
                </div>
            </div>

        </main>
    </div>

    <!-- MODAL: IN-APP ACCOUNT EDITOR -->
    <div id="edit-modal" class="fixed inset-0 bg-black/75 backdrop-blur-md z-50 hidden flex items-center justify-center p-6">
        <div class="glass rounded-3xl p-6 w-full max-w-sm space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-semibold uppercase tracking-wider" data-i18n="editAccount">Update Account</h3>
                <button onclick="closeEditModal()" class="text-xs opacity-60 hover:opacity-100">✕</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="opacity-60 block mb-1" data-i18n="currentPassVerify">Current Password (Required)</label>
                    <input id="modal-curr-pass" type="password" class="w-full glass rounded-xl px-3 py-2">
                </div>
                <div>
                    <label class="opacity-60 block mb-1" data-i18n="newNameLabel">New Name</label>
                    <input id="modal-new-name" type="text" class="w-full glass rounded-xl px-3 py-2">
                </div>
                <div>
                    <label class="opacity-60 block mb-1" data-i18n="newCityLabel">Your City</label>
                    <input id="modal-new-city" type="text" data-i18n-placeholder="cityInputPlaceholder" class="w-full glass rounded-xl px-3 py-2">
                </div>
                <div>
                    <label class="opacity-60 block mb-1" data-i18n="newPassLabel">New Password (Optional)</label>
                    <input id="modal-new-pass" type="password" class="w-full glass rounded-xl px-3 py-2">
                </div>
                <p id="modal-msg" class="text-amber-300 hidden"></p>
            </div>
            <button onclick="saveAccountFromModal()" class="w-full py-2.5 rounded-full bg-white text-black text-xs font-semibold" data-i18n="saveChanges">Save Changes</button>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="w-full max-w-md mx-auto px-6 py-4 flex items-center justify-between text-[11px] opacity-40">
        <span id="sync-indicator">--</span>
        <span id="sky-desc">--</span>
    </footer>

        // 1. SUPABASE INITIALIZATION (No Hardcoded Accounts or Cities)
        // ============================================================================
        // Paste your Supabase URL and Anon Key below, or enter them once in the UI prompt
        const ENV_SUPABASE_URL = 'https://uxbozndyjqizcxpzvjko.supabase.co'; 
        const ENV_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV4Ym96bmR5anFpemN4cHp2amtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNTQ2MDMsImV4cCI6MjEwNzkzMDYwM30.PZn_0AHNlof5se5N3cZNo2hv2ohjHV-oLLyKn6IFwME'; 

        let supabaseClient = null;

        function initSupabase() {
            const url = ENV_SUPABASE_URL || localStorage.getItem('handoff_sb_url') || '';
            const key = ENV_SUPABASE_ANON_KEY || localStorage.getItem('handoff_sb_key') || '';
            const banner = document.getElementById('supabase-config-banner');

            if (url && key) {
                supabaseClient = window.supabase.createClient(url, key);
                banner.classList.add('hidden');
                document.getElementById('sync-indicator').innerText = 'Supabase Connected';
                return true;
            } else {
                banner.classList.remove('hidden');
                document.getElementById('sync-indicator').innerText = 'Awaiting Supabase Keys';
                return false;
            }
        }

        function saveSupabaseConfig() {
            const url = document.getElementById('cfg-url').value.trim();
            const key = document.getElementById('cfg-key').value.trim();
            if (!url || !key) return;
            localStorage.setItem('handoff_sb_url', url);
            localStorage.setItem('handoff_sb_key', key);
            initSupabase();
        }

        function detectBrowserLang() {
            const nav = (navigator.language || 'en').toLowerCase();
            if (nav.includes('zh-tw') || nav.includes('zh-hk')) return 'zh-TW';
            if (nav.includes('zh')) return 'zh-CN';
            if (nav.includes('es')) return 'es';
            return 'en';
        }

        function t(key) {
            return (I18N[currentLang] && I18N[currentLang][key]) || I18N['en'][key] || key;
        }

        function getApiLangCode() {
            if (currentLang.startsWith('zh')) return 'zh';
            if (currentLang === 'es') return 'es';
            return 'en';
        }

        // ============================================================================
        // 3. MULTILINGUAL PARTIAL MESSAGE TEASER SCHEME (EN, ES, ZH-CN, ZH-TW)
        // ============================================================================
        function computeMultilingualTeaser(rawText) {
            const clean = (rawText || '').trim();
            if (!clean) return { mask: '••••••', reveal: '...' };

            const cjkRegex = /[\u4e00-\u9fa5]/g;
            const cjkMatches = clean.match(cjkRegex);
            const isPrimarilyCJK = cjkMatches && (cjkMatches.length / clean.length > 0.25);

            if (isPrimarilyCJK) {
                const chars = Array.from(clean);
                const total = chars.length;
                if (total <= 2) return { mask: '•• ', reveal: chars[total - 1] };
                const revealCount = Math.min(5, Math.max(2, Math.ceil(total * 0.32)));
                const hiddenCount = Math.min(12, Math.max(4, total - revealCount));
                return {
                    mask: '•'.repeat(hiddenCount) + ' ',
                    reveal: chars.slice(-revealCount).join('')
                };
            } else {
                const words = clean.split(/\s+/);
                if (words.length <= 2) {
                    const half = Math.ceil(clean.length / 2);
                    return { mask: '•••••• ', reveal: clean.slice(half) };
                }
                const revealWordsCount = Math.min(3, Math.max(1, Math.floor(words.length * 0.4)));
                return {
                    mask: '•••••••••••• ',
                    reveal: words.slice(-revealWordsCount).join(' ')
                };
            }
        }

        async function handleLogin(isUpdatingInfo) {
            const errEl = document.getElementById('login-error');
            errEl.classList.add('hidden');

            if (!supabaseClient && !initSupabase()) {
                errEl.innerText = t('errNoSupabase');
                errEl.classList.remove('hidden');
                return;
            }

            const nameInput = document.getElementById('login-name').value.trim();
            const passInput = document.getElementById('login-pass').value.trim();

            if (!nameInput || !passInput) {
                errEl.innerText = t('errInvalidCreds');
                errEl.classList.remove('hidden');
                return;
            }

            // 1. Verify credentials directly against Supabase `accounts` table
            const { data: matchedAccount, error } = await supabaseClient
                .from('accounts')
                .select('*')
                .ilike('name', nameInput)
                .eq('password', passInput)
                .maybeSingle();

            if (error || !matchedAccount) {
                errEl.innerText = t('errInvalidCreds');
                errEl.classList.remove('hidden');
                return;
            }

            let activeAccount = matchedAccount;

            // 2. If user requested an update on the login screen after verifying old credentials
            if (isUpdatingInfo) {
                const newName = document.getElementById('update-new-name').value.trim() || matchedAccount.name;
                const newCity = document.getElementById('update-new-city').value.trim() || matchedAccount.city;
                const newPass = document.getElementById('update-new-pass').value.trim() || matchedAccount.password;

                const { data: updated, error: updateErr } = await supabaseClient
                    .from('accounts')
                    .update({
                        name: newName,
                        city: newCity,
                        password: newPass,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', matchedAccount.id)
                    .select()
                    .single();

                if (!updateErr && updated) {
                    activeAccount = updated;
                }
            }

            currentUser = activeAccount;
            localStorage.setItem('handoff_logged_in_id', currentUser.id);
            await enterApp();
        }

            const savedId = localStorage.getItem('handoff_logged_in_id');

        // Pulls the fresh row for both currentUser and partnerUser directly from Supabase
        async function syncAccountsFromSupabase() {
            if (!currentUser || !supabaseClient) return;

            const { data: meData } = await supabaseClient
                .from('accounts')
                .select('*')
                .eq('id', currentUser.id)
                .maybeSingle();

            const { data: partnerData } = await supabaseClient
                .from('accounts')
                .select('*')
                .neq('id', currentUser.id)

        // ============================================================================
        // 5. LIVE GEOCODING + WEATHER LOCATION API (Open-Meteo Geocoding & Forecast)
        // ============================================================================
        // Resolves ANY city name stored in Supabase into { displayName, lat, lon, timezone, temp, weatherKey, isDay, localHour }
        const locationWeatherCache = {};

        async function resolveCityAndWeather(rawCityName) {
            if (!rawCityName) return null;
            const lang = getApiLangCode();
            const cacheKey = `${rawCityName.toLowerCase()}_${lang}`;

            try {
                // Step 1: Geocode the city string via Open-Meteo Geocoding API
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(rawCityName)}&count=1&language=${lang}&format=json`;
                const geoRes = await fetch(geoUrl);
                const geoJson = await geoRes.json();

                if (!geoJson.results || geoJson.results.length === 0) {
                    return { displayName: rawCityName, tz: 'UTC', temp: '--', weatherKey: 'weatherClear', isDay: 1 };
                }

                const place = geoJson.results[0];
                const lat = place.latitude;
                const lon = place.longitude;
                const tz = place.timezone || 'UTC';
                const displayName = place.name || rawCityName;

                // Step 2: Fetch live weather & day/night status via Open-Meteo Forecast API
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day&timezone=auto`;
                const weatherRes = await fetch(weatherUrl);
                const weatherJson = await weatherRes.json();

                const curr = weatherJson.current || {};
                const resolvedTz = weatherJson.timezone || tz;

                const info = {
                    displayName: displayName,
                    tz: resolvedTz,
                    temp: curr.temperature_2m !== undefined ? Math.round(curr.temperature_2m) : '--',
                    weatherKey: decodeWeatherKey(curr.weather_code || 0),
                    isDay: curr.is_day !== undefined ? curr.is_day : 1
                };

                locationWeatherCache[cacheKey] = info;
                return info;
            } catch (e) {
                return locationWeatherCache[cacheKey] || { displayName: rawCityName, tz: 'UTC', temp: '--', weatherKey: 'weatherClear', isDay: 1 };
            }
        }

        function decodeWeatherKey(code) {
            if (code === 0) return 'weatherClear';
            if (code <= 3) return 'weatherCloudy';
            if (code <= 48) return 'weatherMist';
            if (code <= 67) return 'weatherRain';
            if (code <= 77) return 'weatherSnow';
            return 'weatherStorm';
        }

        function getCityHour(tz) {
            try {
                const str = new Date().toLocaleTimeString('en-US', { timeZone: tz, hour: '2-digit', hour12: false });
                return parseInt(str, 10);
            } catch (e) {
                return new Date().getUTCHours();
            }
        }

        function getCityTimeStr(tz) {
            try {
                return new Date().toLocaleTimeString('en-US', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false });
            } catch (e) {
                return '--:--';
            }
        }

        // ============================================================================
        // 7. CROSS-BROWSER / CROSS-OS AUDIO RECORDER (Safari, Chrome, Firefox)
        // ============================================================================
        let mediaRecorder = null;
        let activeStream = null;
        let audioChunks = [];
        let recordedBlob = null;
        let recordedMimeType = '';
        let recordedExt = 'm4a';
        let isRecording = false;
        let recordTimeout = null;
        let countdownInterval = null;
        let activeCapsule = null;

        function getSupportedAudioFormat() {
            if (typeof MediaRecorder === 'undefined') return { mimeType: '', ext: 'wav' };
            const candidates = [
                { mimeType: 'audio/mp4', ext: 'm4a' },
                { mimeType: 'audio/mp4;codecs=mp4a.40.2', ext: 'm4a' },
                { mimeType: 'audio/aac', ext: 'aac' },
                { mimeType: 'audio/webm;codecs=opus', ext: 'webm' },
                { mimeType: 'audio/webm', ext: 'webm' },
                { mimeType: 'audio/ogg;codecs=opus', ext: 'ogg' },
                { mimeType: 'audio/ogg', ext: 'ogg' }
            ];
            for (const c of candidates) {
                try {
                    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c.mimeType)) {
                        return c;
                    }
                } catch (e) {}
            }
            return { mimeType: '', ext: 'webm' };
        }

        async function toggleRecording() {
            const errEl = document.getElementById('mic-error-msg');
            errEl.classList.add('hidden');

            if (isRecording) {
                stopRecording();
                return;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                errEl.innerText = t('errMicPerm');
                errEl.classList.remove('hidden');
                return;
            }

            try {
                activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const format = getSupportedAudioFormat();
                recordedMimeType = format.mimeType;
                recordedExt = format.ext;

                audioChunks = [];
                mediaRecorder = recordedMimeType
                    ? new MediaRecorder(activeStream, { mimeType: recordedMimeType })
                    : new MediaRecorder(activeStream);

                mediaRecorder.ondataavailable = event => {
                    if (event.data && event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const finalType = mediaRecorder.mimeType || recordedMimeType || 'audio/mp4';
                    recordedBlob = new Blob(audioChunks, { type: finalType });
                    recordedMimeType = finalType;

                    const previewEl = document.getElementById('recorded-preview');
                    previewEl.src = URL.createObjectURL(recordedBlob);
                    previewEl.load();
                    document.getElementById('recorded-preview-wrap').classList.remove('hidden');

                    if (activeStream) {
                        activeStream.getTracks().forEach(track => track.stop());
                        activeStream = null;
                    }
                };

                mediaRecorder.start(200);
                isRecording = true;

                const dot = document.getElementById('mic-dot');
                const label = document.getElementById('mic-label');
                const timerEl = document.getElementById('mic-timer');

                dot.classList.add('animate-ping');
                label.innerText = t('recordingNow');
                timerEl.classList.remove('hidden');

                let remaining = 6.0;
                timerEl.innerText = `${remaining.toFixed(1)}s`;
                countdownInterval = setInterval(() => {
                    remaining = Math.max(0, remaining - 0.2);
                    timerEl.innerText = `${remaining.toFixed(1)}s`;
                }, 200);

                recordTimeout = setTimeout(() => {
                    if (isRecording) stopRecording();
                }, 6000);

            } catch (err) {
                errEl.innerText = t('errMicPerm');
                errEl.classList.remove('hidden');
            }
        }

        function stopRecording() {
            clearTimeout(recordTimeout);
            clearInterval(countdownInterval);
            isRecording = false;

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try { mediaRecorder.stop(); } catch (e) {}
            }

            document.getElementById('mic-dot').classList.remove('animate-ping');
            document.getElementById('mic-label').innerText = t('soundAttached');
            document.getElementById('mic-timer').classList.add('hidden');
        }

        function clearRecording() {
            recordedBlob = null;
            audioChunks = [];
            const previewEl = document.getElementById('recorded-preview');
            previewEl.pause();
            previewEl.removeAttribute('src');
            document.getElementById('recorded-preview-wrap').classList.add('hidden');
            document.getElementById('mic-label').innerText = t('recordAudio');
        }

        // ============================================================================
        // 8. DIRECT SUPABASE CAPSULE STORAGE & SYNC
        // ============================================================================
        async function sendHandoff() {
            if (!currentUser || !supabaseClient) return;
            const input = document.getElementById('composer-input');
            const text = input.value.trim();
            if (!text && !recordedBlob) return;

            const sendBtn = document.getElementById('send-btn');
            sendBtn.innerText = t('sending');

            const fullText = text || '🎙️ (6s)';
            const teaserObj = computeMultilingualTeaser(fullText);

            let audioUrl = null;
            if (recordedBlob) {
                const fileName = `${Date.now()}_${currentUser.id}.${recordedExt || 'm4a'}`;
                const { data, error } = await supabaseClient.storage
                    .from('soundbites')
                    .upload(fileName, recordedBlob, {
                        contentType: recordedMimeType || 'audio/mp4',
                        upsert: true
                    });
                if (!error && data) {
                    const { data: pub } = supabaseClient.storage.from('soundbites').getPublicUrl(fileName);
                    audioUrl = pub.publicUrl;
                }
            }

            const payload = {
                id: Date.now().toString(),
                sender: currentUser.city,
                sender_name: currentUser.name,
                full_text: fullText,
                teaser: teaserObj.reveal,
                audio_url: audioUrl,
                unlocked: false,
                guess: '',
                created_at: new Date().toISOString()
            };

            await supabaseClient.from('capsules').insert([payload]);

            input.value = '';
            clearRecording();
            sendBtn.innerText = t('sent');
            setTimeout(() => { sendBtn.innerText = t('sendBtn'); }, 1500);
            await loadLatestCapsule();
        }

        async function loadLatestCapsule() {
            if (!supabaseClient) return;
            const { data } = await supabaseClient
                .from('capsules')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(1);

            activeCapsule = (data && data.length > 0) ? data[0] : null;
            renderCapsule();
        }

        function renderCapsule() {
            const emptyEl = document.getElementById('state-empty');
            const lockedEl = document.getElementById('state-locked');
            const unlockedEl = document.getElementById('state-unlocked');
            const statusEl = document.getElementById('incoming-status');
            const fromEl = document.getElementById('incoming-from');

            if (!activeCapsule) {
                emptyEl.classList.remove('hidden');
                lockedEl.classList.add('hidden');
                unlockedEl.classList.add('hidden');
                statusEl.innerText = t('statusQuiet');
                fromEl.innerText = partnerUser ? `${partnerUser.name} (${partnerUser.city})` : '--';
                return;
            }

            emptyEl.classList.add('hidden');
            fromEl.innerText = `${t('fromCity')} ${activeCapsule.sender_name || ''} (${activeCapsule.sender || ''})`;

            if (!activeCapsule.unlocked) {
                lockedEl.classList.remove('hidden');
                unlockedEl.classList.add('hidden');
                statusEl.innerText = t('statusLocked');

                const teaserParts = computeMultilingualTeaser(activeCapsule.full_text);
                document.getElementById('masked-dots').innerText = teaserParts.mask;
                document.getElementById('teaser-words').innerText = teaserParts.reveal;
            } else {
                lockedEl.classList.add('hidden');
                unlockedEl.classList.remove('hidden');
                statusEl.innerText = t('statusUnlocked');
                document.getElementById('full-sentence').innerText = `"${activeCapsule.full_text}"`;
                document.getElementById('guess-result').innerText = activeCapsule.guess
                    ? `${t('completedWith')} "${activeCapsule.guess}"`
                    : t('unlockedDirect');

                const audioWrap = document.getElementById('audio-player-wrap');
                const audioEl = document.getElementById('capsule-audio');
                if (activeCapsule.audio_url) {
                    audioWrap.classList.remove('hidden');
                    if (audioEl.src !== activeCapsule.audio_url) {
                        audioEl.src = activeCapsule.audio_url;
                        audioEl.load();
                    }
                } else {
                    audioWrap.classList.add('hidden');
                }
            }
        }

        async function unlockCapsule() {
            if (!activeCapsule || !supabaseClient) return;
            const guess = document.getElementById('guess-input').value.trim();
            await supabaseClient
                .from('capsules')
                .update({ unlocked: true, guess: guess })
                .eq('id', activeCapsule.id);
            document.getElementById('guess-input').value = '';
            await loadLatestCapsule();
        }

        async function enterApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('nav-user-controls').classList.remove('hidden');
            await refreshAllLocationsAndWeather();
            await loadLatestCapsule();
        }

        // Boot
        initSupabase();
        setLang(currentLang);
        restoreSessionFromSupabase();

        // Live Clock & Supabase Sync Poll
        setInterval(() => {
            if (currentUser) renderEnvironment();
        }, 1000);

        setInterval(async () => {
            if (currentUser && supabaseClient) {
                await refreshAllLocationsAndWeather();
                await loadLatestCapsule();
            }
        }, 15000);
    </script>
