<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Español — Vocabulario & Verbos</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            rojigualda: {
              red: '#C60B1E',
              gold: '#FFC400',
              crimson: '#9F0818',
            },
            day: {
              bg: '#FBF9F5',
              card: '#FFFFFF',
              surface: '#F3EFEA',
              border: '#E8E2D9',
              text: '#1C1917',
              muted: '#78716C',
            },
            night: {
              bg: '#0F0E0E',
              card: '#181617',
              surface: '#221F20',
              border: '#2C2729',
              text: '#F5F5F4',
              muted: '#A8A29E',
            }
          }
        }
      }
    }
  </script>

  <style>
    .flag-accent {
      background: linear-gradient(to right, #C60B1E 0%, #C60B1E 25%, #FFC400 25%, #FFC400 75%, #C60B1E 75%, #C60B1E 100%);
    }

    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d {
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 { transform: rotateY(180deg); }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb {
      background: #C60B1E33;
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #FFC40033;
    }

    @media (orientation: landscape) and (max-height: 540px) {
      .landscape-card { height: 13rem !important; }
      .landscape-shrink { font-size: 1.5rem !important; line-height: 1.75rem !important; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
    .shake-anim { animation: shake 0.25s ease-in-out; }
  </style>
</head>

<body class="min-h-screen flex flex-col bg-day-bg text-day-text dark:bg-night-bg dark:text-night-text transition-colors duration-150 selection:bg-rojigualda-gold selection:text-day-text font-sans antialiased">

  <!-- Franja Superior Rojigualda -->
  <div class="h-1.5 w-full flag-accent fixed top-0 left-0 z-50"></div>

  <!-- ============================================================== -->
  <!-- NAVEGACIÓN CAPA 1 (PRINCIPAL) & CAPA 2 (SUB-VISTA COHESIVA)    -->
  <!-- ============================================================== -->
  <header class="sticky top-1.5 z-40 bg-day-bg/95 dark:bg-night-bg/95 backdrop-blur-md border-b border-day-border dark:border-night-border transition-colors">
    <div class="max-w-4xl mx-auto px-4">
      
      <!-- CAPA 1: TARJETAS / VERBO -->
      <div class="h-14 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg flag-accent text-white flex items-center justify-center font-black text-xs shadow-xs border border-rojigualda-gold/60">
            ES
          </div>
          <span class="font-serif font-bold text-base tracking-tight hidden sm:inline">Español</span>
        </div>

        <nav class="flex items-center bg-day-surface dark:bg-night-surface p-1 rounded-xl border border-day-border dark:border-night-border shadow-inner">
          <button 
            id="tabBtnTarjetas" 
            onclick="app.setMainView('tarjetas')"
            class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-white dark:bg-night-card text-rojigualda-red dark:text-rojigualda-gold shadow-xs"
          >
            <i data-lucide="layers" class="w-3.5 h-3.5"></i>
            <span>Tarjetas</span>
          </button>
          <button 
            id="tabBtnVerbo" 
            onclick="app.setMainView('verbo')"
            class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-semibold text-day-muted dark:text-night-muted hover:text-day-text dark:hover:text-night-text transition-all"
          >
            <i data-lucide="flame" class="w-3.5 h-3.5"></i>
            <span>Verbo</span>
          </button>
        </nav>

        <div class="flex items-center gap-1">
          <button 
            onclick="app.toggleSound()" 
            id="sfxBtn"
            class="p-2 rounded-lg text-day-muted dark:text-night-muted hover:text-day-text dark:hover:text-night-text transition"
            title="Audio"
          >
            <i data-lucide="volume-2" class="w-4 h-4" id="sfxIcon"></i>
          </button>
          <button 
            onclick="app.toggleTheme()" 
            class="p-2 rounded-lg text-day-muted dark:text-night-muted hover:text-day-text dark:hover:text-night-text transition"
            title="Modo Día / Noche"
          >
            <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
            <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
          </button>
        </div>
      </div>

      <!-- CAPA 2: SUB-NAVEGACIÓN CONTEXTUAL COHESIVA -->
      <div class="h-10 border-t border-day-border/70 dark:border-night-border/70 flex items-center justify-between text-xs overflow-x-auto no-scrollbar py-1">
        
        <!-- Sub-navegación para Tarjetas -->
        <div id="subNavTarjetas" class="flex items-center gap-1">
          <button 
            id="subBtnCardsStudy" 
            onclick="app.setTarjetasSub('study')"
            class="px-3 py-1 rounded-lg font-bold bg-day-surface dark:bg-night-surface text-day-text dark:text-night-text transition flex items-center gap-1.5"
          >
            <i data-lucide="sparkles" class="w-3 h-3 text-rojigualda-red dark:text-rojigualda-gold"></i>
            <span>Práctica</span>
          </button>
          <button 
            id="subBtnCardsCorpus" 
            onclick="app.setTarjetasSub('corpus')"
            class="px-3 py-1 rounded-lg font-medium text-day-muted dark:text-night-muted hover:text-day-text dark:hover:text-night-text transition flex items-center gap-1.5"
          >
            <i data-lucide="book-open" class="w-3 h-3"></i>
            <span>Corpus (<span id="badgeCorpusTotal">0</span>)</span>
          </button>
          <button 
            id="subBtnCardsSaved" 
            onclick="app.setTarjetasSub('saved')"
            class="px-3 py-1 rounded-lg font-medium text-day-muted dark:text-night-muted hover:text-day-text dark:hover:text-night-text transition flex items-center gap-1.5"
          >
            <i data-lucide="star" class="w-3 h-3 text-amber-500"></i>
            <span>Guardadas (<span id="badgeSavedTotal">0</span>)</span>
          </button>
        </div>

        <!-- Sub-navegación para Verbo -->
        <div id="subNavVerbo" class="hidden flex items-center gap-1">
          <button 
            id="subBtnVerboDrill" 
            onclick="app.setVerboSub('drill')"
            class="px-3 py-1 rounded-lg font-bold bg-day-surface dark:bg-night-surface text-day-text dark:text-night-text transition flex items-center gap-1.5"
          >
            <i data-lucide="edit-3" class="w-3 h-3 text-rojigualda-red dark:text-rojigualda-gold"></i>
            <span>Escribir</span>
          </button>
          <button 
            id="subBtnVerboChoice" 
            onclick="app.setVerboSub('choice')"
            class="px-3 py-1 rounded-lg font-medium text-day-muted dark:text-night-muted hover:text-day-text dark:hover:text-night-text transition flex items-center gap-1.5"
          >
            <i data-lucide="zap" class="w-3 h-3"></i>
            <span>Opción</span>
          </button>
          <button 
            id="subBtnVerboTable" 
            onclick="app.setVerboSub('table')"
            class="px-3 py-1 rounded-lg font-medium text-day-muted dark:text-night-muted hover:text-day-text dark:hover:text-night-text transition flex items-center gap-1.5"
          >
            <i data-lucide="table" class="w-3 h-3"></i>
            <span>Tablas</span>
          </button>
          <button 
            id="subBtnVerboMistakes" 
            onclick="app.setVerboSub('mistakes')"
            class="px-3 py-1 rounded-lg font-medium text-day-muted dark:text-night-muted hover:text-day-text dark:hover:text-night-text transition flex items-center gap-1.5"
          >
            <i data-lucide="alert-circle" class="w-3 h-3 text-rose-500"></i>
            <span>Errores (<span id="badgeMistakesTotal">0</span>)</span>
          </button>
        </div>

        <div id="subActionRight" class="pl-2">
          <!-- Botón de acción contextual dinámica -->
        </div>

      </div>

    </div>
  </header>

  <!-- ============================================================== -->
  <!-- CONTENEDOR CENTRAL DINÁMICO                                    -->
  <!-- ============================================================== -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-4 flex flex-col justify-start">

    <!-- ============================================================= -->
    <!-- CAPA 1.A: TARJETAS                                            -->
    <!-- ============================================================= -->
    <section id="viewTarjetas" class="flex-1 flex flex-col gap-3">
      
      <!-- SUB-VISTA 1: PRÁCTICA 3D -->
      <div id="subViewCardsStudy" class="flex-1 flex flex-col justify-center gap-3">
        
        <!-- Progreso y Contadores -->
        <div class="flex items-center justify-between text-[11px] font-mono text-day-muted dark:text-night-muted px-1">
          <div class="flex items-center gap-2">
            <span id="fcIdxIndicator">1 / 1</span>
            <span id="fcStudyModeFilterPill" class="hidden px-1.5 py-0.2 rounded bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 font-sans font-bold text-[10px]">
              ⭐ Solo Guardadas
            </span>
          </div>
          <div class="flex items-center gap-2 font-sans font-medium text-[10px]">
            <span class="text-emerald-600 dark:text-emerald-400 font-bold" id="fcCountMastered">0</span> Dominadas
            <span>&bull;</span>
            <span class="text-amber-600 dark:text-amber-400 font-bold" id="fcCountReview">0</span> Repasar
          </div>
        </div>

        <div class="w-full bg-day-surface dark:bg-night-surface rounded-full h-1 overflow-hidden">
          <div id="fcBar" class="h-full bg-rojigualda-red dark:bg-rojigualda-gold transition-all duration-200 w-0"></div>
        </div>

        <!-- Tarjeta 3D -->
        <div class="perspective-1000 w-full h-64 sm:h-72 landscape-card cursor-pointer select-none" onclick="app.flipCard()">
          <div id="flashcardEl" class="relative w-full h-full transform-style-3d transition-transform duration-300 rounded-2xl border border-day-border dark:border-night-border shadow-xs bg-day-card dark:bg-night-card">
            
            <!-- ANVERSO (Español) -->
            <div class="absolute inset-0 w-full h-full rounded-2xl p-6 flex flex-col justify-between backface-hidden bg-day-card dark:bg-night-card">
              <div class="flex items-center justify-between text-xs">
                <span id="fcGrammarPill" class="text-[10px] font-mono uppercase tracking-wider text-day-muted dark:text-night-muted"></span>
                <div class="flex items-center gap-1.5">
                  <button 
                    type="button" 
                    id="fcStarBtn"
                    onclick="event.stopPropagation(); app.toggleSaveCurrentWord();" 
                    class="p-1.5 rounded-lg text-day-muted dark:text-night-muted hover:text-amber-500 transition"
                    title="Guardar palabra"
                  >
                    <i data-lucide="star" class="w-4 h-4"></i>
                  </button>
                  <button 
                    type="button" 
                    onclick="event.stopPropagation(); app.speakTerm();" 
                    class="p-1.5 rounded-lg text-day-muted dark:text-night-muted hover:text-rojigualda-red dark:hover:text-rojigualda-gold transition"
                  >
                    <i data-lucide="volume-2" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <div class="text-center my-auto">
                <h2 id="fcTerm" class="text-3xl sm:text-4xl landscape-shrink font-serif font-bold tracking-tight"></h2>
                <div id="fcIpa" class="font-mono text-xs text-day-muted dark:text-night-muted mt-1"></div>
              </div>

              <div class="flex items-center justify-center text-[11px] text-day-muted dark:text-night-muted">
                <i data-lucide="corner-down-right" class="w-3 h-3 mr-1 opacity-60"></i>
                <span>Girar</span>
              </div>
            </div>

            <!-- REVERSO (Traducción & Contexto) -->
            <div class="absolute inset-0 w-full h-full rounded-2xl p-6 flex flex-col justify-between backface-hidden rotate-y-180 bg-day-card dark:bg-night-card border-t-2 border-rojigualda-red dark:border-rojigualda-gold">
              <div class="flex items-center justify-between text-xs">
                <span class="text-[10px] font-mono uppercase tracking-wider text-rojigualda-red dark:text-rojigualda-gold">Significado</span>
                <button 
                  type="button" 
                  onclick="event.stopPropagation(); app.speakSentence();" 
                  class="p-1.5 rounded-lg text-day-muted dark:text-night-muted hover:text-rojigualda-red dark:hover:text-rojigualda-gold transition"
                >
                  <i data-lucide="volume-2" class="w-4 h-4"></i>
                </button>
              </div>

              <div class="my-auto space-y-2 text-center">
                <h3 id="fcMeaning" class="text-xl sm:text-2xl font-bold font-serif text-day-text dark:text-night-text"></h3>
                <p id="fcExample" class="text-xs sm:text-sm text-day-muted dark:text-night-muted italic leading-relaxed px-2"></p>
              </div>

              <div class="text-center text-[10px] text-day-muted dark:text-night-muted">
                <span>1 Repasar &bull; 2 Dominada</span>
              </div>
            </div>

          </div>
        </div>

        <!-- Controles Inferiores -->
        <div class="grid grid-cols-5 gap-1.5">
          <button onclick="app.prevCard()" class="p-3 rounded-xl border border-day-border dark:border-night-border bg-day-card dark:bg-night-card flex items-center justify-center hover:bg-day-surface dark:hover:bg-night-surface transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
          </button>
          <button onclick="app.rateCard(false)" class="p-3 rounded-xl border border-amber-300 dark:border-amber-900/60 bg-amber-50/50 dark:bg-amber-950/20 text-amber-800 dark:text-amber-300 text-xs font-bold transition flex items-center justify-center gap-1">
            <span>Repasar</span>
          </button>
          <button onclick="app.flipCard()" class="p-3 rounded-xl bg-day-surface dark:bg-night-surface border border-day-border dark:border-night-border text-xs font-bold transition flex items-center justify-center">
            <i data-lucide="repeat" class="w-4 h-4"></i>
          </button>
          <button onclick="app.rateCard(true)" class="p-3 rounded-xl border border-emerald-300 dark:border-emerald-900/60 bg-emerald-50/50 dark:bg-emerald-950/20 text-emerald-800 dark:text-emerald-300 text-xs font-bold transition flex items-center justify-center gap-1">
            <span>Dominada</span>
          </button>
          <button onclick="app.nextCard()" class="p-3 rounded-xl border border-day-border dark:border-night-border bg-day-card dark:bg-night-card flex items-center justify-center hover:bg-day-surface dark:hover:bg-night-surface transition">
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </div>

      </div>

      <!-- SUB-VISTA 2: CORPUS COMPLETO -->
      <div id="subViewCardsCorpus" class="hidden flex-1 flex flex-col gap-2">
        <div class="relative">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-day-muted dark:text-night-muted"></i>
          <input 
            type="text" 
            id="corpusFilter" 
            oninput="app.renderCorpusList()"
            placeholder="Buscar en el corpus..." 
            class="w-full pl-8 pr-3 py-2 text-xs bg-day-surface dark:bg-night-surface rounded-xl border border-day-border dark:border-night-border focus:border-rojigualda-red dark:focus:border-rojigualda-gold outline-none transition"
          />
        </div>
        <div id="corpusRows" class="flex-1 max-h-[62vh] overflow-y-auto divide-y divide-day-border/60 dark:divide-night-border/60 rounded-xl border border-day-border dark:border-night-border bg-day-card dark:bg-night-card"></div>
      </div>

      <!-- SUB-VISTA 3: PALABRAS GUARDADAS -->
      <div id="subViewCardsSaved" class="hidden flex-1 flex flex-col gap-2">
        <div class="flex items-center justify-between pb-1">
          <button 
            onclick="app.startSavedPractice()" 
            id="btnDrillSaved"
            class="px-3 py-1.5 rounded-xl bg-rojigualda-red dark:bg-rojigualda-gold text-white dark:text-stone-950 text-xs font-bold transition flex items-center gap-1.5"
          >
            <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
            <span>Practicar Guardadas</span>
          </button>
          <button onclick="app.clearSavedWords()" class="text-xs text-day-muted hover:text-rose-600 transition">
            Vaciar lista
          </button>
        </div>
        <div id="savedWordsRows" class="flex-1 max-h-[62vh] overflow-y-auto divide-y divide-day-border/60 dark:divide-night-border/60 rounded-xl border border-day-border dark:border-night-border bg-day-card dark:bg-night-card"></div>
      </div>

    </section>

    <!-- ============================================================= -->
    <!-- CAPA 1.B: VERBO                                               -->
    <!-- ============================================================= -->
    <section id="viewVerbo" class="hidden flex-1 flex flex-col gap-3">
      
      <!-- SUB-VISTA 1: ESCRIBIR (FULL DRILL) -->
      <div id="subViewVerboDrill" class="flex-1 flex flex-col justify-center gap-4">
        
        <div class="bg-day-card dark:bg-night-card rounded-2xl p-6 border border-day-border dark:border-night-border shadow-xs text-center space-y-2">
          <div class="flex flex-col sm:flex-row items-center justify-between gap-1 text-[11px] font-mono text-day-muted dark:text-night-muted">
            <span id="drillTenseBadge" class="font-bold text-rojigualda-red dark:text-rojigualda-gold">Presente de Indicativo</span>
            <span id="drillPronounBadge" class="text-stone-700 dark:text-stone-300 font-bold">yo</span>
          </div>

          <div class="flex items-center justify-center gap-2">
            <h2 id="drillInfinitive" class="text-3xl sm:text-4xl font-serif font-bold">tener</h2>
            <button onclick="app.speak(app.currentDrill.verb.infinitive)" class="p-1 text-day-muted hover:text-day-text transition">
              <i data-lucide="volume-2" class="w-4 h-4"></i>
            </button>
          </div>
          <p id="drillEnglish" class="text-xs text-day-muted dark:text-night-muted"></p>
        </div>

        <!-- Entrada & Teclado de Acentos -->
        <form onsubmit="app.submitDrill(event)" class="space-y-2">
          <div class="relative">
            <input 
              type="text" 
              id="drillInput"
              autocomplete="off" 
              autocorrect="off" 
              spellcheck="false"
              placeholder="Escribe la conjugación..." 
              class="w-full text-center text-lg sm:text-xl font-bold py-3.5 px-4 rounded-xl border border-day-border dark:border-night-border bg-day-card dark:bg-night-card focus:border-rojigualda-red dark:focus:border-rojigualda-gold outline-none transition"
            />
            <button 
              type="button" 
              id="drillListenAnswerBtn"
              onclick="app.speak(app.currentDrill.target)" 
              class="hidden absolute right-3 top-1/2 -translate-y-1/2 p-1.5 text-day-muted hover:text-day-text transition"
            >
              <i data-lucide="volume-2" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="flex justify-center gap-1">
            <button type="button" onclick="app.insertChar('á')" class="w-7 h-7 rounded-lg bg-day-surface dark:bg-night-surface text-xs font-semibold hover:border hover:border-day-border">á</button>
            <button type="button" onclick="app.insertChar('é')" class="w-7 h-7 rounded-lg bg-day-surface dark:bg-night-surface text-xs font-semibold hover:border hover:border-day-border">é</button>
            <button type="button" onclick="app.insertChar('í')" class="w-7 h-7 rounded-lg bg-day-surface dark:bg-night-surface text-xs font-semibold hover:border hover:border-day-border">í</button>
            <button type="button" onclick="app.insertChar('ó')" class="w-7 h-7 rounded-lg bg-day-surface dark:bg-night-surface text-xs font-semibold hover:border hover:border-day-border">ó</button>
            <button type="button" onclick="app.insertChar('ú')" class="w-7 h-7 rounded-lg bg-day-surface dark:bg-night-surface text-xs font-semibold hover:border hover:border-day-border">ú</button>
            <button type="button" onclick="app.insertChar('ñ')" class="w-7 h-7 rounded-lg bg-day-surface dark:bg-night-surface text-xs font-semibold hover:border hover:border-day-border">ñ</button>
            <button type="button" onclick="app.insertChar('ü')" class="w-7 h-7 rounded-lg bg-day-surface dark:bg-night-surface text-xs font-semibold hover:border hover:border-day-border">ü</button>
          </div>

          <div class="flex gap-2 pt-1">
            <button 
              type="submit" 
              id="drillActionBtn"
              class="flex-1 py-3 rounded-xl bg-rojigualda-red dark:bg-rojigualda-gold text-white dark:text-stone-950 font-bold text-xs transition active:scale-98"
            >
              Comprobar
            </button>
            <button 
              type="button" 
              onclick="app.nextDrill()" 
              class="px-4 py-3 rounded-xl border border-day-border dark:border-night-border bg-day-card dark:bg-night-card text-day-muted hover:text-day-text text-xs transition"
            >
              Pasar
            </button>
          </div>
        </form>

        <div id="drillFeedback" class="hidden p-3 rounded-xl text-center text-xs font-semibold border transition"></div>

      </div>

      <!-- SUB-VISTA 2: OPCIÓN MÚLTIPLE -->
      <div id="subViewVerboChoice" class="hidden flex-1 flex flex-col justify-center gap-3">
        <div class="bg-day-card dark:bg-night-card rounded-2xl p-5 border border-day-border dark:border-night-border text-center space-y-1">
          <div class="flex flex-col sm:flex-row items-center justify-between text-[11px] font-mono text-day-muted dark:text-night-muted">
            <span id="choiceTenseBadge" class="font-bold text-rojigualda-red dark:text-rojigualda-gold"></span>
            <span id="choicePronounBadge" class="text-stone-700 dark:text-stone-300 font-bold"></span>
          </div>
          <h2 id="choiceInfinitive" class="text-2xl font-serif font-bold"></h2>
        </div>

        <div id="choiceGrid" class="grid grid-cols-2 gap-2"></div>

          subj_pres: ['viva', 'vivas', 'viva', 'vivamos', 'viváis', 'vivan'],
          subj_pret_imp: ['viviera', 'vivieras', 'viviera', 'viviéramos', 'vivierais', 'vivieran']
        }
      }
    ];

    const SEED_BACKUP = [
      { word: 'el software', meaningEn: 'software', example: 'Es necesario actualizar el software.', ipa: '[softweɾ]', grammar: 'sustantivo masc.' },
      { word: 'el algoritmo', meaningEn: 'algorithm', example: 'El algoritmo optimiza el rendimiento.', ipa: '[alɣoˈɾidmo]', grammar: 'sustantivo masc.' },
      { word: 'la aleación', meaningEn: 'alloy', example: 'La pieza está compuesta por una aleación.', ipa: '[aleaˈθjon]', grammar: 'sustantivo fem.' },
      { word: 'el análisis', meaningEn: 'analysis', example: 'El análisis confirmó los resultados.', ipa: '[aˈnalisis]', grammar: 'sustantivo masc.' },
      { word: 'el dispositivo', meaningEn: 'device', example: 'Conectó el dispositivo a la red.', ipa: '[disposiˈtiβo]', grammar: 'sustantivo masc.' },
      { word: 'la batería', meaningEn: 'battery', example: 'La batería tiene gran autonomía.', ipa: '[bateˈɾia]', grammar: 'sustantivo fem.' },
      { word: 'el desarrollo', meaningEn: 'development', example: 'El desarrollo avanzó rápidamente.', ipa: '[desaˈroʎo]', grammar: 'sustantivo masc.' },
      { word: 'la energía renovable', meaningEn: 'renewable energy', example: 'España invierte en energía renovable.', ipa: '[eneɾˈxia renoˈβaβle]', grammar: 'sustantivo fem.' },
      { word: 'el microscopio', meaningEn: 'microscope', example: 'Examinaron la muestra con microscopio.', ipa: '[mikɾosˈkopjo]', grammar: 'sustantivo masc.' },
      { word: 'la alteración', meaningEn: 'alteration / mutation', example: 'No se detectó alteración genética.', ipa: '[alteɾaˈθjon]', grammar: 'sustantivo fem.' }
    ];

    function normalize(s) {
      return (s || '').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    class App {
      constructor() {
        this.mainView = 'tarjetas';
        this.tarjetasSub = 'study';
        this.verboSub = 'drill';
        
        this.corpus = [...SEED_BACKUP];
        this.activeDeck = [...this.corpus];
        this.cardIdx = 0;
        this.isFlipped = false;
        
        // Memoria Persistente de Guardadas & Errores
        this.savedWords = new Set(JSON.parse(localStorage.getItem('esp_saved_words') || '[]'));
        this.masteredCards = new Set(JSON.parse(localStorage.getItem('esp_mastered_cards') || '[]'));
        this.reviewCards = new Set(JSON.parse(localStorage.getItem('esp_review_cards') || '[]'));
        this.mistakesVault = JSON.parse(localStorage.getItem('esp_verb_mistakes') || '[]');
        
        this.currentDrill = null;
        this.choiceItem = null;
        this.isDrillingMistakesOnly = false;
        this.isDrillingSavedOnly = false;

        this.sfx = true;
        this.audioCtx = null;
      }

      async init() {
        this.initTheme();
        this.initTablePicker();
        await this.loadCorpusFile();
        this.updateBadges();
        this.renderCard();
        this.newDrill();
        this.newChoice();
        this.setupKeyboard();
        lucide.createIcons();
      }

      /* Auto-detección del archivo corpus.txt en el mismo directorio */
      async loadCorpusFile() {
        try {
          const res = await fetch('corpus.txt', { cache: 'no-cache' });
          if (!res.ok) throw new Error();
          const txt = await res.text();
          if (txt && !txt.trim().startsWith('<!DOCTYPE')) {
            const lines = txt.replace(/^\uFEFF/, '').split(/\r?\n/);
            const items = [];
            for (let l of lines) {
              l = l.trim();
              if (!l || l.startsWith('#')) continue;
              const parts = l.includes('\t') ? l.split('\t') : l.split('|');
              if (parts.length >= 2) {
                items.push({
                  word: parts[0].trim(),
                  meaningEn: parts[1].trim(),
                  example: parts[2] ? parts[2].trim() : '',
                  ipa: '',
                  grammar: parts[0].trim().startsWith('la ') ? 'sustantivo fem.' : 'sustantivo masc.'
                });
              }
            }
            if (items.length > 0) {
              this.corpus = items;
              this.activeDeck = [...this.corpus];
            }
          }
        } catch (_) {}
        this.updateBadges();
        this.renderCorpusList();
      }

      initTheme() {
        const dark = localStorage.getItem('esp_theme') === 'dark' || 
          (!localStorage.getItem('esp_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      }

      toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('esp_theme', isDark ? 'dark' : 'light');
        lucide.createIcons();
      }

      toggleSound() {
        this.sfx = !this.sfx;
        const icon = document.getElementById('sfxIcon');
        if (icon) {
          icon.setAttribute('data-lucide', this.sfx ? 'volume-2' : 'volume-x');
          lucide.createIcons();
        }
      }

      speak(text) {
        if (!('speechSynthesis' in window) || !text) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'es-ES';
        u.rate = 0.95;
        window.speechSynthesis.speak(u);
      }

      beep(freq, duration = 0.1) {
        if (!this.sfx) return;
        try {
          if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = this.audioCtx.createOscillator();
          const g = this.audioCtx.createGain();
          osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
          g.gain.setValueAtTime(0.08, this.audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.0001, this.audioCtx.currentTime + duration);
          osc.connect(g);
          g.connect(this.audioCtx.destination);
          osc.start();
          osc.stop(this.audioCtx.currentTime + duration);
        } catch (_) {}
      }

      /* NAVEGACIÓN CAPA 1 & 2 COHESIVA */
      setMainView(view) {
        this.mainView = view;
        const isTarjetas = view === 'tarjetas';
        
        document.getElementById('viewTarjetas').classList.toggle('hidden', !isTarjetas);
        document.getElementById('viewVerbo').classList.toggle('hidden', isTarjetas);
        document.getElementById('subNavTarjetas').classList.toggle('hidden', !isTarjetas);
        document.getElementById('subNavVerbo').classList.toggle('hidden', isTarjetas);

        document.getElementById('tabBtnTarjetas').className = isTarjetas 
          ? "flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-white dark:bg-night-card text-rojigualda-red dark:text-rojigualda-gold shadow-xs"
          : "flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-semibold text-day-muted dark:text-night-muted hover:text-day-text dark:hover:text-night-text transition-all";
        
        document.getElementById('tabBtnVerbo').className = !isTarjetas
          ? "flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all bg-white dark:bg-night-card text-rojigualda-red dark:text-rojigualda-gold shadow-xs"
          : "flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-xs font-semibold text-day-muted dark:text-night-muted hover:text-day-text dark:hover:text-night-text transition-all";

        this.updateContextAction();
        lucide.createIcons();
      }

      setTarjetasSub(sub) {
        this.tarjetasSub = sub;
        document.getElementById('subViewCardsStudy').classList.toggle('hidden', sub !== 'study');
        document.getElementById('subViewCardsCorpus').classList.toggle('hidden', sub !== 'corpus');
        document.getElementById('subViewCardsSaved').classList.toggle('hidden', sub !== 'saved');

        const map = { study: 'subBtnCardsStudy', corpus: 'subBtnCardsCorpus', saved: 'subBtnCardsSaved' };
        Object.keys(map).forEach(key => {
          const el = document.getElementById(map[key]);
          if (el) {
            el.className = key === sub
              ? "px-3 py-1 rounded-lg font-bold bg-day-surface dark:bg-night-surface text-day-text dark:text-night-text transition flex items-center gap-1.5"
              : "px-3 py-1 rounded-lg font-medium text-day-muted dark:text-night-muted hover:text-day-text dark:hover:text-night-text transition flex items-center gap-1.5";
          }
        });

        if (sub === 'corpus') this.renderCorpusList();
        if (sub === 'saved') this.renderSavedList();
        this.updateContextAction();
        lucide.createIcons();
      }

      setVerboSub(sub) {
        this.verboSub = sub;
        document.getElementById('subViewVerboDrill').classList.toggle('hidden', sub !== 'drill');
        document.getElementById('subViewVerboChoice').classList.toggle('hidden', sub !== 'choice');
        document.getElementById('subViewVerboTable').classList.toggle('hidden', sub !== 'table');
        document.getElementById('subViewVerboMistakes').classList.toggle('hidden', sub !== 'mistakes');

        const map = { drill: 'subBtnVerboDrill', choice: 'subBtnVerboChoice', table: 'subBtnVerboTable', mistakes: 'subBtnVerboMistakes' };
        Object.keys(map).forEach(key => {
          const el = document.getElementById(map[key]);
          if (el) {
            el.className = key === sub
              ? "px-3 py-1 rounded-lg font-bold bg-day-surface dark:bg-night-surface text-day-text dark:text-night-text transition flex items-center gap-1.5"
              : "px-3 py-1 rounded-lg font-medium text-day-muted dark:text-night-muted hover:text-day-text dark:hover:text-night-text transition flex items-center gap-1.5";
          }
        });

        if (sub === 'table') this.renderTable(document.getElementById('tableVerbPicker').value);
        if (sub === 'mistakes') this.renderMistakesList();
        this.updateContextAction();
        lucide.createIcons();
      }

      updateContextAction() {
        const box = document.getElementById('subActionRight');
        if (!box) return;
        box.innerHTML = '';

        if (this.mainView === 'tarjetas' && this.tarjetasSub === 'study') {
          box.innerHTML = `
            <button onclick="app.shuffleCards()" class="p-1 text-day-muted dark:text-night-muted hover:text-day-text dark:hover:text-night-text transition" title="Barajar">
              <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
            </button>
          `;
        }
        lucide.createIcons();
      }

      updateBadges() {
        document.getElementById('badgeCorpusTotal').innerText = this.corpus.length;
        document.getElementById('badgeSavedTotal').innerText = this.savedWords.size;
        document.getElementById('badgeMistakesTotal').innerText = this.mistakesVault.length;
      }

      /* TARJETAS & GUARDADAS */
      renderCard() {
        if (!this.activeDeck.length) return;
        this.isFlipped = false;
        document.getElementById('flashcardEl').classList.remove('rotate-y-180');

        const item = this.activeDeck[this.cardIdx];
        document.getElementById('fcTerm').innerText = item.word;
        document.getElementById('fcIpa').innerText = item.ipa || '';
        document.getElementById('fcGrammarPill').innerText = item.grammar || '';
        document.getElementById('fcMeaning').innerText = item.meaningEn;
        document.getElementById('fcExample').innerText = item.example ? `"${item.example}"` : '';

        const len = this.activeDeck.length;
        document.getElementById('fcIdxIndicator').innerText = `${this.cardIdx + 1} / ${len}`;
        document.getElementById('fcBar').style.width = `${((this.cardIdx + 1) / len) * 100}%`;
        document.getElementById('fcCountMastered').innerText = this.masteredCards.size;
        document.getElementById('fcCountReview').innerText = this.reviewCards.size;

        const starBtn = document.getElementById('fcStarBtn');
        if (starBtn) {
          const isStarred = this.savedWords.has(item.word);
          starBtn.className = isStarred 
            ? "p-1.5 rounded-lg text-amber-500 transition" 
            : "p-1.5 rounded-lg text-day-muted dark:text-night-muted hover:text-amber-500 transition";
          starBtn.innerHTML = `<i data-lucide="star" class="w-4 h-4 ${isStarred ? 'fill-amber-500' : ''}"></i>`;
        }
        lucide.createIcons();
      }

      flipCard() {
        this.isFlipped = !this.isFlipped;
        document.getElementById('flashcardEl').classList.toggle('rotate-y-180', this.isFlipped);
      }

      nextCard() {
        if (!this.activeDeck.length) return;
        this.cardIdx = (this.cardIdx + 1) % this.activeDeck.length;
        this.renderCard();
      }

      prevCard() {
        if (!this.activeDeck.length) return;
        this.cardIdx = (this.cardIdx - 1 + this.activeDeck.length) % this.activeDeck.length;
        this.renderCard();
      }

      rateCard(mastered) {
        if (!this.activeDeck.length) return;
        const w = this.activeDeck[this.cardIdx].word;
        if (mastered) {
          this.masteredCards.add(w);
          this.reviewCards.delete(w);
          this.beep(520);
        } else {
          this.reviewCards.add(w);
          this.masteredCards.delete(w);
          this.beep(350);
        }
        localStorage.setItem('esp_mastered_cards', JSON.stringify(Array.from(this.masteredCards)));
        localStorage.setItem('esp_review_cards', JSON.stringify(Array.from(this.reviewCards)));
        this.nextCard();
      }

      toggleSaveCurrentWord() {
        if (!this.activeDeck.length) return;
        const w = this.activeDeck[this.cardIdx].word;
        if (this.savedWords.has(w)) {
          this.savedWords.delete(w);
        } else {
          this.savedWords.add(w);
        }
        localStorage.setItem('esp_saved_words', JSON.stringify(Array.from(this.savedWords)));
        this.updateBadges();
        this.renderCard();
      }

      shuffleCards() {
        for (let i = this.activeDeck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [this.activeDeck[i], this.activeDeck[j]] = [this.activeDeck[j], this.activeDeck[i]];
        }
        this.cardIdx = 0;
        this.renderCard();
      }

      speakTerm() {
        if (this.activeDeck.length) this.speak(this.activeDeck[this.cardIdx].word);
      }

      speakSentence() {
        if (this.activeDeck.length && this.activeDeck[this.cardIdx].example) {
          this.speak(this.activeDeck[this.cardIdx].example);
        }
      }

      startSavedPractice() {
        if (this.savedWords.size === 0) return;
        this.activeDeck = this.corpus.filter(x => this.savedWords.has(x.word));
        this.cardIdx = 0;
        this.isDrillingSavedOnly = true;
        document.getElementById('fcStudyModeFilterPill').classList.remove('hidden');
        this.setTarjetasSub('study');
        this.renderCard();
      }

      resetFullDeck() {
        this.activeDeck = [...this.corpus];
        this.cardIdx = 0;
        this.isDrillingSavedOnly = false;
        document.getElementById('fcStudyModeFilterPill').classList.add('hidden');
        this.renderCard();
      }

      renderCorpusList() {
        const q = normalize(document.getElementById('corpusFilter')?.value);
        const rows = document.getElementById('corpusRows');
        if (!rows) return;

        const filtered = this.corpus.filter(i => normalize(i.word).includes(q) || normalize(i.meaningEn).includes(q));
        rows.innerHTML = filtered.map((item, idx) => `
          <div class="px-3.5 py-2.5 flex items-center justify-between text-xs hover:bg-day-surface dark:hover:bg-night-surface transition">
            <div class="min-w-0 pr-2">
              <span class="font-bold text-day-text dark:text-night-text">${item.word}</span>
              <span class="text-day-muted dark:text-night-muted ml-2">${item.meaningEn}</span>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button onclick="app.speak('${item.word.replace(/'/g, "\\'")}')" class="p-1 text-day-muted hover:text-day-text">
                <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="app.pickCorpusCard(${idx})" class="px-2 py-0.5 rounded text-[10px] font-mono bg-day-surface dark:bg-night-surface hover:bg-rojigualda-red hover:text-white transition">
                &rarr;
              </button>
            </div>
          </div>
        `).join('');
        lucide.createIcons();
      }

      pickCorpusCard(idx) {
        this.resetFullDeck();
        this.cardIdx = idx;
        this.setTarjetasSub('study');
        this.renderCard();
      }

      renderSavedList() {
        const rows = document.getElementById('savedWordsRows');
        const btn = document.getElementById('btnDrillSaved');
        if (!rows) return;

        if (this.savedWords.size === 0) {
          rows.innerHTML = `<div class="p-6 text-center text-xs text-day-muted dark:text-night-muted">No tienes palabras guardadas todavía. Marca con ⭐ cualquier tarjeta.</div>`;
          if (btn) btn.disabled = true;
          return;
        }

        if (btn) btn.disabled = false;
        const savedArr = this.corpus.filter(x => this.savedWords.has(x.word));
        rows.innerHTML = savedArr.map(item => `
          <div class="px-3.5 py-2.5 flex items-center justify-between text-xs hover:bg-day-surface dark:hover:bg-night-surface transition">
            <div>
              <span class="font-bold text-day-text dark:text-night-text">${item.word}</span>
              <span class="text-day-muted dark:text-night-muted ml-2">${item.meaningEn}</span>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="app.speak('${item.word.replace(/'/g, "\\'")}')" class="p-1 text-day-muted hover:text-day-text">
                <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="app.removeSavedWord('${item.word.replace(/'/g, "\\'")}')" class="p-1 text-day-muted hover:text-rose-500">
                <i data-lucide="trash" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        `).join('');
        lucide.createIcons();
      }

      removeSavedWord(word) {
        this.savedWords.delete(word);
        localStorage.setItem('esp_saved_words', JSON.stringify(Array.from(this.savedWords)));
        this.updateBadges();
        this.renderSavedList();
      }

      clearSavedWords() {
        this.savedWords.clear();
        localStorage.setItem('esp_saved_words', JSON.stringify([]));
        this.updateBadges();
        this.renderSavedList();
      }

      /* ============================================================== */
      /* VERBO: DRILL, OPCIÓN, TABLAS & REGISTRO DE ERRORES             */
      /* ============================================================== */
      newDrill() {
        let verb, tenseKey, personIdx;

        // Si se activa modo "Practicar Errores"
        if (this.isDrillingMistakesOnly && this.mistakesVault.length > 0) {
          const m = this.mistakesVault[Math.floor(Math.random() * this.mistakesVault.length)];
          verb = VERB_BANK.find(v => v.infinitive === m.infinitive) || VERB_BANK[0];
          tenseKey = m.tenseKey;
          personIdx = m.personIdx;
        } else {
          this.isDrillingMistakesOnly = false;
          verb = VERB_BANK[Math.floor(Math.random() * VERB_BANK.length)];
          const tenseKeys = Object.keys(TENSES);
          tenseKey = tenseKeys[Math.floor(Math.random() * tenseKeys.length)];
          personIdx = Math.floor(Math.random() * 6);
        }

        this.currentDrill = {
          verb,
          tenseKey,
          personIdx,
          target: verb.forms[tenseKey][personIdx]
        };

        document.getElementById('drillInfinitive').innerText = verb.infinitive;
        document.getElementById('drillEnglish').innerText = verb.english;
        document.getElementById('drillTenseBadge').innerText = TENSES[tenseKey];
        document.getElementById('drillPronounBadge').innerText = PRONOUNS[personIdx].label;

        const inp = document.getElementById('drillInput');
        inp.value = '';
        inp.disabled = false;
        inp.className = "w-full text-center text-lg sm:text-xl font-bold py-3.5 px-4 rounded-xl border border-day-border dark:border-night-border bg-day-card dark:bg-night-card focus:border-rojigualda-red dark:focus:border-rojigualda-gold outline-none transition";

        document.getElementById('drillFeedback').classList.add('hidden');
        document.getElementById('drillListenAnswerBtn').classList.add('hidden');
        document.getElementById('drillActionBtn').innerText = 'Comprobar';
        document.getElementById('drillActionBtn').onclick = null;
        inp.focus();
      }

      submitDrill(e) {
        if (e) e.preventDefault();
        const inp = document.getElementById('drillInput');
        if (inp.disabled) {
          this.newDrill();
          return;
        }

        const val = inp.value.trim().toLowerCase();
        if (!val) {
          inp.classList.add('shake-anim');
          setTimeout(() => inp.classList.remove('shake-anim'), 250);
          return;
        }

        const target = this.currentDrill.target.toLowerCase();
        const f = document.getElementById('drillFeedback');
        f.classList.remove('hidden');
        inp.disabled = true;

        const actionBtn = document.getElementById('drillActionBtn');
        actionBtn.innerText = 'Siguiente';
        document.getElementById('drillListenAnswerBtn').classList.remove('hidden');

        if (val === target) {
          this.beep(520);
          f.className = "p-3 rounded-xl text-center text-xs font-bold border border-emerald-300 dark:border-emerald-800 bg-emerald-50 dark:bg-emerald-950/30 text-emerald-800 dark:text-emerald-300";
          f.innerText = '✓ Correcto';
          // Si estaba en la bóveda de errores, eliminarlo al acertar
          this.removeMistake(this.currentDrill.verb.infinitive, this.currentDrill.tenseKey, this.currentDrill.personIdx);
        } else if (normalize(val) === normalize(target)) {
          this.beep(400);
          f.className = "p-3 rounded-xl text-center text-xs font-bold border border-amber-300 dark:border-amber-800 bg-amber-50 dark:bg-amber-950/30 text-amber-800 dark:text-amber-300";
          f.innerText = `Tilde requerida: ${target}`;
          this.logMistake(this.currentDrill, val);
        } else {
          this.beep(240);
          f.className = "p-3 rounded-xl text-center text-xs font-bold border border-rojigualda-red/30 bg-rojigualda-red/10 text-rojigualda-red dark:text-rose-400";
          f.innerText = target;
          this.logMistake(this.currentDrill, val);
        }
      }

      nextDrill() {
        this.newDrill();
      }

      insertChar(c) {
        const inp = document.getElementById('drillInput');
        if (!inp || inp.disabled) return;
        const start = inp.selectionStart || inp.value.length;
        const end = inp.selectionEnd || inp.value.length;
        inp.value = inp.value.substring(0, start) + c + inp.value.substring(end);
        inp.focus();
        inp.selectionStart = inp.selectionEnd = start + 1;
      }

      /* OPCIÓN MÚLTIPLE */
      newChoice() {
        const verb = VERB_BANK[Math.floor(Math.random() * VERB_BANK.length)];
        const tenseKeys = Object.keys(TENSES);
        const tenseKey = tenseKeys[Math.floor(Math.random() * tenseKeys.length)];
        const personIdx = Math.floor(Math.random() * 6);
        const target = verb.forms[tenseKey][personIdx];

        this.choiceItem = { verb, tenseKey, personIdx, target };

        document.getElementById('choiceInfinitive').innerText = verb.infinitive;
        document.getElementById('choiceTenseBadge').innerText = TENSES[tenseKey];
        document.getElementById('choicePronounBadge').innerText = PRONOUNS[personIdx].label;
        document.getElementById('choiceFeedback').classList.add('hidden');

        const opts = new Set([target]);
        for (let i = 0; i < 6; i++) {
          if (i !== personIdx) opts.add(verb.forms[tenseKey][i]);
          if (opts.size >= 4) break;
        }
        while (opts.size < 4) {
          const rV = VERB_BANK[Math.floor(Math.random() * VERB_BANK.length)];
          opts.add(rV.forms[tenseKey][personIdx]);
        }

        const grid = document.getElementById('choiceGrid');
        grid.innerHTML = Array.from(opts).sort(() => Math.random() - 0.5).map(opt => `
          <button 
            type="button" 
            onclick="app.selectChoice('${opt}', '${target}', this)"
            class="p-3.5 rounded-xl border border-day-border dark:border-night-border bg-day-card dark:bg-night-card hover:border-rojigualda-red dark:hover:border-rojigualda-gold font-bold text-sm transition"
          >
            ${opt}
          </button>
        `).join('');
      }

      selectChoice(selected, target, btn) {
        const btns = document.getElementById('choiceGrid').querySelectorAll('button');
        btns.forEach(b => b.disabled = true);
        const f = document.getElementById('choiceFeedback');
        f.classList.remove('hidden');

        if (selected === target) {
          this.beep(520);
          btn.className = "p-3.5 rounded-xl border border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-300 font-bold text-sm";
          f.className = "p-2 rounded-lg text-center text-xs font-bold border border-emerald-300 bg-emerald-50 text-emerald-800 dark:bg-emerald-950/30 dark:text-emerald-300";
          f.innerText = '✓ Correcto';
          this.removeMistake(this.choiceItem.verb.infinitive, this.choiceItem.tenseKey, this.choiceItem.personIdx);
        } else {
          this.beep(240);
          btn.className = "p-3.5 rounded-xl border border-rojigualda-red bg-rojigualda-red/10 text-rojigualda-red font-bold text-sm";
          f.className = "p-2 rounded-lg text-center text-xs font-bold border border-rojigualda-red/30 bg-rojigualda-red/10 text-rojigualda-red";
          f.innerText = target;
          this.logMistake(this.choiceItem, selected);
        }

        setTimeout(() => this.newChoice(), 1100);
      }

      /* REGISTRO & REVISIÓN DE ERRORES */
      logMistake(item, userAttempt) {
        const existing = this.mistakesVault.find(
          m => m.infinitive === item.verb.infinitive && m.tenseKey === item.tenseKey && m.personIdx === item.personIdx
        );
        if (existing) {
          existing.count = (existing.count || 1) + 1;
          existing.lastAttempt = userAttempt;
        } else {
          this.mistakesVault.push({
            infinitive: item.verb.infinitive,
            tenseKey: item.tenseKey,
            tenseName: TENSES[item.tenseKey],
            personIdx: item.personIdx,
            pronoun: PRONOUNS[item.personIdx].label,
            target: item.target,
            lastAttempt: userAttempt,
            count: 1
          });
        }
        localStorage.setItem('esp_verb_mistakes', JSON.stringify(this.mistakesVault));
        this.updateBadges();
      }

      removeMistake(infinitive, tenseKey, personIdx) {
        this.mistakesVault = this.mistakesVault.filter(
          m => !(m.infinitive === infinitive && m.tenseKey === tenseKey && m.personIdx === personIdx)
        );
        localStorage.setItem('esp_verb_mistakes', JSON.stringify(this.mistakesVault));
        this.updateBadges();
      }

      renderMistakesList() {
        const rows = document.getElementById('mistakesRows');
        const btn = document.getElementById('btnDrillMistakes');
        if (!rows) return;

        if (this.mistakesVault.length === 0) {
          rows.innerHTML = `<div class="p-6 text-center text-xs text-day-muted dark:text-night-muted">No tienes errores registrados. Los fallos en ejercicios se guardarán aquí automáticamente.</div>`;
          if (btn) btn.disabled = true;
          return;
        }

        if (btn) btn.disabled = false;
        rows.innerHTML = this.mistakesVault.map(m => `
          <div class="px-3.5 py-2.5 flex items-center justify-between text-xs hover:bg-day-surface dark:hover:bg-night-surface transition">
            <div>
              <div class="flex items-center gap-2">
                <span class="font-bold text-day-text dark:text-night-text">${m.infinitive}</span>
                <span class="text-[10px] text-rojigualda-red dark:text-rojigualda-gold font-mono">${m.tenseName}</span>
                <span class="px-1 py-0.2 rounded bg-rose-100 dark:bg-rose-950 text-rose-800 dark:text-rose-300 font-bold text-[9px]">${m.count}x</span>
              </div>
              <div class="text-[11px] text-day-muted dark:text-night-muted mt-0.5">
                ${m.pronoun} &rarr; <strong class="text-emerald-600 dark:text-emerald-400 font-semibold">${m.target}</strong>
                ${m.lastAttempt ? `<span class="line-through text-rose-400 ml-1">${m.lastAttempt}</span>` : ''}
              </div>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="app.speak('${m.target.replace(/'/g, "\\'")}')" class="p-1 text-day-muted hover:text-day-text">
                <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="app.removeMistake('${m.infinitive}', '${m.tenseKey}', ${m.personIdx}); app.renderMistakesList();" class="p-1 text-day-muted hover:text-rose-500">
                <i data-lucide="trash" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        `).join('');
        lucide.createIcons();
      }

      startMistakesPractice() {
        if (this.mistakesVault.length === 0) return;
        this.isDrillingMistakesOnly = true;
        this.setVerboSub('drill');
        this.newDrill();
      }

      clearMistakes() {
        this.mistakesVault = [];
        localStorage.setItem('esp_verb_mistakes', JSON.stringify([]));
        this.updateBadges();
        this.renderMistakesList();
      }

      /* TABLAS DE CONJUGACIÓN (7 TIEMPOS) */
      initTablePicker() {
        const sel = document.getElementById('tableVerbPicker');
        if (!sel) return;
        sel.innerHTML = VERB_BANK.map(v => `<option value="${v.infinitive}">${v.infinitive.toUpperCase()} — ${v.english}</option>`).join('');
      }

      renderTable(infinitive) {
        const verb = VERB_BANK.find(v => v.infinitive === infinitive) || VERB_BANK[0];
        const tbody = document.getElementById('tableBody');
        if (!tbody) return;

        tbody.innerHTML = PRONOUNS.map((p, idx) => `
          <tr class="hover:bg-day-surface dark:hover:bg-night-surface transition cursor-pointer" onclick="app.speak('${p.label} ${verb.forms.pres[idx]}')">
            <td class="p-2 font-mono text-[11px] text-day-muted dark:text-night-muted">${p.label}</td>
            <td class="p-2 font-bold text-rojigualda-red dark:text-rojigualda-gold">${verb.forms.pres[idx]}</td>
            <td class="p-2 font-medium">${verb.forms.pret_indef[idx]}</td>
            <td class="p-2 text-day-muted dark:text-night-muted">${verb.forms.pret_imp[idx]}</td>
            <td class="p-2 text-day-muted dark:text-night-muted">${verb.forms.fut[idx]}</td>
            <td class="p-2 font-medium text-amber-700 dark:text-amber-400">${verb.forms.cond[idx]}</td>
            <td class="p-2 font-semibold text-emerald-700 dark:text-emerald-400">${verb.forms.subj_pres[idx]}</td>
            <td class="p-2 font-semibold text-indigo-700 dark:text-indigo-400">${verb.forms.subj_pret_imp[idx]}</td>
          </tr>
        `).join('');
      }

      setupKeyboard() {
        document.addEventListener('keydown', e => {
          if (['INPUT', 'SELECT'].includes(document.activeElement?.tagName)) return;
          if (this.mainView === 'tarjetas' && this.tarjetasSub === 'study') {
            if (e.code === 'Space') { e.preventDefault(); this.flipCard(); }
            else if (e.code === 'ArrowRight') this.nextCard();
            else if (e.code === 'ArrowLeft') this.prevCard();
            else if (e.key === '1') this.rateCard(false);
            else if (e.key === '2') this.rateCard(true);
          }
        });
      }
    }

    let app;
    window.addEventListener('DOMContentLoaded', () => {
      app = new App();
      app.init();
    });
  </script>
</body>
</html>
