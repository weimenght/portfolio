ur next 1:1, play back what you heard before you reply.", "下一次一对一沟通时，先复述你听到的，再回应。", "En tu próxima reunión 1:1, devuelve lo que escuchaste antes de responder.", "西语保留了团队里已经在用的“1:1”；中文则写成“一对一沟通”。"]], "noteCol": true, "aria": "一个练习，三个房间"}, {"type": "cards", "kicker": "每一次本地化的原则", "title": "本地化一个学习时刻的<span class=\"acc\">六条<\/span>原则", "items": [{"k": "01", "t": "本地化的是时刻，不是字词", "d": "先问这句话要为眼前的人做到什么——再用他们的语言写出来。"}, {"k": "02", "t": "注意直接程度和层级", "d": "在一种文化里友好的提问，在另一种文化里可能像考试。有意识地柔化或加强。"}, {"k": "03", "t": "名字、地点和例子要本地化", "d": "设定在达拉斯销售团队的情境，放到成都的工厂里不会有共鸣。"}, {"k": "04", "t": "刻意选择语域", "d": "你还是您，tú 还是 usted：同伴一起练习时用非正式的称呼。"}, {"k": "05", "t": "留意性别和单复数", "d": "西语的“escuchado”默认是男性。引导时读作“escuchado/a”——并说出来。"}, {"k": "06", "t": "在每种语言里都找真实的搭档测试", "d": "母语审校能发现措辞问题，只有真实测试才能发现时刻对不对。"}]}, {"type": "cta", "kicker": "打开原版", "links": [{"l": "试试倾听二重奏", "href": "/free_builder/listen"}, {"l": "与 FREE//BUILDER 合作", "href": "/free_builder/#contact"}]}]}, "es": {"title": "Adaptado, no traducido — FREE//BUILDER", "blocks": [{"type": "lead", "kicker": "Adaptar · Tres idiomas, tres salas", "title": "Adaptado, no <span class=\"acc\">traducido<\/span>.", "text": "La misma actividad tiene que sonar natural en una sala de Shanghái, Madrid y Londres. Estas son frases reales del Dúo de escucha en los tres idiomas, y el porqué de cada decisión.", "meta": ["EN · 中文 · ES", "del Dúo de escucha", "revisado por hablantes nativos antes de publicar"]}, {"type": "table", "kicker": "Lado a lado", "title": "Una actividad, tres salas", "text": "Cada frase se escribió para su idioma y luego se contrastó con las otras, no se pasó por un traductor.", "cols": ["Momento", "English", "中文", "Español", "Por qué suena así"], "rows": [["Devolver", "“What I heard is…”", "“我听到的是……”", "“Lo que escuché es…”", "Corto y oral. El inicio de frase es un pasamanos, no un guion."], ["Sentimiento", "“I imagine you felt…”", "“我能想象你当时觉得……”", "“Me imagino que sentiste…”", "El chino añade 当时 («en ese momento») para que la suposición sea sobre el momento, no sobre el carácter: menos presuntuoso."], ["La comprobación", "“Did you feel heard?”", "“你觉得被听见了吗？”", "“¿Te sentiste escuchado?”", "El chino dice 被听见 (ser oído) en vez de 被理解 (ser comprendido): pide menos y es más honesto."], ["Tercera respuesta", "wants another try", "还想再说说", "quiere otra oportunidad", "Los primeros borradores decían «no escuchado». Ahora las tres versiones describen un deseo, no un fallo: 还想再说说 es «aún quiero decir más»."], ["Frase del lunes", "In your next 1:1, play back what you heard before you reply.", "下一次一对一沟通时，先复述你听到的，再回应。", "En tu próxima reunión 1:1, devuelve lo que escuchaste antes de responder.", "El español mantiene «1:1», que los equipos ya usan; el chino lo escribe como 一对一沟通."]], "noteCol": true, "aria": "Una actividad, tres salas"}, {"type": "cards", "kicker": "Lo que guía cada adaptación", "title": "Seis reglas para <span class=\"acc\">adaptar<\/span> un momento de aprendizaje", "items": [{"k": "01", "t": "Adapta el momento, no las palabras", "d": "Pregúntate qué tiene que hacer la frase por la persona que tienes delante y escríbelo en su idioma."}, {"k": "02", "t": "Cuida la franqueza y la jerarquía", "d": "Una pregunta amable en una cultura puede sonar a examen en otra. Suaviza o afila a propósito."}, {"k": "03", "t": "Nombres, lugares y ejemplos locales", "d": "Un caso ambientado en un equipo de ventas de Dallas no funcionará en una fábrica de Chengdu."}, {"k": "04", "t": "Elige el registro a propósito", "d": "你 o 您, tú o usted: entre colegas que practican, la forma informal."}, {"k": "05", "t": "Atención al género y al número", "d": "«Escuchado» asume un hombre. Al facilitar, léelo como «escuchado/a», y dilo."}, {"k": "06", "t": "Prueba con parejas reales en cada idioma", "d": "La revisión nativa detecta las palabras. Solo la prueba real detecta el momento."}]}, {"type": "cta", "kicker": "Abre el original", "links": [{"l": "Prueba el Dúo de escucha", "href": "/free_builder/listen"}, {"l": "Trabajar c   quote: b => `<p class="quote">“${esc(b.text)}”</p>${b.by ? `<p class="note" style="margin-top:8px">${esc(b.by)}</p>` : ""}`,
  note: b => `<p class="note">${esc(b.text)}</p>`,
  html: b => b.html,
  cta: b => B.head(b) + `<div class="cta">${b.links.map((l, i) => `<a class="${i === 0 ? "pri" : ""}" href="${l.href}"${l.download ? " download" : ""}>${esc(l.l)} ${l.download ? "↓" : "↗"}</a>`).join("")}</div>`
};
function render() {
  const s = P[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.title = s.title;
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("main").innerHTML = s.blocks.map((b, i) => i === 0 ? B[b.type](b) : `<section${b.id ? ` id="${b.id}"` : ""}${b.noprint ? ' class="noprint"' : ""}>${B[b.type](b)}</section>`).join("");
  if (window.__after) window.__after(lang, s);
  try { localStorage.setItem("wm_preferred_lang", lang); localStorage.setItem("wm_cases_lang", lang); } catch (e) {}
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; render(); }));
let saved = null; try { saved = localStorage.getItem("wm_preferred_lang") || localStorage.getItem("wm_cases_lang"); } catch (e) {}
const nav = (navigator.language || "").toLowerCase();
lang = ["en", "zh", "es"].includes(saved) ? saved : nav.startsWith("zh") ? "zh" : nav.startsWith("es") ? "es" : "en";

render();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/free_builder/sw.js", { scope: "/free_builder/" }).catch(() => {});
})();
</script>
