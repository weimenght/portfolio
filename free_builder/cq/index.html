    const CASES = [
      { id: 1, title: 'The vanishing roadblock', tag: 'Bad news & hierarchy',
        a: { city: 'San Francisco', ll: [-122.42, 37.77] }, b: { city: 'Bengaluru', ll: [77.59, 12.97] },
        transcript: [
          ['Alex · Engineering manager, San Francisco', 'Shipping the auth service tomorrow. Any blockers?'],
          ['Rohan · Tech lead, Bengaluru (vendor team)', 'The team is actively analysing the payload flows. All good on our side.'],
          ['Alex · next day', 'The build broke on a legacy schema dependency! Why wasn\'t this flagged yesterday?'],
          ['Rohan', 'We worked through the night to fix it without alarming your leadership.']],
        intent: ['Alex', 'I asked directly about blockers. Raising risk early is the job, and bad news early is good news.'],
        impact: ['Rohan', 'Flagging a blocker in an open channel, to the client\'s manager, felt like failing in public. “Actively analysing” was my signal that something was wrong.'],
        lenses: {
          culture: 'Erin Meyer\'s Culture Map places India toward the hierarchical end of its “Leading” scale and the US toward the egalitarian end, on average. Taking an unsolved problem to someone senior can feel like a failure of duty.',
          power: 'Rohan works for a vendor. Admitting a blocker to the client\'s manager can feel like risking the contract, in any country.',
          person: 'Rohan is proud of his team\'s craft and didn\'t want his junior engineers blamed.' },
        options: [
          { q: 'best', text: 'In a private 1:1, ask: “What\'s one dependency outside your team\'s control that I can push through this week?”', fx: { subtext: 2, humility: 1, thirdCulture: 1 },
            why: 'You made raising a problem an act of asking for help, in private. That\'s safe for a vendor lead and honest about who owns the risk.' },
          { q: 'ok', text: 'Add a “risks” column to the stand-up board so anyone can flag issues without saying them out loud.', fx: { thirdCulture: 2 },
            why: 'A useful structural fix. It works best alongside a conversation that makes flagging feel safe.' },
          { q: 'poor', text: 'Post in the team channel: “Please flag blockers immediately, even small ones. No exceptions.”', fx: { humility: -1, calibration: -1 },
            why: 'Reasonable to you, but a public rule straight after a public miss reads as a reprimand. People hide problems better, not sooner.' }],
        script: 'Rohan, part of my job is clearing things your team can\'t control. What\'s one dependency I can push through for you this week?' },

      { id: 2, title: 'The blunt code review', tag: 'Feedback & tone',
        a: { city: 'Amsterdam', ll: [4.90, 52.37] }, b: { city: 'São Paulo', ll: [-46.63, -23.55] },
        transcript: [
          ['Daan · Staff engineer, Amsterdam', 'PR review: “This implementation is unacceptable. Scrap the ORM pattern and rewrite it.”'],
          ['Thiago · Senior developer, São Paulo', 'Acknowledged.'],
          ['Daan · later that week', 'Why has Thiago gone quiet on every review since?']],
        intent: ['Daan', 'Code isn\'t a person. Being clear saves everyone hours of back-and-forth.'],
        impact: ['Thiago', 'Not one word about what worked, in a public PR, with “unacceptable”. That isn\'t how you treat a colleague you respect.'],
        lenses: {
          culture: 'On Meyer\'s “Evaluating” scale, the Netherlands sits near the direct end for negative feedback, while Brazil sits further toward indirect, on average.',
          power: 'Written review comments lose tone, and Daan is more senior. Harsh words from above land harder.',
          person: 'Daan writes tersely to everyone, including his manager. Thiago had worked late to get this PR in.' },
        options: [
          { q: 'best', text: 'Keep the standard, change the delivery: say what works, name the issue precisely, and offer a quick call to look at options together.', fx: { calibration: 2, flexibility: 1 },
            why: 'Same bar, different wrapping. Precision plus warmth works for direct and indirect communicators alike.' },
          { q: 'ok', text: 'Agree a team review guide: severity labels (“must fix”, “suggestion”) and one positive note per review.', fx: { thirdCulture: 2, calibration: 1 },
            why: 'A good team-level fix. It doesn\'t repair this moment with Thiago, so pair it with a conversation.' },
          { q: 'poor', text: 'Tell Thiago that reviews here are direct and he\'ll get used to it.', fx: { humility: -2 },
            why: 'It asks one person to absorb all the adjustment. That isn\'t a culture, it\'s a cost.' }],
        script: 'Thiago, the schema work is solid. One concern: the ORM query pattern will struggle at peak load. Got ten minutes to look at options together?' },

      { id: 3, title: 'The four-second silence', tag: 'Silence & turn-taking',
        a: { city: 'London', ll: [-0.13, 51.51] }, b: { city: 'Tokyo', ll: [139.69, 35.69] },
        transcript: [
          ['Harry · Director, London', 'Any objections to retiring the legacy schema next month?'],
          ['Kenji · Architect, Tokyo', '(unmutes… pauses)'],
          ['Harry', 'Great, silence is consent! On to item two.'],
          ['Three days later', 'The Tokyo team flags a critical dependency on the legacy schema.']],
        intent: ['Harry', 'On a video call, silence means agreement. If nobody objects in a couple of seconds, we move on.'],
        impact: ['Kenji', 'I was forming a disagreement in my second language, carefully, so it wouldn\'t embarrass anyone. He moved on before I could speak.'],
        lenses: {
          culture: 'Pausing before disagreeing with a senior person is often described in Japanese business settings. But research on everyday conversation finds turn-taking gaps are similar across languages (Stivers et al., 2009), so don\'t assume the pause was “cultural”.',
          power: 'Harry chairs the call and is the most senior person on it. Objecting to the chair, live and in front of others, is hard anywhere.',
          person: 'Kenji was working in his second language, at 9pm Tokyo time, on a technical point that needed precise wording.' },
        options: [
          { q: 'best', text: 'Pause properly, then invite by name: “Kenji, I\'d like the Tokyo view before we decide. Take a moment.” And accept written objections for 24 hours.', fx: { subtext: 2, flexibility: 1, thirdCulture: 1 },
            why: 'A real pause, a named invitation and a written channel: room for anyone thinking in a second language or wary of contradicting the chair.' },
          { q: 'ok', text: 'Send the decision round by email afterwards and ask for objections by Friday.', fx: { thirdCulture: 1, humility: 1 },
            why: 'Gives people time, but the call itself still taught everyone that silence means yes.' },
          { q: 'poor', text: 'Ask everyone to type +1 or −1 in the chat within ten seconds.', fx: { subtext: -1 },
            why: 'Fast, but it rewards whoever thinks fastest in English, and a −1 in front of the director is still hard.' }],
        script: 'I\'m going to pause here. Kenji, when you\'re ready, I\'d love the Tokyo view on any edge cases.' },

      { id: 4, title: 'The cold ping', tag: 'Trust & relationships',

        impact: ['Carlos', 'Two messages, no hello, no question about how we\'re doing. It feels like I\'m a ticket, not a colleague.'],

        options: [
          { q: 'best', text: 'Call instead of messaging: ask how the team is doing, learn about the outage, then agree a realistic time for the docs.', fx: { humility: 1, flexibility: 2, subtext: 1 },

      { id: 5, title: 'The yes that meant maybe', tag: 'Decoding “yes”',
        a: { city: 'Sydney', ll: [151.21, -33.87] }, b: { city: 'Hanoi', ll: [105.85, 21.03] },
        transcript: [
          ['Liam · Client project manager, Sydney', 'Can you commit to 15 October? Is that possible?'],
          ['Linh · Engineering lead, Hanoi', 'Yes… we will do our best.'],
          ['Liam · 16 October', 'It\'s not live? You said yes!'],
          ['Linh', 'I said we would do our best. The scope needed services we didn\'t have.']],
        intent: ['Liam', 'Yes means yes. If the date was impossible, she should have said no.'],
        impact: ['Linh', 'Saying “no” outright to a client is very hard. “We will do our best”, with a pause, was my warning.'],
        lenses: {
          culture: 'In many high-context settings, Vietnam among them, a direct “no” to a client may be avoided, and “we\'ll do our best” can signal real doubt. Plenty of low-context speakers hedge with the same words.',
          power: 'Liam controls the budget for Linh\'s team. Saying no to the person who pays you is hard everywhere.',
          person: 'Linh had just been promoted and wanted to show she could deliver.' },
        options: [
          { q: 'best', text: 'Replace yes/no questions with open ones: “What would need to be true to hit the 15th? What would you cut to get there?”', fx: { subtext: 2, thirdCulture: 1 },
            why: 'Open questions remove the need to say “no” at all. Risks come out as facts, not refusals.' },
          { q: 'ok', text: 'Ask for a written risk register with every estimate.', fx: { thirdCulture: 1 },
            why: 'Useful paperwork, but if saying no feels unsafe, the biggest risks still go unwritten.' },
          { q: 'poor', text: 'From now on, add 50% to every estimate from the Hanoi team.', fx: { humility: -2 },
            why: 'It quietly labels a whole team as unreliable, and they\'ll notice.' }],
        script: 'Linh, if we aim for 15 October, what are the three things that would have to go perfectly? What would you trade off to get there?' },

        a: { city: 'Paris', ll: [2.35, 48.86] }, b: { city: 'Singapore', ll: [103.82, 1.35] },
        transcript: [
          ['Camille · Design lead, Paris', 'I completely disagree with this user journey. It makes no logical sense!'],
          ['Jia Hui · Product manager, Singapore', '(goes quiet; one-word answers for the rest of the sprint)'],
          ['Camille · at drinks', 'Coming? That was a great debate!']],
        intent: ['Camille', 'Arguing hard about ideas shows I take them seriously. It\'s not personal; we\'re still friends afterwards.'],
        impact: ['Jia Hui', 'Being told my work “makes no logical sense” in front of the team felt like a public attack. A drink doesn\'t undo that.'],
        lenses: {
          culture: 'Meyer\'s “Disagreeing” scale places France toward open confrontation as engagement, and many Southeast and East Asian workplaces toward avoiding open confrontation, on average.',
          power: 'Camille sits at headquarters and has informal influence over regional promotions, which raises the stakes of a public clash.',
          person: 'Jia Hui had spent two weeks on the journey while caring for a sick parent.' },
        options: [
          { q: 'best', text: 'Separate ideas from people: written comments on the journey first, then a discussion that starts with what works before what doesn\'t.', fx: { thirdCulture: 2, calibration: 1 },
            why: 'A shared critique format lets confrontational and harmony-minded people both do their best thinking.' },
          { q: 'ok', text: 'Ask Camille to apologise to Jia Hui privately.', fx: { humility: 1, calibration: 1 },
            why: 'It repairs this moment, but nothing changes about how the next critique runs.' },
          { q: 'poor', text: 'Tell Jia Hui that debate is how this team works and she should push back harder.', fx: { humility: -2 },
            why: 'It puts the whole adjustment on one person and ignores the power gap.' }],
        script: 'Jia Hui, let\'s look at where our two journeys differ. If we tested both, what user behaviour would tell us which works better?' },

      { id: 7, title: 'The elastic deadline', tag: 'Time & scheduling',
        a: { city: 'Zurich', ll: [8.54, 47.38] }, b: { city: 'Rome', ll: [12.50, 41.90] },
        transcript: [

          ['Matteo · Operations lead, Rome', 'A key customer\'s plant broke down on Thursday. We moved everyone to fix it. We saved them, and delivered today!'],
          ['Anna', 'You broke our whole schedule.']],
        intent: ['Anna', 'If slots are elastic, the supply chain collapses. Being on time is respect.'],
        impact: ['Matteo', 'A customer was in crisis. Protecting an internal slot over a real emergency isn\'t service.'],
        lenses: {
          culture: 'Meyer\'s “Scheduling” scale places Switzerland near the linear-time end and Italy toward flexible time, on average.',
          power: 'Anna\'s plant pays automated penalties for missed dock slots; Matteo\'s bonus is tied to customer satisfaction.',
          person: 'Matteo drove to the customer himself on Sunday to make sure the fix worked.' },
        options: [
          { q: 'best', text: 'Agree which milestones are fixed and which can flex, plus a one-hour alert rule when a customer crisis forces a change.', fx: { thirdCulture: 2, flexibility: 1 },
            why: 'A third way that belongs to neither office: hard gates where it matters, flexibility with warning where it doesn\'t.' },
          { q: 'ok', text: 'Thank Matteo for saving the customer and ask him to warn you sooner next time.', fx: { flexibility: 1, calibration: 1 },
            why: 'Good tone, but “sooner” is vague. A shared rule makes it stick.' },
          { q: 'poor', text: 'Remind Matteo that Zurich\'s schedule takes priority over regional issues.', fx: { humility: -1, flexibility: -1 },
            why: 'It imposes one side\'s norm and dismisses a real customer emergency.' }],
        script: 'Matteo, great work saving that customer. Dock changes here ripple into three other plants. When a crisis hits, can we agree a one-hour alert so we can move slots in time?' },

      { id: 8, title: 'The “why first” pushback', tag: 'Persuading',
        a: { city: 'New York', ll: [-74.01, 40.71] }, b: { city: 'Paris', ll: [2.35, 48.86] },
        transcript: [
          ['Jordan · VP Product, New York', 'Here\'s our new CRM! Three case studies show 40% higher close rates. Let\'s onboard by Friday!'],
          ['Elodie · Country lead, Paris', 'Wait. Why this vendor? What\'s the reasoning behind its data model?'],
          ['Jordan · privately', 'Why does Paris always want to philosophise?']],
        intent: ['Jordan', 'Show results, skip the theory. People want proof that it works.'],
        impact: ['Elodie', 'If the reasoning is flawed, the case studies are luck. Convince me the method is sound first.'],
        lenses: {
          culture: 'Meyer\'s “Persuading” scale contrasts principles-first reasoning (often associated with France) with applications-first reasoning (often associated with the US). Both are rigorous; they start in different places.',
          power: 'The decision came from New York with little European input, so “why?” also means “we weren\'t consulted”.',
          person: 'Elodie has an engineering background and lived through a failed CRM migration.' },
        options: [
          { q: 'best', text: 'Present in two parts: five minutes on why this vendor and data model, then the case studies. Invite Elodie to review the evaluation.', fx: { flexibility: 2, thirdCulture: 1 },
            why: 'Principles first, then applications: both audiences get what they need, and the consultation gap closes.' },
          { q: 'ok', text: 'Send Elodie the vendor evaluation document after the meeting.', fx: { flexibility: 1 },
            why: 'It answers her question, but late, and it still feels like an afterthought.' },
          { q: 'poor', text: 'Tell Elodie the decision is made and the rollout date is fixed.', fx: { humility: -1, flexibility: -1 },
            why: 'You get compliance on paper and quiet resistance in practice.' }],
        script: 'Elodie, before the demo, let me take five minutes on why we chose this data model over the alternatives. Then the results. I\'d value your read on the evaluation.' }

          options: [

            { text: 'Añade una columna de «riesgos» al tablero del stand-up para que cualquiera pueda señalar problemas sin decirlos en voz alta.', why: 'Un arreglo estructural útil. Funciona mejor junto a una conversación que haga que señalar se sienta seguro.' },
            { text: 'Publica en el canal del equipo: «Señalad los bloqueos de inmediato, aunque sean pequeños. Sin excepciones».', why: 'Razonable para ti, pero una norma pública justo después de un fallo público se lee como una reprimenda. La gente esconde mejor los problemas, no los avisa antes.' }],
          script: 'Rohan, parte de mi trabajo es quitar de en medio lo que tu equipo no controla. ¿Qué dependencia puedo desbloquear por ti esta semana?' },

          intent: ['Daan', 'El código no es una persona. Ser claro ahorra horas de idas y venidas a todos.'],
          impact: ['Thiago', 'Ni una palabra sobre lo que funcionaba, en un PR público, con «inaceptable». Así no se trata a un compañero al que respetas.'],
          lenses: { culture: 'En la escala de «Evaluar» de Meyer, Países Bajos está cerca del extremo directo para el feedback negativo, mientras que Brasil está más hacia el indirecto, de media.', power: 'Los comentarios escritos pierden el tono, y Daan tiene más antigüedad. Las palabras duras desde arriba pesan más.', person: 'Daan escribe de forma escueta a todo el mundo, incluido su manager. Thiago se había quedado hasta tarde para entregar este PR.' },
          options: [

            { text: 'Acordad una guía de revisión del equipo: etiquetas de gravedad («hay que arreglar», «sugerencia») y una nota positiva por revisión.', why: 'Un buen arreglo a nivel de equipo. No repara este momento con Thiago, así que acompáñalo de una conversación.' },
            { text: 'Dile a Thiago que aquí las revisiones son directas y que ya se acostumbrará.', why: 'Pide a una sola persona que absorba todo el ajuste. Eso no es una cultura, es un coste.' }],

        { title: 'El silencio de cuatro segundos', tag: 'Silencio y turnos de palabra', a: 'Londres', b: 'Tokio',
          transcript: [['Harry · Director, Londres', '¿Alguna objeción a retirar el esquema antiguo el mes que viene?'], ['Kenji · Arquitecto, Tokio', '(activa el micro… hace una pausa)'], ['Harry', '¡Genial, quien calla otorga! Siguiente punto.'], ['Tres días después', 'El equipo de Tokio avisa de una dependencia crítica del esquema antiguo.']],
          intent: ['Harry', 'En una videollamada, el silencio es acuerdo. Si nadie objeta en un par de segundos, seguimos.'],
          impact: ['Kenji', 'Estaba formulando un desacuerdo en mi segundo idioma, con cuidado, para no avergonzar a nadie. Siguió antes de que pudiera hablar.'],
          lenses: { culture: 'A menudo se describe que en entornos de negocio japoneses se hace una pausa antes de discrepar de alguien de más rango. Pero la investigación sobre la conversación cotidiana encuentra pausas entre turnos similares en todos los idiomas (Stivers et al., 2009), así que no des por hecho que la pausa era «cultural».', power: 'Harry preside la llamada y es la persona de más rango. Objetar al que preside, en directo y delante de otros, es difícil en cualquier sitio.', person: 'Kenji trabajaba en su segundo idioma, a las 21:00 hora de Tokio, sobre un punto técnico que exigía palabras precisas.' },
          options: [
            { text: 'Haz una pausa de verdad e invita por su nombre: «Kenji, me gustaría oír la visión de Tokio antes de decidir. Tómate un momento». Y acepta objeciones por escrito durante 24 horas.', why: 'Una pausa real, una invitación con nombre y un canal escrito: espacio para quien piensa en un segundo idioma o teme contradecir a quien preside.' },
            { text: 'Envía la decisión por correo después y pide objeciones antes del viernes.', why: 'Da tiempo a la gente, pero la propia llamada enseñó a todos que el silencio significa sí.' },
            { text: 'Pide a todos que escriban +1 o −1 en el chat en diez segundos.', why: 'Rápido, pero premia a quien piensa más deprisa en inglés, y un −1 delante del director sigue costando.' }],
          script: 'Voy a hacer una pausa aquí. Kenji, cuando estés listo, me encantaría oír la visión de Tokio sobre los casos límite.' },
        { title: 'El mensaje en frío', tag: 'Confianza y relaciones', a: 'Múnich', b: 'Ciudad de México',

          intent: ['Stefan', 'Ir al grano respeta su tiempo. Un plazo es un plazo.'],
          impact: ['Carlos', 'Dos mensajes, sin un hola, sin preguntar cómo estamos. Siento que soy un ticket, no un compañero.'],
          lenses: { culture: 'La escala de «Confiar» de Meyer sitúa a Alemania hacia la confianza basada en la tarea (construida con trabajo fiable) y a México hacia la confianza basada en la relación (construida con conexión personal), de media.', power: 'Stefan está en la sede central. El equipo de Carlos suele ser el último en enterarse de los cambios de prioridad, así que las exigencias secas suenan a órdenes.', person: 'El equipo de Carlos había pasado la noche arreglando una caída en producción. Stefan no lo sabía porque no preguntó.' },

            { text: 'Añade un saludo amable a los mensajes y luego pide la documentación.', why: 'Mejor tono, pero un saludo pegado a la misma exigencia puede seguir sonando transaccional. Una pregunta habría destapado la caída.' },
            { text: 'Escala al director de Carlos: el plazo estaba claro y no se ha cumplido.', why: 'Puede que consigas los documentos, pero confirma que la relación no importa, y perderás los favores que necesitarás después.' }],

        { title: 'El sí que significaba quizá', tag: 'Descifrar el «sí»', a: 'Sídney', b: 'Hanói',

          lenses: { culture: 'En muchos entornos de alto contexto, entre ellos Vietnam, se puede evitar un «no» directo a un cliente, y «haremos lo posible» puede señalar una duda real. Mucha gente de bajo contexto se cubre con las mismas palabras.', power: 'Liam controla el presupuesto del equipo de Linh. Decir que no a quien te paga es difícil en todas partes.', person: 'A Linh acababan de ascenderla y quería demostrar que podía cumplir.' },

          <p class="text-sm sm:text-base text-ink/70 leading-relaxed">${esc(t.introDesc)}</p>
          <ol class="grid grid-cols-3 gap-1.5">${t.introLenses.map(([h, d], i) => `
            <li class="rounded-xl border border-line p-2.5"><span class="block font-mono text-[10px] text-accent">0${i + 1}</span><span class="block font-syne font-bold text-sm mt-0.5">${esc(h)}</span><span class="block text-[11px] text-muted leading-snug mt-0.5">${esc(d)}</span></li>`).join('')}</ol>
          <div class="flex flex-wrap gap-2 pt-1">${btn(esc(t.introStart) + ' →', 'id="dlg-start"')}</div>
          <p class="text-[11px] font-mono text-muted">${esc(t.introMeta)}</p>
        </div>`;
        $('dlg-start').onclick = () => { state.introSeen = true; persist(); closeDialog(); };
      }
      if (dialog.kind === 'egg') {
        const e = EGGS[lang][dialog.data];
        sheet.innerHTML = `<div class="space-y-4">
          <span class="text-[11px] font-mono uppercase tracking-[0.16em] text-accent">${esc(t.eggTag)} · ${eggCount()}/${EGG_IDS.length}</span>
          <h2 id="dlg-title" class="font-syne text-2xl sm:text-3xl font-bold tracking-tight">${esc(e.title)}</h2>
          <p class="font-serif italic text-xl leading-snug text-ink/80">${esc(e.quote)}</p>
          <div class="rounded-2xl bg-paper border border-line p-4"><p class="text-[11px] font-mono uppercase tracking-[0.12em] text-muted mb-1">${esc(t.eggUse)}</p><p class="text-sm leading-relaxed">${esc(e.tip)}</p></div>
          ${btn(esc(t.eggResume) + ' →', 'id="dlg-ok"')}
        </div>`;
        $('dlg-ok').onclick = closeDialog;
      }
    }

    /* ─────────── Codex drawer ─────────── */
    function openCodex(tab) {
      if (tab) codexTab = tab;
      codexOpen = true; renderCodex();
      $('drawer').classList.add('open'); $('drawer-scrim').classList.add('open'); $('drawer').setAttribute('aria-hidden', 'false'); $('drawer').inert = false;
      setTimeout(() => $('drawer-close').focus({ preventScroll: true }), 60);
    }
    function closeCodex() { codexOpen = false; $('drawer').classList.remove('open'); $('drawer-scrim').classList.remove('open'); $('drawer').setAttribute('aria-hidden', 'true'); $('drawer').inert = true; }
    const topCap = () => { const sc = scores(); const k = CAP_KEYS.reduce((a, b) => (sc[b] > sc[a] ? b : a)); return sc[k] > 0 ? k : null; };
    function cardText() {
      const t = T(), k = topCap();
      return [t.cardHead, state.name.trim() || '—', `${t.sDone} ${doneCount()}/8 · ${t.sSecrets} ${eggCount()}/${EGG_IDS.length}${k ? ` · ${t.sTop}: ${t.caps[k]}` : ''}`,
        ...cases().filter(c => done(c.id)).map(c => `✓ ${route(c)} · ${c.tag}`), location.href.split('#')[0]].join('\n');
    }
    function renderCodex() {
      const t = T(), body = $('codex-body');
      document.querySelectorAll('[data-ctab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.ctab === codexTab)));
      if (codexTab === 'secrets') {
        body.innerHTML = `<div class="space-y-3">${EGG_IDS.map((id, i) => {
          const e = EGGS[lang][id];
          return state.eggs[id] ? `<article class="rounded-2xl bg-white border border-line p-5 space-y-2">
              <p class="text-[10px] font-mono uppercase tracking-[0.14em] text-accent">0${i + 1} · ${esc(t.eggTag)}</p>
              <h3 class="font-syne font-bold text-lg">${esc(e.title)}</h3>
              <p class="font-serif italic text-lg leading-snug text-ink/75">${esc(e.quote)}</p>
              <p class="text-sm leading-relaxed"><span class="text-[11px] font-mono uppercase tracking-[0.1em] text-muted">${esc(t.eggUse)} · </span>${esc(e.tip)}</p></article>`
            : `<article class="rounded-2xl border border-dashed border-line p-5">
              <p class="text-[10px] font-mono uppercase tracking-[0.14em] text-muted">0${i + 1} · ${esc(t.eggLocked)}</p>
              <p class="mt-1 text-sm text-ink/70"><span class="font-mono text-[11px] text-muted">${esc(t.eggHint)} · </span>${esc(e.hint)}</p></article>`;
        }).join('')}</div>`;
      }
      if (codexTab === 'card') {
        const k = topCap(), stamps = cases().filter(c => done(c.id));
        body.innerHTML = `<label class="block text-[11px] font-mono uppercase tracking-[0.12em] text-muted mb-1.5" for="card-name">${esc(t.cardName)}</label>
          <input id="card-name" type="text" maxlength="40" value="${esc(state.name)}" placeholder="${esc(t.cardNamePh)}" class="w-full h-11 px-4 rounded-xl border border-line bg-white focus:outline-none focus:border-ink/40 mb-4">
          <div class="rounded-3xl bg-ink text-white p-6 space-y-5 relative overflow-hidden">
            <span class="absolute -right-8 -top-8 w-32 h-32 rounded-full border border-white/10"></span>
            <div class="flex items-center justify-between gap-3"><span class="text-[10px] font-mono uppercase tracking-[0.16em] text-white/50">${esc(t.cardHead)}</span><span class="w-2 h-2 rounded-full bg-accent flex-shrink-0"></span></div>
            <p class="font-syne text-2xl font-bold tracking-tight" id="card-name-out">${esc(state.name.trim() || '—')}</p>
            <div class="grid grid-cols-3 gap-2 text-center">
              <div><b class="block font-syne text-xl">${doneCount()}/8</b><span class="text-[10px] font-mono text-white/50">${esc(t.sDone)}</span></div>
              <div><b class="block font-syne text-sm leading-tight min-h-[28px] flex items-center justify-center">${k ? esc(t.capsShort[k]) : '—'}</b><span class="text-[10px] font-mono text-white/50">${esc(t.sTop)}</span></div>
              <div><b class="block font-syne text-xl">${eggCount()}/${EGG_IDS.length}</b><span class="text-[10px] font-mono text-white/50">${esc(t.sSecrets)}</span></div>
            </div>
            <ul class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-[12px] font-mono text-white/80 border-t border-white/10 pt-4">${stamps.length ? stamps.map(c => `<li class="truncate">✓ ${esc(route(c))}</li>`).join('') : `<li class="text-white/45">${esc(t.cardEmpty)}</li>`}</ul>
          </div>
          <div class="flex flex-wrap gap-2 mt-4">${btn(esc(t.cardCopy), 'id="card-copy"')}${navigator.share ? btn(esc(t.cardShare) + ' ↗', 'id="card-share"', false) : ''}</div>`;
        $('card-name').oninput = (e) => { state.name = e.target.value; $('card-name-out').textContent = state.name.trim() || '—'; persist(); };
        $('card-copy').onclick = () => copyText(cardText());
        if ($('card-share')) $('card-share').onclick = () => navigator.share({ title: t.brand, text: cardText() }).catch(() => {});
      }
      if (codexTab === 'build') {
        body.innerHTML = `<h3 class="font-syne text-xl font-bold tracking-tight mb-5">${esc(t.buildTitle)}</h3>
          <ol class="space-y-4 text-sm leading-relaxed">${t.build.map(([h, p], i) => `<li class="grid grid-cols-[2rem_1fr] gap-2"><span class="font-mono text-[11px] text-accent pt-0.5">0${i + 1}</span><div><p class="font-syne font-bold">${esc(h)}</p><p class="text-ink/70">${esc(p)}</p></div></li>`).join('')}</ol>
          <a href="https://wei-meng.org/free_builder#contact" class="mt-6 inline-flex items-center gap-2 px-5 py-3 rounded-full bg-ink text-white hover:bg-accent text-xs font-bold font-mono transition-colors">${esc(t.letsTalk)} <span aria-hidden="true">→</span></a>`;
      }
    }

    /* ─────────── Easter egg: three taps on the compass recentres the world ─────────── */
    let taps = 0, tapTimer, spin = 0;
    $('compass').addEventListener('click', () => {
      taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => { taps = 0; }, 700);
      spin += 120; $('compass-svg').style.transform = `rotate(${spin}deg)`;
      beep('tap');
      if (taps >= 3) {
        taps = 0;
        state.pacific = !state.pacific;
        drawMap();
        toast(state.pacific ? T().t.pacific : T().t.back);
        if (state.pacific) setTimeout(() => findEgg('compass'), 900);
      }
    });

    /* ─────────── Wiring ─────────── */
    $('case-sheet').addEventListener('click', (e) => { if (e.target === $('case-sheet') || e.target.closest('[data-close]')) closeCase(); });
    $('codex-btn').addEventListener('click', () => openCodex());
    $('hud-eggs-btn').addEventListener('click', () => openCodex('secrets'));
    $('drawer-close').addEventListener('click', closeCodex);
    $('drawer-scrim').addEventListener('click', closeCodex);
    document.querySelectorAll('[data-ctab]').forEach(b => b.addEventListener('click', () => { codexTab = b.dataset.ctab; renderCodex(); }));
    $('scrim').addEventListener('click', (e) => { if (e.target === $('scrim') && dialog && dialog.kind !== 'intro') closeDialog(); });
    $('sound-btn').addEventListener('click', () => { state.sound = !state.sound; persist(); renderHud(); beep('tap'); toast(state.sound ? T().t.soundOn : T().t.soundOff); });
    $('lang-btn').addEventListener('click', () => {
      lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
      try { localStorage.setItem('wm_preferred_lang', lang); localStorage.setItem('wm_cases_lang', lang); } catch (e) {}
      applyStatic(); renderAll(); renderDialog(); if (run) renderStep();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (dialog && dialog.kind !== 'intro') closeDialog();
      else if (codexOpen) closeCodex();
      else if (run) closeCase();
    });

    $('year').textContent = new Date().getFullYear();
    applyStatic();
    renderAll();
    loadLand().then(drawMap).catch(() => { if (!window.d3 || !window.d3.geoPath) $('map-fallback').classList.remove('hidden'); });
    if (!state.introSeen) openDialog('intro');

  })();
  </script>
<script>(() => { const b = document.getElementById('codex-btn'); if (!b) return; const name = () => b.setAttribute('aria-label', b.textContent.replace(/\s+/g, ' ').trim()); name(); new MutationObserver(name).observe(b, { childList: true, subtree: true, characterData: true }); })();</script>
<script>if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/free_builder/sw.js", { scope: "/free_builder/" }).catch(() => {});</script>
</body>
</html>
