    // --- SYNAPSE AUDIO ENGINE ---
    class SynapseAudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.droneOsc = null;
        this.droneGain = null;
      }

      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
            this.startDrone();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      startDrone() {
        if (this.muted || !this.ctx || this.droneOsc) return;
        try {
          this.droneOsc = this.ctx.createOscillator();
          this.droneGain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          this.droneOsc.type = 'sine';
          this.droneOsc.frequency.setValueAtTime(55, this.ctx.currentTime);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(140, this.ctx.currentTime);

          this.droneGain.gain.setValueAtTime(0.001, this.ctx.currentTime);
          this.droneGain.gain.linearRampToValueAtTime(0.018, this.ctx.currentTime + 3);

          this.droneOsc.connect(filter);
          filter.connect(this.droneGain);
          this.droneGain.connect(this.ctx.destination);
          this.droneOsc.start();
        } catch (e) {}
      }

      playTone(freq, duration = 0.2, type = 'sine', gainVal = 0.08, glide = null) {
        if (this.muted) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(2400, this.ctx.currentTime);

          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          if (glide) {
            osc.frequency.exponentialRampToValueAtTime(glide, this.ctx.currentTime + duration);
          }

          gain.gain.setValueAtTime(0.0001, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(gainVal, this.ctx.currentTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      jump() {
        this.playTone(320, 0.16, 'triangle', 0.08, 620);
      }

      dash() {
        this.playTone(220, 0.18, 'sawtooth', 0.07, 75);
      }

      floatHum() {
        this.playTone(480, 0.15, 'sine', 0.04, 520);
      }

      bubblePop() {
        this.playTone(600, 0.08, 'sine', 0.12, 1200);
        setTimeout(() => this.playTone(900, 0.12, 'triangle', 0.08, 300), 30);
      }

      bounceCloud() {
        this.playTone(260, 0.35, 'sine', 0.14, 580);
        setTimeout(() => this.playTone(520, 0.25, 'triangle', 0.09, 880), 50);
      }

      collect() {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        const n = notes[Math.floor(Math.random() * notes.length)];
        this.playTone(n, 0.35, 'sine', 0.12);
      }

      easterEggFanfare() {
        const notes = [523.25, 659.25, 783.99, 1046.5, 1318.51];
        notes.forEach((n, i) => {
          setTimeout(() => this.playTone(n, 0.45, 'sine', 0.12), i * 70);
        });
      }

      victory() {
        const chord = [392.0, 493.88, 587.33, 783.99, 987.77];
        chord.forEach((n, i) => {
          setTimeout(() => this.playTone(n, 1.2, 'sine', 0.09), i * 100);
        });
      }
    }

      const [crazy8SecondsLeft, setCrazy8SecondsLeft] = useState(60);
      const [crazy8Running, setCrazy8Running] = useState(false);

      const canvasRef = useRef(null);
      const currentStage = GAME_STAGES[stageIndex];

      const stateRef = useRef({
        cameraX: 0,
        shake: 0,
        kibo: {
          x: 70,
          y: 310,
          vx: 0,
          vy: 0,
          w: 22,
          h: 28,
          facing: 1,
          grounded: false,
          coyoteTime: 0,
          jumpBuffer: 0,
          onWall: 0,
          canAirDash: true,
          isDashing: false,
          dashTimer: 0,
          dashCooldown: 0,
          blinkTimer: 120,
          isBlinking: false,
          squashX: 1,
          squashY: 1,
          haloPulse: 0,
          trail: [],
          airChainCount: 0
        },
        heuristics: {
          edgeTimer: 0,
          wallTapCount: 0,
          lastWallTapTime: 0
        },
        keys: {
          left: false,
          right: false,
          up: false,
          dash: false
        },
        level: null,
        collectedSparks: {},
        placedBlocks: [],
        ghostPlatforms: [],
        confettiParticles: [],
        cloudPuffs: [],
        shockwaves: []
      });

      const showToast = useCallback((msg) => {
        setToastMsg(msg);
        setTimeout(() => {
          setToastMsg((prev) => (prev === msg ? null : prev));
        }, 2800);
      }, []);

      const unlockEasterEgg = useCallback((eggId) => {
        setEasterEggs((prev) => {
          const target = prev.find((e) => e.id === eggId);
          if (target && !target.unlocked) {
            audio.easterEggFanfare();
            setEggModalData(target);
            return prev.map((e) => (e.id === eggId ? { ...e, unlocked: true } : e));
          }
          return prev;
        });
      }, []);

      const initLevel = useCallback((index, isRetry = false) => {
        const raw = LEVEL_CONFIGS[index];
        const deep = JSON.parse(JSON.stringify(raw));
        const s = stateRef.current;

        s.cameraX = 0;
        s.shake = 0;
        s.kibo = {
          x: deep.playerStart.x,
          y: deep.playerStart.y,
          vx: 0,
          vy: 0,
          w: 22,
          h: 28,
          facing: 1,
          grounded: false,
          coyoteTime: 0,
          jumpBuffer: 0,
          onWall: 0,
          canAirDash: true,
          isDashing: false,
          dashTimer: 0,
          dashCooldown: 0,
          blinkTimer: 120,
          isBlinking: false,
          squashX: 1,
          squashY: 1,
          haloPulse: 0,
          trail: [],
          airChainCount: 0
        };
        s.level = deep;
        s.collectedSparks = {};
        s.placedBlocks = [];
        s.shockwaves = [];
        s.confettiParticles = [];
        s.cloudPuffs = [];
        s.heuristics = { edgeTimer: 0, wallTapCount: 0, lastWallTapTime: 0 };

        if (!isRetry) {
          s.ghostPlatforms = [];
        }

        setPerspectiveActive(false);
        setStageClearedModal(false);
        if (index === 2) {
          setShowStage3Overlay(true);
        }
      }, []);

      useEffect(() => {
        initLevel(stageIndex);
      }, [stageIndex, initLevel]);

      // Telemetry stopwatch
      useEffect(() => {
        if (!hasStarted || gameCompleted) return;
        const t = setInterval(() => setElapsedSeconds((s) => s + 1), 1000);
        return () => clearInterval(t);
      }, [hasStarted, gameCompleted]);

      // Interactive Crazy 8s sprint timer
      useEffect(() => {
        let t;
        if (crazy8Running) {
          t = setInterval(() => {
            setCrazy8SecondsLeft((prev) => {
              if (prev <= 1) {
                audio.collect();
                if (crazy8Round < 8) {
                  setCrazy8Round((r) => r + 1);
                  return 60;
                } else {
                  setCrazy8Running(false);
                  audio.victory();
                  return 0;
                }
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(t);
      }, [crazy8Running, crazy8Round]);

      // Audio synchronization
      useEffect(() => {
        audio.muted = !soundEnabled;
        if (soundEnabled && hasStarted) {
          audio.init();
        }
      }, [soundEnabled, hasStarted]);

      const handleDeployBlock = useCallback(() => {
        const s = stateRef.current;
        if (stageIndex !== 3) return;

        if (s.placedBlocks.length >= 3) {
          s.placedBlocks.shift();
        }

        const spawnX = s.kibo.facing === 1 ? s.kibo.x + 28 : s.kibo.x - 72;
        const spawnY = Math.min(360, Math.max(130, s.kibo.y + 12));

        s.placedBlocks.push({
          x: spawnX,
          y: spawnY,
          w: 68,
          h: 14,
          isSolid: true,
          life: 260
        });

        audio.playTone(160, 0.15, 'square', 0.08, 90);
        showToast('Rapid MVP Wireframe deployed! [Leap upon it]');
      }, [stageIndex, showToast]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (!hasStarted) {
            if (e.key === ' ' || e.key === 'Enter') {
              audio.init();
              setHasStarted(true);
            }
            return;
          }

          if (stageClearedModal || codexOpen || eggModalData) return;
          const k = stateRef.current.keys;
          const p = stateRef.current.kibo;

          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') k.left = true;
          if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') k.right = true;
          if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
            e.preventDefault();
            k.up = true;
            p.jumpBuffer = 6;
          }
          if (e.key === 'Shift' || e.key === 'j' || e.key === 'J') {
            e.preventDefault();
            k.dash = true;
          }
          if (e.key === 'e' || e.key === 'E') {
            if (stageIndex === 0) {
              setPerspectiveActive((prev) => {
                const next = !prev;
                audio.playTone(next ? 440 : 220, 0.3, 'sine', 0.1, next ? 880 : 110);
                showToast(next ? 'Persona Sonar: Latent bridges revealed!' : 'Normal View.');
                return next;
              });
            }
          }
          if (e.key === 'q' || e.key === 'Q' || e.key === 'f' || e.key === 'F') {
            handleDeployBlock();
          }
          if (e.key === 'r' || e.key === 'R') {
            setIterationFailures((f) => f + 1);
            initLevel(stageIndex, true);
            showToast('Iterating... Respawned at base.');
          }
          if (e.key === 'Tab') {
            e.preventDefault();
            setCodexOpen((prev) => !prev);
          }
        };

        const handleKeyUp = (e) => {
          const k = stateRef.current.keys;
          const p = stateRef.current.kibo;

          if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') k.left = false;
          if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') k.right = false;
          if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
            k.up = false;
            if (p.vy < -2.4 && stageIndex !== 2) p.vy *= 0.45;
          }
          if (e.key === 'Shift' || e.key === 'j' || e.key === 'J') k.dash = false;
        };

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
        };
      }, [hasStarted, stageClearedModal, codexOpen, eggModalData, stageIndex, initLevel, handleDeployBlock, showToast]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        const V_W = 860;
        const V_H = 460;

        const GRAV = 0.42;
        const RUN_ACCEL = 0.78;
        const FRICTION = 0.82;
        const MAX_SPEED = 4.6;
        const JUMP_POWER = -9.5;
        const DASH_SPEED = 10.8;
        const DASH_FRAMES = 10;

        const emitShockwave = (x, y, color = '#ffffff') => {
          stateRef.current.shockwaves.push({
            x,
            y,
            radius: 4,
            maxRadius: 36,
            alpha: 0.8,
            color
          });
        };

        const spawnConfetti = (x, y) => {
          const colors = ['#f59e0b', '#ec4899', '#06b6d4', '#10b981', '#ffffff', '#fbbf24'];
          for (let i = 0; i < 22; i++) {
            stateRef.current.confettiParticles.push({
              x,
              y,
              vx: (Math.random() - 0.5) * 8,
              vy: (Math.random() - 0.8) * 8,
              w: Math.random() * 5 + 3,
              h: Math.random() * 5 + 3,
              color: colors[Math.floor(Math.random() * colors.length)],
              alpha: 1,
              rot: Math.random() * Math.PI,
              vRot: (Math.random() - 0.5) * 0.2
            });
          }
        };

        const spawnCloudPuff = (x, y) => {
          for (let i = 0; i < 6; i++) {
            stateRef.current.cloudPuffs.push({
              x: x + (Math.random() - 0.5) * 40,
              y: y + (Math.random() - 0.5) * 10,
              vx: (Math.random() - 0.5) * 2,
              vy: -Math.random() * 2 - 1,
              radius: Math.random() * 14 + 10,
              alpha: 0.5
            });
          }
        };

        const loop = () => {
          const gs = stateRef.current;
          const { kibo, keys, level, collectedSparks, placedBlocks, ghostPlatforms, shockwaves, confettiParticles, cloudPuffs, heuristics } = gs;
          const stage = GAME_STAGES[stageIndex];

          if (!level) {
            animId = requestAnimationFrame(loop);
            return;
          }

          kibo.blinkTimer--;
          if (kibo.blinkTimer <= 0) {
            kibo.isBlinking = true;
            if (kibo.blinkTimer <= -8) {
              kibo.isBlinking = false;
              kibo.blinkTimer = Math.floor(Math.random() * 160 + 120);
            }
          }
          kibo.squashX += (1 - kibo.squashX) * 0.14;
          kibo.squashY += (1 - kibo.squashY) * 0.14;
          kibo.haloPulse = (kibo.haloPulse + 0.05) % (Math.PI * 2);

          if (kibo.dashCooldown > 0) kibo.dashCooldown--;

          if (keys.dash && kibo.canAirDash && kibo.dashCooldown === 0 && !kibo.isDashing) {
            kibo.isDashing = true;
            kibo.canAirDash = false;
            kibo.dashTimer = DASH_FRAMES;
            kibo.dashCooldown = 24;
            kibo.vx = kibo.facing * DASH_SPEED;
            kibo.vy = 0;
            kibo.squashX = 1.45;
            kibo.squashY = 0.65;
            gs.shake = 5;
            audio.dash();
            emitShockwave(kibo.x + kibo.w / 2, kibo.y + kibo.h / 2, stage.accent);

            if (stageIndex === 2) {
              kibo.airChainCount++;
              if (kibo.airChainCount >= 3) {
                unlockEasterEgg('quantity_breeds_quality');
              }
            }
          }

          const isStage3 = stageIndex === 2;

          if (kibo.isDashing) {
            kibo.dashTimer--;
            kibo.vy = 0;
            kibo.trail.unshift({
              x: kibo.x,
              y: kibo.y,
              alpha: 0.7,
              facing: kibo.facing
            });
            if (kibo.trail.length > 9) kibo.trail.pop();

            if (kibo.dashTimer <= 0) {
              kibo.isDashing = false;
              kibo.vx *= 0.55;
            }
          } else {
            kibo.trail.forEach((t) => (t.alpha *= 0.84));
            kibo.trail = kibo.trail.filter((t) => t.alpha > 0.05);

            if (keys.left) {
              kibo.vx -= RUN_ACCEL;
              kibo.facing = -1;
            } else if (keys.right) {
              kibo.vx += RUN_ACCEL;
              kibo.facing = 1;
            } else {
              kibo.vx *= FRICTION;
            }
            kibo.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, kibo.vx));

            if (isStage3) {
              const inUpdraft = level.updraftField &&
                kibo.x + kibo.w > level.updraftField.x &&
                kibo.x < level.updraftField.x + level.updraftField.w;

              if (ideaWingsAssist) {
                if (keys.up) {
                  kibo.vy = -4.5;
                } else {
                  kibo.vy = Math.sin(Date.now() * 0.005) * 0.4;
                }
              } else if (inUpdraft && keys.up) {
                kibo.vy -= 0.65;
                kibo.vy = Math.max(-5.2, kibo.vy);
                kibo.canAirDash = true;
                if (Math.random() < 0.08) audio.floatHum();
              } else {
                kibo.vy += 0.22;
                kibo.vy = Math.min(kibo.vy, 3.2);
              }
            } else {
              let insideUpdraft = false;
              if (level.feedbackCurrents) {
                level.feedbackCurrents.forEach((c) => {
                  if (
                    kibo.x + kibo.w > c.x &&
                    kibo.x < c.x + c.w &&
                    kibo.y + kibo.h > c.y &&
                    kibo.y < c.y + c.h
                  ) {
                    insideUpdraft = true;
                    kibo.vy += c.forceY;
                    kibo.vy = Math.max(-7.5, kibo.vy);
                  }
                });
              }

              if (!insideUpdraft) {
                kibo.vy += GRAV;
              }

              if (kibo.onWall !== 0 && !kibo.grounded && kibo.vy > 0) {
                kibo.vy = Math.min(kibo.vy, 1.4);
              }
            }
          }

          kibo.x += kibo.vx;
          kibo.y += kibo.vy;

          if (stageIndex === 0 && kibo.x <= 15) {
            unlockEasterEgg('beginners_mind');
          }

          if (kibo.x < 10) {
            kibo.x = 10;
            kibo.vx = 0;
          }
          if (kibo.x + kibo.w > level.worldWidth - 10) {
            kibo.x = level.worldWidth - 10 - kibo.w;
            kibo.vx = 0;
          }

          if (kibo.grounded) {
            kibo.coyoteTime = 6;
            kibo.canAirDash = true;
            kibo.airChainCount = 0;
          } else if (kibo.coyoteTime > 0) {
            kibo.coyoteTime--;
          }

          if (kibo.jumpBuffer > 0) kibo.jumpBuffer--;

          kibo.grounded = false;
          kibo.onWall = 0;

          const solidPlats = [...level.platforms];

          if (perspectiveActive && level.perspectiveBridges) {
            solidPlats.push(...level.perspectiveBridges);
          }

          if (level.beamBridge && level.beamBridge.unlocked) {
            solidPlats.push(level.beamBridge);
          }

          solidPlats.push(...placedBlocks);
          solidPlats.push(...ghostPlatforms);

          let onPrecariousEdge = false;

          solidPlats.forEach((plat) => {
            if (
              kibo.x + kibo.w > plat.x &&
              kibo.x < plat.x + plat.w &&
              kibo.y + kibo.h >= plat.y &&
              kibo.y + kibo.h <= plat.y + 16 &&
              kibo.vy >= 0
            ) {
              kibo.y = plat.y - kibo.h;
              kibo.vy = 0;
              kibo.grounded = true;
              kibo.squashX = 1.35;
              kibo.squashY = 0.72;

              const distToLeft = Math.abs(kibo.x - plat.x);
              const distToRight = Math.abs(kibo.x + kibo.w - (plat.x + plat.w));
              if (distToLeft < 8 || distToRight < 8) {
                onPrecariousEdge = true;
              }
            }

            if (kibo.y + kibo.h > plat.y && kibo.y < plat.y + plat.h) {
              if (kibo.x <= plat.x + plat.w && kibo.x >= plat.x + plat.w - 8 && kibo.vx <= 0) {
                kibo.onWall = -1;
                kibo.canAirDash = true;

                if (stageIndex === 1 && Date.now() - heuristics.lastWallTapTime > 300) {
                  heuristics.wallTapCount++;
                  heuristics.lastWallTapTime = Date.now();
                  if (heuristics.wallTapCount >= 5) {
                    unlockEasterEgg('five_whys');
                  }
                }
              }
              if (kibo.x + kibo.w >= plat.x && kibo.x + kibo.w <= plat.x + 8 && kibo.vx >= 0) {
                kibo.onWall = 1;
                kibo.canAirDash = true;
              }
            }
          });

          if (kibo.grounded && onPrecariousEdge) {
            heuristics.edgeTimer++;
            if (heuristics.edgeTimer >= 110) {
              unlockEasterEgg('edge_case');
            }
          } else {
            heuristics.edgeTimer = 0;
          }

          if (isStage3 && level.safetyCloudFloor) {
            const sc = level.safetyCloudFloor;
            if (kibo.y + kibo.h >= sc.y) {
              kibo.y = sc.y - kibo.h;
              kibo.vy = -12.5;
              kibo.canAirDash = true;
              kibo.squashX = 1.45;
              kibo.squashY = 0.55;
              gs.shake = 4;
              audio.bounceCloud();
              spawnCloudPuff(kibo.x + kibo.w / 2, sc.y);
              showToast('☁️ Cloud Trampoline: Sprung high into the updraft!');

              kibo.airChainCount++;
              if (kibo.airChainCount >= 3) {
                unlockEasterEgg('quantity_breeds_quality');
              }
            }
          }

          if ((keys.up || kibo.jumpBuffer > 0) && !kibo.isDashing && !isStage3) {
            if (kibo.coyoteTime > 0) {
              kibo.vy = JUMP_POWER;
              kibo.coyoteTime = 0;
              kibo.jumpBuffer = 0;
              kibo.grounded = false;
              kibo.squashX = 0.78;
              kibo.squashY = 1.35;
              audio.jump();
              emitShockwave(kibo.x + kibo.w / 2, kibo.y + kibo.h, stage.accent);
            } else if (kibo.onWall !== 0) {
              kibo.vy = -8.6;
              kibo.vx = -kibo.onWall * 5.2;
              kibo.facing = -kibo.onWall;
              kibo.jumpBuffer = 0;
              kibo.squashX = 0.8;
              kibo.squashY = 1.3;
              audio.jump();
              emitShockwave(kibo.x + kibo.w / 2, kibo.y + kibo.h / 2, '#ffffff');
            }
          }

          if (isStage3 && level.doubtBubbles) {
            level.doubtBubbles.forEach((bubble) => {
              if (!bubble.popped) {
                if (
                  kibo.x + kibo.w > bubble.x &&
                  kibo.x < bubble.x + bubble.w &&
                  kibo.y + kibo.h > bubble.y &&
                  kibo.y < bubble.y + bubble.h
                ) {
                  bubble.popped = true;
                  audio.bubblePop();
                  gs.shake = 7;
                  spawnConfetti(bubble.x + bubble.w / 2, bubble.y + bubble.h / 2);
                  emitShockwave(bubble.x + bubble.w / 2, bubble.y + bubble.h / 2, '#f59e0b');
                  showToast(`🎉 Popped Doubt: ${bubble.label}! Ideas flow freely.`);

                  kibo.airChainCount++;
                  if (kibo.airChainCount >= 3) {
                    unlockEasterEgg('quantity_breeds_quality');
                  }
                }
              }
            });
          }

          if (level.tuningNodes) {
            level.tuningNodes.forEach((node) => {
              const dist = Math.hypot(
                kibo.x + kibo.w / 2 - node.x,
                kibo.y + kibo.h / 2 - node.y
              );
              if (dist < 40 && !node.tuned) {
                node.tuned = true;
                if (node.isRoot) {
                  level.beamBridge.unlocked = true;
                  audio.victory();
                  gs.shake = 8;
                  emitShockwave(node.x, node.y, '#06b6d4');
                  showToast('ROOT CAUSE IDENTIFIED: The coherent light bridge locked in!');
                } else {
                  audio.playTone(180, 0.2, 'sawtooth', 0.08);
                  showToast(`Discarded False Noise: ${node.label}`);
                }
              }
            });
          }

          if (level.sparks) {
            const magnetDist = isStage3 ? 220 : 75;

            level.sparks.forEach((spk) => {
              if (!collectedSparks[spk.id]) {
                const dx = kibo.x + kibo.w / 2 - spk.x;
                const dy = kibo.y + kibo.h / 2 - spk.y;
                const dist = Math.hypot(dx, dy);

                if (dist < magnetDist) {
                  const pullSpeed = isStage3 ? 6.5 : 4.2;
                  spk.x += (dx / dist) * pullSpeed;
                  spk.y += (dy / dist) * pullSpeed;
                }

                if (dist < 30) {
                  collectedSparks[spk.id] = true;
                  audio.collect();
                  emitShockwave(spk.x, spk.y, stage.accent);
                  showToast(`✨ Acquired Spark: ${spk.label}`);
                }
              }
            });
          }

          if (kibo.y > V_H + 40 && !isStage3) {
            setIterationFailures((f) => f + 1);

            if (stageIndex === 3) {
              unlockEasterEgg('worst_idea');

              const ghostX = Math.max(240, Math.min(1240, kibo.x - 30));
              const ghostY = Math.max(180, Math.min(380, kibo.y - 90));
              ghostPlatforms.push({
                x: ghostX,
                y: ghostY,
                w: 80,
                h: 14,
                isSolid: true,
                iteration: ghostPlatforms.length + 1
              });
              audio.playTone(110, 0.4, 'triangle', 0.12, 220);
              gs.shake = 8;
              showToast(`MVP #${ghostPlatforms.length} failed fast. Solidified as Ghost Staircase!`);
            } else {
              audio.playTone(120, 0.3, 'sine', 0.08);
              showToast('Iteration reset. Pushing forward.');
            }

            kibo.x = level.playerStart.x;
            kibo.y = level.playerStart.y;
            kibo.vx = 0;
            kibo.vy = 0;
            kibo.isDashing = false;
            kibo.airChainCount = 0;
          }

          const b = level.beacon;
          if (
            kibo.x + kibo.w >= b.x &&
            kibo.x <= b.x + b.w &&
            kibo.y + kibo.h >= b.y
          ) {
            if (!stageClearedModal) {
              audio.victory();
              emitShockwave(b.x + b.w / 2, b.y + b.h / 2, stage.accent);
              setStageClearedModal(true);
              if (stageIndex === GAME_STAGES.length - 1) {
                setGameCompleted(true);
              }
            }
          }

          const targetCam = kibo.x - 280;
          gs.cameraX += (targetCam - gs.cameraX) * 0.09;
          gs.cameraX = Math.max(0, Math.min(level.worldWidth - V_W, gs.cameraX));

          let offsetX = 0;
          let offsetY = 0;
          if (gs.shake > 0) {
            offsetX = (Math.random() - 0.5) * gs.shake;
            offsetY = (Math.random() - 0.5) * gs.shake;
            gs.shake *= 0.88;
            if (gs.shake < 0.2) gs.shake = 0;
          }

          ctx.clearRect(0, 0, V_W, V_H);
          ctx.save();
          ctx.translate(-Math.floor(gs.cameraX) + offsetX, offsetY);

          const bgGrad = ctx.createLinearGradient(gs.cameraX, 0, gs.cameraX, V_H);
          if (isStage3) {
            bgGrad.addColorStop(0, '#151006');
            bgGrad.addColorStop(1, '#090807');
          } else {
            bgGrad.addColorStop(0, perspectiveActive ? '#120d26' : '#090a10');
            bgGrad.addColorStop(1, perspectiveActive ? '#090616' : '#050608');
          }
          ctx.fillStyle = bgGrad;
          ctx.fillRect(gs.cameraX, 0, V_W, V_H);

          if (isStage3) {
            ctx.save();
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.35)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 12]);

              {stageClearedModal && !eggModalData && (
                <div className="absolute inset-0 bg-[#07080d]/92 backdrop-blur-md flex items-center justify-center p-4 z-40 animate-fade-in">
                  <div className="max-w-md w-full bg-[#12141e] border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4 text-left">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                      <span className="font-mono text-xs uppercase tracking-wider text-slate-400">
                        STAGE {currentStage.code} // COMPLETE
                      </span>
                      <span
                        className="w-2.5 h-2.5 rounded-full"
                        style={{ backgroundColor: currentStage.accent }}
                      />
                    </div>

                    <div>
                      <h3 className="text-lg font-bold text-white tracking-tight">{currentStage.name}</h3>
                      <p className="text-xs text-slate-400 mt-1 italic font-mono">
                        "{currentStage.subtext}"
                      </p>
                      <p className="text-xs text-slate-300 mt-2 leading-relaxed">
                        {currentStage.codex.coreConcept}
                      </p>
                    </div>

                    <div className="bg-[#090a10] p-3.5 rounded-xl border border-slate-800/80">
                      <span className="text-[10px] font-mono text-cyan-400 uppercase tracking-wider block mb-1">
                        WORKPLACE APPLICATION: {currentStage.codex.title}
                      </span>
                      <ul className="text-xs text-slate-300 space-y-1 font-mono">
                        {currentStage.codex.sprintRules.map((r, i) => (
                          <li key={i} className="flex items-start gap-1.5">
                            <span className="text-violet-400 font-bold">›</span>
                            <span>{r}</span>
                          </li>
                        ))}
                      </ul>
                    </div>

                    <div className="flex items-center gap-2 pt-1">
                      {stageIndex < GAME_STAGES.length - 1 ? (
                        <button
                          onClick={() => {
                            audio.jump();
                            setStageIndex(stageIndex + 1);
                          }}
                          className="flex-1 py-2.5 bg-white hover:bg-slate-200 text-slate-950 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-md"
                        >
                          <span>Advance to Stage 0{stageIndex + 2}</span>
                          <ChevronRight className="w-4 h-4" />
                        </button>
                      ) : (
                        <button
                          onClick={() => {
                            audio.victory();
                            setStageClearedModal(false);
                            setCodexOpen(true);
                            setActiveCodexTab('cert');
                          }}
                          className="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-md"
                        >
                          <span>Claim Architect Credential</span>
                          <Award className="w-4 h-4" />
                        </button>
                      )}
                      <button
                        onClick={() => initLevel(stageIndex, true)}
                        className="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-mono transition"
                      >
                        Replay
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* Minimalist Controls & Mobile Touch Pad */}
            <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-[#0d0f18]/60 p-2.5 rounded-xl border border-slate-800/70 text-xs mt-2.5">
              <div className="flex items-center gap-4 text-slate-400 font-mono text-[11px]">
                <span>
                  <kbd className="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-200">A / D</kbd> Move
                </span>
                <span>
                  <kbd className="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-200">
                    {stageIndex === 2 ? 'Hold UP / SPACE to Float' : 'Space Jump'}
                  </kbd>
                </span>
                <span>
                  <kbd className="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-200">Shift / J</kbd> Dash
                </span>
                {stageIndex === 0 && (
                  <span>
                    <kbd className="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-violet-400">E</kbd> Sonar
                  </span>
                )}
                {stageIndex === 3 && (
                  <span>
                    <kbd className="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-emerald-400">Q / F</kbd> Deploy MVP
                  </span>
                )}
              </div>

              {/* Touch Gamepad */}
              <div className="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                <div className="flex gap-1.5">
                  <button
                    onTouchStart={() => (stateRef.current.keys.left = true)}
                    onTouchEnd={() => (stateRef.current.keys.left = false)}
                    onMouseDown={() => (stateRef.current.keys.left = true)}
                    onMouseUp={() => (stateRef.current.keys.left = false)}
                    className="w-10 h-8 bg-slate-900 border border-slate-800 active:bg-slate-800 rounded-lg text-slate-200 font-mono flex items-center justify-center"
                  >
                    ←
                  </button>
                  <button
                    onTouchStart={() => (stateRef.current.keys.right = true)}
                    onTouchEnd={() => (stateRef.current.keys.right = false)}
                    onMouseDown={() => (stateRef.current.keys.right = true)}
                    onMouseUp={() => (stateRef.current.keys.right = false)}
                    className="w-10 h-8 bg-slate-900 border border-slate-800 active:bg-slate-800 rounded-lg text-slate-200 font-mono flex items-center justify-center"
                  >
                    →
                  </button>
                </div>

                <div className="flex gap-1.5">
                  {stageIndex === 0 && (
                    <button
                      onClick={() => setPerspectiveActive((prev) => !prev)}
                      className="px-2.5 h-8 bg-violet-950/80 border border-violet-700 active:bg-violet-900 rounded-lg text-violet-200 text-xs font-mono"
                    >
                      SONAR
                    </button>
                  )}
                  {stageIndex === 2 && (
                    <button
                      onClick={() => setShowStage3Overlay((prev) => !prev)}
                      className="px-2.5 h-8 bg-amber-950/80 border border-amber-700 active:bg-amber-900 rounded-lg text-amber-200 text-xs font-mono"
                    >
                      GUIDE
                    </button>
                  )}
                  {stageIndex === 3 && (
                    <button
                      onClick={handleDeployBlock}
                      className="px-2.5 h-8 bg-emerald-950/80 border border-emerald-700 active:bg-emerald-900 rounded-lg text-emerald-200 text-xs font-mono"
                    >
                      DEPLOY MVP
                    </button>
                  )}
                  <button
                    onTouchStart={() => (stateRef.current.keys.dash = true)}
                    onTouchEnd={() => (stateRef.current.keys.dash = false)}
                    onMouseDown={() => (stateRef.current.keys.dash = true)}
                    onMouseUp={() => (stateRef.current.keys.dash = false)}
                    className="px-3 h-8 bg-slate-900 border border-slate-800 active:bg-slate-800 rounded-lg text-slate-300 text-xs font-mono"
                  >
                    DASH
                  </button>
                  <button
                    onTouchStart={() => {
                      stateRef.current.keys.up = true;
                      stateRef.current.kibo.jumpBuffer = 6;
                    }}
                    onTouchEnd={() => (stateRef.current.keys.up = false)}
                    onMouseDown={() => {
                      stateRef.current.keys.up = true;
                      stateRef.current.kibo.jumpBuffer = 6;
                    }}
                    onMouseUp={() => (stateRef.current.keys.up = false)}
                    className="px-4 h-8 bg-white active:bg-slate-200 text-slate-950 font-bold rounded-lg text-xs font-mono"
                  >
                    {stageIndex === 2 ? 'FLOAT' : 'JUMP'}
                  </button>
                </div>
              </div>
            </div>
          </main>

          {/* Field Codex & Secret Drawer */}
          {codexOpen && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex justify-end animate-fade-in">
              <div className="w-full max-w-xl bg-[#090b12] border-l border-slate-800 h-full overflow-y-auto p-6 flex flex-col justify-between">
                <div className="space-y-6">
                  {/* Drawer Top Header */}
                  <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                    <div>
                      <span className="font-mono text-[10px] uppercase text-slate-500 tracking-widest">
                        SYNAPSE FIELD ARCHIVE
                      </span>
                      <h2 className="text-lg font-bold text-white mt-0.5">The Maker's Field Codex</h2>
                    </div>
                    <button
                      onClick={() => setCodexOpen(false)}
                      className="p-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-white transition"
                    >
                      <X className="w-4 h-4" />
                    </button>
                  </div>

                  {/* Navigation Tabs */}
                  <div className="flex border-b border-slate-800 text-xs font-mono">
                    <button
                      onClick={() => setActiveCodexTab('easter_eggs')}
                      className={`pb-2 px-3 border-b-2 transition flex items-center gap-1.5 ${
                        activeCodexTab === 'easter_eggs'
                          ? 'border-amber-400 text-amber-300 font-bold'
                          : 'border-transparent text-slate-500 hover:text-slate-300'
                      }`}
                    >
                      <Gift className="w-3.5 h-3.5" />
                      <span>Easter Eggs ({unlockedCount}/5)</span>
                    </button>
                    <button
                      onClick={() => setActiveCodexTab('protocols')}
                      className={`pb-2 px-3 border-b-2 transition ${
                        activeCodexTab === 'protocols'
                          ? 'border-white text-white font-bold'
                          : 'border-transparent text-slate-500 hover:text-slate-300'
                      }`}
                    >
                      Protocols
                    </button>
                    <button
                      onClick={() => setActiveCodexTab('timer')}
                      className={`pb-2 px-3 border-b-2 transition ${
                        activeCodexTab === 'timer'
                          ? 'border-white text-white font-bold'
                          : 'border-transparent text-slate-500 hover:text-slate-300'
                      }`}
                    >
                      Crazy 8s Timer
                    </button>
                    <button
                      onClick={() => setActiveCodexTab('cert')}
                      className={`pb-2 px-3 border-b-2 transition ${
                        activeCodexTab === 'cert'
                          ? 'border-white text-white font-bold'
                          : 'border-transparent text-slate-500 hover:text-slate-300'
                      }`}
                    >
                      Architect Card
                    </button>
                  </div>

                  {/* Tab 1: Secret Easter Eggs Archive */}
                  {activeCodexTab === 'easter_eggs' && (
                    <div className="space-y-3">
                      <div className="p-3 bg-amber-950/20 border border-amber-900/50 rounded-xl text-xs text-amber-300 font-mono">
                        Explore with curiosity. These secret heuristics reveal counter-intuitive truths about innovation.
                      </div>

                      {easterEggs.map((egg) => (
                        <div
                          key={egg.id}
                          className={`p-4 rounded-xl border transition ${
                            egg.unlocked
                              ? 'bg-[#121422] border-amber-500/60 shadow-lg'
                              : 'bg-[#0d0f18]/60 border-slate-800 opacity-60'
                          }`}
                        >
                          <div className="flex items-center justify-between font-mono text-xs">
                            <span className={`font-bold flex items-center gap-1.5 ${egg.unlocked ? 'text-amber-300' : 'text-slate-400'}`}>
                              {egg.unlocked ? <Gift className="w-3.5 h-3.5 text-amber-400" /> : <HelpCircle className="w-3.5 h-3.5 text-slate-500" />}
                              {egg.unlocked ? egg.title : 'Locked Secret Easter Egg'}
                            </span>
                            <span className={`text-[10px] px-2 py-0.5 rounded ${egg.unlocked ? 'bg-amber-500/20 text-amber-300' : 'bg-slate-800 text-slate-500'}`}>
                              {egg.unlocked ? 'UNLOCKED' : 'FIND IN GAME'}
                            </span>
                          </div>

                          {egg.unlocked ? (
                            <div className="mt-2 space-y-2">
                              <p className="text-xs text-slate-400 font-mono italic">
                                {egg.quote}
                              </p>
                              <div className="bg-[#090b12] p-2.5 rounded-lg border border-slate-800 text-xs text-slate-300 leading-relaxed font-sans">
                                <span className="text-[10px] font-mono text-cyan-400 block font-bold mb-0.5 uppercase">Workplace Application:</span>
                                {egg.workplaceTip}
                              </div>
                            </div>
                          ) : (
                            <p className="text-xs text-slate-500 mt-2 font-mono">
                              Hint: {egg.triggerDesc}
                            </p>
                          )}
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Tab 2: Mechanic ↔ Workplace Protocol */}
                  {activeCodexTab === 'protocols' && (
                    <div className="space-y-3">
                      {GAME_STAGES.map((s) => (
                        <div key={s.id} className="p-4 bg-[#11131e] rounded-xl border border-slate-800/80 space-y-2">
                          <div className="flex items-center justify-between font-mono text-xs">
                            <span className="font-bold text-slate-200">
                              {s.code} // {s.name}
                            </span>
                            <span className="text-[10px] text-slate-400">{s.phase}</span>
                          </div>
                          <p className="text-xs text-slate-300 leading-relaxed font-sans">
                            {s.codex.coreConcept}
                          </p>
                          <div className="pt-1">
                            <span className="text-[10px] font-mono text-violet-400 uppercase tracking-wider block mb-1">
                              Actionable Rules:
                            </span>
                            <ul className="text-xs text-slate-400 space-y-1 font-mono">
                              {s.codex.sprintRules.map((rule, idx) => (
                                <li key={idx} className="flex items-start gap-1.5">
                                  <span className="text-slate-500">•</span>
                                  <span>{rule}</span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Tab 3: Interactive Crazy 8s Facilitation Timer */}
                  {activeCodexTab === 'timer' && (
                    <div className="p-5 bg-[#11131e] rounded-xl border border-slate-800 space-y-4 text-center">
                      <span className="font-mono text-[10px] uppercase text-amber-400 tracking-wider">
                        Interactive Ideation Facilitator
                      </span>
                      <div>
                        <h3 className="text-base font-bold text-white">Crazy 8s Sprint Clock</h3>
                        <p className="text-xs text-slate-400 mt-1">
                          Fold a sheet of paper into 8 sections. Sketch 1 radical distinct concept every 60 seconds.
                        </p>
                      </div>

                      <div className="py-4">
                        <div className="text-5xl font-mono font-extrabold text-white tracking-tight">
                          0:{crazy8SecondsLeft.toString().padStart(2, '0')}
                        </div>
                        <span className="text-xs font-mono text-slate-400 mt-1 block">
                          ROUND {crazy8Round} OF 8
                        </span>
                      </div>

                      <div className="flex items-center justify-center gap-2">
                        <button
                          onClick={() => {
                            audio.jump();
                            setCrazy8Running(!crazy8Running);
                          }}
                          className="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-xs font-mono transition"
                        >
                          {crazy8Running ? 'PAUSE SPRINT' : 'START 8-MINUTE SPRINT'}
                        </button>
                        <button
                          onClick={() => {
                            setCrazy8Running(false);
                            setCrazy8Round(1);
                            setCrazy8SecondsLeft(60);
                          }}
                          className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-mono transition"
                        >
                          RESET
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Tab 4: Design Architect Credential Card */}
                  {activeCodexTab === 'cert' && (
                    <div className="p-5 bg-[#11131e] border border-slate-800 rounded-xl space-y-4">
                      <div className="flex items-center justify-between">
                        <span className="font-mono text-[10px] text-slate-500 uppercase tracking-widest">
                          SYNAPSE CREDENTIAL RECORD
                        </span>
                        <span className="text-xs font-mono text-emerald-400 flex items-center gap-1">
                          <Check className="w-3.5 h-3.5" /> Certified Maker
                        </span>
                      </div>

                      <div>
                        <span className="text-xs text-slate-400 block mb-1">Architect Name:</span>
                        <input
                          type="text"
                          value={practitionerName}
                          onChange={(e) => setPractitionerName(e.target.value)}
                          className="w-full bg-[#0a0c14] border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white font-mono focus:outline-none focus:border-slate-500"
                        />
                      </div>

                      <div className="border-t border-slate-800/80 pt-3 text-xs font-mono text-slate-400 space-y-1">
                        <div>PRACTITIONER: {practitionerName.toUpperCase()}</div>
                        <div>TELEMETRY TIME: {formatTime(elapsedSeconds)}</div>
                        <div>FAILURES / ITERATIONS: #{iterationFailures}</div>
                        <div>EASTER EGGS DISCOVERED: {unlockedCount} / 5</div>
                      </div>

                      <button
                        onClick={() => {
                          const credentialText = `===========================================
SYNAPSE // DESIGN ARCHITECT CREDENTIAL
===========================================
PRACTITIONER: ${practitionerName}
SPEEDRUN TIME: ${formatTime(elapsedSeconds)}
ITERATION FAILURES: ${iterationFailures}
EASTER EGGS DISCOVERED: ${unlockedCount} / 5
CORE DESIGN THINKING COMPETENCIES:
1. Empathize: Discarded boardroom assumptions via Contextual Sonar
2. Define: Isolated Core Root Cause over superficial noise
3. Ideate: Floated freely through skepticism barriers with Kibo
4. Prototype: Converted fast failures into physical stepping stones
5. Test: Navigated real customer telemetry to Product-Market Fit
===========================================`;
                          handleCopy(credentialText, 'card_copy');
                        }}
                        className="w-full py-2 bg-white hover:bg-slate-200 text-slate-950 font-bold rounded-lg text-xs font-mono transition flex items-center justify-center gap-1.5"
                      >
                        {copySuccessKey === 'card_copy' ? <Check className="w-3.5 h-3.5 text-emerald-600" /> : <Copy className="w-3.5 h-3.5" />}
                        Copy Credential
                      </button>
                    </div>
                  )}
                </div>

                {/* Footer */}
                <div className="pt-4 border-t border-slate-800">
                  <button
                    onClick={() => setCodexOpen(false)}
                    className="w-full py-2 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-xl text-xs font-mono transition"
                  >
                    Return to Odyssey
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
