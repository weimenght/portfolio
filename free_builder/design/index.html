  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- SOUND SYNTHESIS ENGINE (Web Audio API - Zero External Audio Dependencies) ---
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.08) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }
      jump() { this.playTone(330, 'sine', 0.12, 0.08); }
      trampoline() {
        this.playTone(440, 'triangle', 0.25, 0.12);
        setTimeout(() => this.playTone(660, 'sine', 0.25, 0.1), 80);
      }
      dash() { this.playTone(180, 'sawtooth', 0.18, 0.05); }
      sonar() {
        this.playTone(523.25, 'sine', 0.35, 0.07);
        setTimeout(() => this.playTone(659.25, 'sine', 0.35, 0.05), 90);
      }
      collect() {
        this.playTone(587.33, 'triangle', 0.12, 0.09);
        setTimeout(() => this.playTone(880, 'triangle', 0.2, 0.09), 80);
      }
      shatter() {
        this.playTone(120, 'square', 0.18, 0.06);
        setTimeout(() => this.playTone(90, 'sawtooth', 0.2, 0.05), 60);
      }
      placeBlock() { this.playTone(280, 'triangle', 0.15, 0.08); }
      fail() { this.playTone(140, 'sine', 0.35, 0.08); }
      easterEgg() {
        [523, 659, 783, 1046].forEach((f, idx) => {
          setTimeout(() => this.playTone(f, 'sine', 0.2, 0.09), idx * 70);
        });
      }
      win() {
        [440, 554, 659, 880, 1108].forEach((f, idx) => {
          setTimeout(() => this.playTone(f, 'triangle', 0.3, 0.1), idx * 90);
        });
      }
    }
    const audio = new AudioEngine();

    // --- GAME STAGES DATA ---
    const STAGES = [
      {
        id: 1,
        code: "PHASE 01 // EMPATHIZE",
        subtitle: "The Blind Spot",
        directive: "Step into unfamiliar shoes. Invisible paths appear only when Sonar [E] is active.",
        lore: "Assumptions obscure latent realities. Activate user perspective to expose what's hidden.",
        walkthrough: "Press E or the Sonar button to reveal invisible bridges. Reach the cyan beacon.",
        tool: "15-Minute Semi-Structured User Shadowing",
        quote: "People don't want a quarter-inch drill; they want a quarter-inch hole.",
        themeColor: "#38bdf8"
      },
      {
        id: 2,
        code: "PHASE 02 // DEFINE",
        subtitle: "The Noise Chasm",
        directive: "Filter decoy requests. Align the vibrating Core Insight node to anchor the light bridge.",
        lore: "Surface-level complaints mislead. Seek the non-obvious systemic root friction.",
        walkthrough: "Jump across to discover the genuine core insight node to bridge the chasm.",
        tool: "Anti-Assumption POV Formula & Root-Cause Matrix",
        quote: "If I had an hour to solve a problem, I'd spend 55 minutes thinking about the problem.",
        themeColor: "#a855f7"
      },
      {
        id: 3,
        code: "PHASE 03 // IDEATE",
        subtitle: "The Cloud Canopy",
        directive: "Defy gravity. Float on updrafts, touch doubt walls to pop them, and collect divergent sparks.",
        lore: "Judgment kills nascent brilliance. Defer criticism, think in extremes, and explore volume.",
        walkthrough: "Hold UP/SPACE to float! Collect the 3 magnetic sparks and pop doubt walls effortlessly.",
        tool: "Crazy 8s Speed Sketching & Worst Possible Idea Method",
        quote: "The best way to get a good idea is to get lots of ideas.",
        themeColor: "#eab308"
      },
      {
        id: 4,
        code: "PHASE 04 // PROTOTYPE",
        subtitle: "The Fail-Forward Foundry",
        directive: "Fail early to succeed sooner. Fall attempts solidify into physical stepping-stone ghosts.",
        lore: "Every failed low-fidelity test is not a loss, but a tangible structural foundation.",
        walkthrough: "Drop wireframe blocks [Q / Tap Block] or jump into the void to turn failures into bridges.",
        tool: "1-Hour Paper & Clickable Low-Fidelity Wireframes",
        quote: "If a picture is worth 1,000 words, a prototype is worth 1,000 meetings.",
        themeColor: "#10b981"
      },
      {
        id: 5,
        code: "PHASE 05 // TEST",
        subtitle: "Validation Summit",
        directive: "Listen to real feedback currents. Collect 3 Delight Orbs to trigger Product-Market Fit.",
        lore: "Don't sell your prototype. Observe unprompted friction and celebrate authentic discovery.",
        walkthrough: "Ride the upward drafts, collect the 3 Delight Stars, and ascend to the summit beacon.",
        tool: "I Like / I Wish / What If Feedback Grid",
        quote: "Prototype as if you know you are right, but test as if you know you are wrong.",
        themeColor: "#f43f5e"
      }
    ];

    // --- EASTER EGGS DATA ---
    const EASTER_EGGS_CATALOG = [
      {
        id: 'beginners_mind',
        title: "The Beginner's Mind",
        trigger: "Walk backward immediately at the start of Stage 1",
        tip: "Shunryu Suzuki: 'In the beginner's mind there are many possibilities; in the expert's mind there are few.' When interviewing users, consciously forget your domain expertise to ask naive questions."
      },
      {
        id: 'edge_case',
        title: "The Extreme User",
        trigger: "Linger on the precipice ledge for 2 seconds",
        tip: "Extreme users (power users, disabled users, complete novices) amplify latent frictions that average users unconsciously tolerate. Solve for the extreme, and the core benefits automatically."
      },
      {
        id: 'five_whys',
        title: "Sakichi Toyoda's 5 Whys",
        trigger: "Bump the dead-end wall 5 times in Stage 2",
        tip: "Whenever a user demands a feature (e.g. 'add an export button'), ask 'Why?' 5 times in succession. You will almost always discover a root workflow failure rather than a need for more UI buttons."
      },
      {
        id: 'worst_idea',
        title: "The 'Worst Possible Idea' Inversion",
        trigger: "Willingly dive into the void in Stage 4",
        tip: "Stuck in analysis paralysis? Ask your team: 'How could we design the most disastrous, privacy-violating, counter-productive product possible?' Reversing the bad ideas yields breakthrough solutions."
      },
      {
        id: 'quantity_chain',
        title: "Quantity Breeds Quality",
        trigger: "Perform a triple air bounce without landing in Stage 3",
        tip: "Alex Osborn (inventor of Brainstorming): The first 15 ideas are obvious tropes already present in the industry. True market disruption almost universally emerges between ideas #30 and #50."
      }
    ];

    // --- MAIN REACT GAME COMPONENT ---
    function SynapseGame() {
      const canvasRef = useRef(null);
      const [gameState, setGameState] = useState('TITLE'); // 'TITLE', 'PLAYING', 'STAGE_CLEAR', 'VICTORY'
      const [currentStageIdx, setCurrentStageIdx] = useState(0);
      const [isMuted, setIsMuted] = useState(false);
      const [ideaWingsEnabled, setIdeaWingsEnabled] = useState(false);
      const [codexOpen, setCodexOpen] = useState(false);
      const [discoveredEggs, setDiscoveredEggs] = useState([]);
      const [activeToast, setActiveToast] = useState(null);
      const [sonarActive, setSonarActive] = useState(false);
      const [showStage3Banner, setShowStage3Banner] = useState(false);
      const [timerRunning, setTimerRunning] = useState(false);
      const [timerSeconds, setTimerSeconds] = useState(480); // 8 minutes

      const stage = STAGES[currentStageIdx];

      // Mutable Game Loop State
      const gameRef = useRef({
        player: {
          x: 60,
          y: 350,
          vx: 0,
          vy: 0,
          w: 26,
          h: 34,
          grounded: false,
          facing: 1,
          coyoteTime: 0,
          jumpBuffer: 0,
          dashCooldown: 0,
          dashTimer: 0,
          squash: 1,
          blinkTimer: 0,
          isBlinking: false
        },
        keys: { left: false, right: false, up: false, down: false, dash: false, sonar: false },
        camera: { x: 0, y: 0 },
        platforms: [],
        items: [],
        doubtWalls: [],
        ghostPlatforms: [],
        particles: [],
        comboBounces: 0,
        bumpCount: 0,
        edgeTimer: 0,
        hasWalkedBackward: false,
        sparksCollected: 0,
        delightCollected: 0,
        screenshake: 0
      });

      // Crazy 8s Facilitation Timer
      useEffect(() => {
        let interval = null;
        if (timerRunning && timerSeconds > 0) {
          interval = setInterval(() => {
            setTimerSeconds(prev => {
              if (prev % 60 === 0 && prev !== 480) audio.collect();
              if (prev <= 1) {
                audio.win();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [timerRunning, timerSeconds]);

      // Trigger Design Thinking Easter Egg Notification
      const triggerEasterEgg = (eggId) => {
        if (!discoveredEggs.includes(eggId)) {
          const egg = EASTER_EGGS_CATALOG.find(e => e.id === eggId);
          if (egg) {
            setDiscoveredEggs(prev => [...prev, eggId]);
            audio.easterEgg();
            setActiveToast(egg);
            setTimeout(() => setActiveToast(null), 7000);
          }
        }
      };

      // Load Stages Level Geometry
      const loadStage = (stageIndex) => {
        const g = gameRef.current;
        g.player.x = 80;
        g.player.y = 300;
        g.player.vx = 0;
        g.player.vy = 0;
        g.sparksCollected = 0;
        g.delightCollected = 0;
        g.comboBounces = 0;
        g.bumpCount = 0;
        g.edgeTimer = 0;
        g.hasWalkedBackward = false;
        g.platforms = [];
        g.items = [];
        g.doubtWalls = [];
        g.particles = [];

        if (stageIndex === 2) {
          setShowStage3Banner(true);
        } else {
          setShowStage3Banner(false);
        }

        // STAGE 1: EMPATHIZE (Invisible Bridges via Sonar)
        if (stageIndex === 0) {
          g.platforms = [
            { x: 0, y: 440, w: 220, h: 60, type: 'solid' },
            { x: 260, y: 410, w: 120, h: 20, type: 'sonar' }, // invisible unless sonar
            { x: 440, y: 370, w: 130, h: 20, type: 'sonar' },
            { x: 630, y: 330, w: 140, h: 20, type: 'sonar' },
            { x: 840, y: 300, w: 300, h: 100, type: 'solid' }
          ];
          g.items = [
            { x: 500, y: 320, type: 'persona', label: 'User Persona: Maya', radius: 18, collected: false }
          ];
        }
        // STAGE 2: DEFINE (The POV Chasm & Decoy Nodes)
        else if (stageIndex === 1) {
          g.platforms = [
            { x: 0, y: 440, w: 200, h: 60, type: 'solid' },
            { x: 190, y: 260, w: 20, h: 180, type: 'deadend' }, // Wall for 5 Whys Easter Egg
            { x: 300, y: 440, w: 90, h: 20, type: 'solid' },
            { x: 470, y: 410, w: 90, h: 20, type: 'solid' },
            { x: 640, y: 380, w: 90, h: 20, type: 'solid' },
            { x: 850, y: 340, w: 320, h: 100, type: 'solid' }
          ];
          g.items = [
            { x: 345, y: 390, type: 'decoy', label: 'Feature Request (Decoy)' },
            { x: 515, y: 360, type: 'decoy', label: 'Vanity Metric (Decoy)' },
            { x: 685, y: 330, type: 'core_insight', label: 'Core Root Insight' }
          ];
        }
        // STAGE 3: IDEATE (Buoyant Playground, Hyper-magnetic sparks, Bubble walls)
        else if (stageIndex === 2) {
          g.platforms = [
            { x: 0, y: 440, w: 240, h: 60, type: 'solid' },
            { x: -50, y: 520, w: 1600, h: 40, type: 'trampoline_floor' }, // Bottom trampoline safety cloud
            { x: 320, y: 380, w: 100, h: 20, type: 'solid' },
            { x: 580, y: 340, w: 100, h: 20, type: 'solid' },
            { x: 820, y: 300, w: 100, h: 20, type: 'solid' },
            { x: 1060, y: 260, w: 300, h: 120, type: 'solid' }
          ];
          g.doubtWalls = [
            { x: 460, y: 240, w: 18, h: 180, label: "Too Risky", popped: false },
            { x: 720, y: 200, w: 18, h: 180, label: "No Budget", popped: false },
            { x: 960, y: 160, w: 18, h: 180, label: "Not Logical", popped: false }
          ];
          g.items = [
            { x: 260, y: 400, type: 'trampoline', radius: 18 },
            { x: 370, y: 280, type: 'spark', label: 'Idea Spark 1', radius: 16, collected: false },
            { x: 520, y: 370, type: 'trampoline', radius: 18 },
            { x: 630, y: 240, type: 'spark', label: 'Idea Spark 2', radius: 16, collected: false },
            { x: 760, y: 340, type: 'trampoline', radius: 18 },
            { x: 880, y: 200, type: 'spark', label: 'Idea Spark 3', radius: 16, collected: false }
          ];
        }
        // STAGE 4: PROTOTYPE (Fail-Forward Foundry)
        else if (stageIndex === 3) {
          g.platforms = [
            { x: 0, y: 440, w: 220, h: 60, type: 'solid' },
            { x: 880, y: 340, w: 320, h: 100, type: 'solid' }
          ];
          // User must drop blocks or fail into the void to generate ghost stairs across the 660px chasm!
        }
        // STAGE 5: TEST (Validation Summit)
        else if (stageIndex === 4) {
          g.platforms = [
            { x: 0, y: 440, w: 220, h: 60, type: 'solid' },
            { x: 280, y: 390, w: 110, h: 20, type: 'solid' },
            { x: 460, y: 330, w: 110, h: 20, type: 'solid' },
            { x: 660, y: 270, w: 110, h: 20, type: 'solid' },
            { x: 880, y: 210, w: 320, h: 140, type: 'solid' }
          ];
          g.items = [
            { x: 335, y: 330, type: 'delight', label: 'Delight Star A', collected: false },
            { x: 515, y: 270, type: 'delight', label: 'Delight Star B', collected: false },
            { x: 715, y: 210, type: 'delight', label: 'Delight Star C', collected: false }
          ];
        }
      };

      // Start Game
      const startGame = () => {
        audio.init();
        setGameState('PLAYING');
        setCurrentStageIdx(0);
        loadStage(0);
      };

      // Advance Stage
      const nextStage = () => {
        if (currentStageIdx < STAGES.length - 1) {
          const nextIdx = currentStageIdx + 1;
          setCurrentStageIdx(nextIdx);
          setGameState('PLAYING');
          loadStage(nextIdx);
        } else {
          setGameState('VICTORY');
          audio.win();
          if (window.confetti) {
            window.confetti({ particleCount: 160, spread: 80, origin: { y: 0.6 } });
          }
        }
      };

      // Restart Current Stage
      const restartCurrentStage = () => {
        loadStage(currentStageIdx);
        setGameState('PLAYING');
      };

      // Keyboard Controls
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
            e.preventDefault();
          }
          const k = gameRef.current.keys;
          if (e.code === 'ArrowLeft' || e.code === 'KeyA') k.left = true;
          if (e.code === 'ArrowRight' || e.code === 'KeyD') k.right = true;
          if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') {
            k.up = true;
            gameRef.current.player.jumpBuffer = 8;
          }
          if (e.code === 'ArrowDown' || e.code === 'KeyS') k.down = true;
          if (e.code === 'ShiftLeft' || e.code === 'KeyJ') k.dash = true;
          if (e.code === 'KeyE') {
            k.sonar = !k.sonar;
            setSonarActive(k.sonar);
            if (k.sonar) audio.sonar();
          }
          if (e.code === 'KeyQ' || e.code === 'KeyF') {
            // Drop Prototype Block in Stage 4
            dropWireframeBlock();
          }
        };

        const handleKeyUp = (e) => {
          const k = gameRef.current.keys;
          if (e.code === 'ArrowLeft' || e.code === 'KeyA') k.left = false;
          if (e.code === 'ArrowRight' || e.code === 'KeyD') k.right = false;
          if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') k.up = false;
          if (e.code === 'ArrowDown' || e.code === 'KeyS') k.down = false;
          if (e.code === 'ShiftLeft' || e.code === 'KeyJ') k.dash = false;
        };

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
        };
      }, [currentStageIdx]);

      // Drop Wireframe Prototype Block
      const dropWireframeBlock = () => {
        const p = gameRef.current.player;
        if (currentStageIdx === 3) {
          gameRef.current.ghostPlatforms.push({
            x: Math.round((p.x + p.w / 2 - 45) / 10) * 10,
            y: Math.round((p.y + p.h) / 10) * 10,
            w: 90,
            h: 16,
            isGhost: false
          });
          audio.placeBlock();
          p.squash = 0.8;
        }
      };

      // Main 60FPS Game Loop
      useEffect(() => {
        let animationFrameId;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const loop = () => {
          if (gameState === 'PLAYING') {
            updatePhysics();
          }
          render(ctx);
          animationFrameId = requestAnimationFrame(loop);
        };

        animationFrameId = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(animationFrameId);
      }, [gameState, currentStageIdx, sonarActive, ideaWingsEnabled]);

      // --- GAME PHYSICS & COLLISION UPDATE ---
      const updatePhysics = () => {
        const g = gameRef.current;
        const p = g.player;
        const keys = g.keys;

        // Easter Egg 1: Beginner's Mind (walking backward at start of stage 1)
        if (currentStageIdx === 0 && !g.hasWalkedBackward && keys.left && p.x <= 85) {
          g.hasWalkedBackward = true;
          triggerEasterEgg('beginners_mind');
        }

        // Easter Egg 2: Linger at cliff edge
        if (p.x > 180 && p.x < 210 && p.grounded) {
          g.edgeTimer++;
          if (g.edgeTimer > 110) {
            triggerEasterEgg('edge_case');
          }
        } else {
          g.edgeTimer = 0;
        }

        // Blinking mechanics for Kibo
        p.blinkTimer++;
        if (p.blinkTimer > 180 && Math.random() < 0.05) {
          p.isBlinking = true;
          if (p.blinkTimer > 192) {
            p.isBlinking = false;
            p.blinkTimer = 0;
          }
        }

        // Gravity modifier (Ideate has buoyant gravity)
        let gravity = 0.55;
        let maxFallSpeed = 12;
        let moveAccel = 0.8;
        let maxRunSpeed = 5.2;

        if (currentStageIdx === 2) {
          gravity = ideaWingsEnabled ? 0.08 : 0.28; // Buoyant updrafts
          maxFallSpeed = 6;
          maxRunSpeed = 6.2;
          if (keys.up || ideaWingsEnabled) {
            p.vy -= 0.65; // continuous balloon floating
          }
        }

        // Horizontal Movement
        if (keys.left) {
          p.vx -= moveAccel;
          p.facing = -1;
        } else if (keys.right) {
          p.vx += moveAccel;
          p.facing = 1;
        } else {
          p.vx *= 0.78; // friction
        }

        // Clamp run speed
        p.vx = Math.max(-maxRunSpeed, Math.min(maxRunSpeed, p.vx));

        // Dash Mechanic
        if (keys.dash && p.dashCooldown <= 0) {
          p.vx = p.facing * 14;
          p.vy = 0;
          p.dashCooldown = 35;
          p.dashTimer = 10;
          p.squash = 1.35;
          audio.dash();
        }
        if (p.dashCooldown > 0) p.dashCooldown--;
        if (p.dashTimer > 0) {
          p.dashTimer--;
          p.vy = 0; // suspend gravity briefly during dash
        } else {
          p.vy += gravity;
          p.vy = Math.min(p.vy, maxFallSpeed);
        }

        // Coyote Time & Jump Buffering
        if (p.grounded) {
          p.coyoteTime = 8;
        } else if (p.coyoteTime > 0) {
          p.coyoteTime--;
        }

        if (p.jumpBuffer > 0) p.jumpBuffer--;

        // Execute Jump
        if (p.jumpBuffer > 0 && p.coyoteTime > 0) {
          p.vy = currentStageIdx === 2 ? -9.5 : -11.5;
          p.grounded = false;
          p.coyoteTime = 0;
          p.jumpBuffer = 0;
          p.squash = 1.4;
          audio.jump();
        }

        // Air squashing decay
        p.squash += (1 - p.squash) * 0.12;

        // Apply velocities
        p.x += p.vx;
        p.y += p.vy;

        // Collect all active platforms
        let allPlatforms = [...g.platforms, ...g.ghostPlatforms];
        if (currentStageIdx === 0 && !sonarActive) {
          allPlatforms = allPlatforms.filter(plat => plat.type !== 'sonar');
        }

        p.grounded = false;

        // Platform Collisions
        allPlatforms.forEach(plat => {
          // Bumping dead-end wall in Stage 2 (Easter Egg: 5 Whys)
          if (plat.type === 'deadend') {
            if (p.x + p.w >= plat.x && p.x <= plat.x + plat.w && p.y + p.h > plat.y && p.y < plat.y + plat.h) {
              if (p.vx > 0) {
                p.x = plat.x - p.w;
                p.vx = 0;
                g.bumpCount++;
                audio.dash();
                if (g.bumpCount >= 5) triggerEasterEgg('five_whys');
              }
            }
            return;
          }

          // Safety Cloud Floor Trampoline in Stage 3
          if (plat.type === 'trampoline_floor') {
            if (p.y + p.h >= plat.y && p.y < plat.y + plat.h && p.x + p.w > plat.x && p.x < plat.x + plat.w) {
              p.y = plat.y - p.h;
              p.vy = -12;
              p.grounded = false;
              audio.trampoline();
              g.screenshake = 5;
            }
            return;
          }

          // Solid and Sonar Platform Standing Collision
          if (
            p.x + p.w > plat.x &&
            p.x < plat.x + plat.w &&
            p.y + p.h >= plat.y &&
            p.y + p.h <= plat.y + plat.h + p.vy + 4 &&
            p.vy >= 0
          ) {
            p.y = plat.y - p.h;
            p.vy = 0;
            p.grounded = true;
          }
        });

        // Interactive Stage Items Collision & Hyper Magnetism
        g.items.forEach(item => {
          if (item.collected) return;

          // Magnetism for Stage 3 Idea Sparks
          if (item.type === 'spark') {
            const dx = (p.x + p.w / 2) - item.x;
            const dy = (p.y + p.h / 2) - item.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            // 220px magnetic pull radius
            if (dist < 220) {
              item.x += dx * 0.12;
              item.y += dy * 0.12;
            }

            if (dist < 32) {
              item.collected = true;
              g.sparksCollected++;
              audio.collect();
              // Spawn burst particles
              for (let i = 0; i < 16; i++) {
                g.particles.push({
                  x: item.x,
                  y: item.y,
                  vx: (Math.random() - 0.5) * 8,
                  vy: (Math.random() - 0.5) * 8,
                  color: '#fbbf24',
                  life: 25
                });
              }
            }
          }

          // Stage 3 Trampolines
          if (item.type === 'trampoline') {
            const dx = (p.x + p.w / 2) - item.x;
            const dy = (p.y + p.h) - item.y;
            if (Math.abs(dx) < 26 && Math.abs(dy) < 18 && p.vy > 0) {
              p.vy = -14;
              p.grounded = false;
              audio.trampoline();
              g.comboBounces++;
              if (g.comboBounces >= 3) triggerEasterEgg('quantity_chain');
            }
          }

          // Core Insight Node in Stage 2
          if (item.type === 'core_insight') {
            const dx = (p.x + p.w / 2) - item.x;
            const dy = (p.y + p.h / 2) - item.y;
            if (Math.sqrt(dx * dx + dy * dy) < 32) {
              item.collected = true;
              audio.collect();
              // Manifest permanent light bridge across chasm
              g.platforms.push({ x: 200, y: 390, w: 660, h: 14, type: 'solid' });
            }
          }

          // Stage 5 Delight Stars
          if (item.type === 'delight') {
            const dx = (p.x + p.w / 2) - item.x;
            const dy = (p.y + p.h / 2) - item.y;
            if (Math.sqrt(dx * dx + dy * dy) < 30) {
              item.collected = true;
              g.delightCollected++;
              audio.collect();
            }
          }
        });

        // Stage 3 Doubt Walls (Bubble Fragile)
        if (currentStageIdx === 2) {
          g.doubtWalls.forEach(wall => {
            if (wall.popped) return;
            if (p.x + p.w >= wall.x && p.x <= wall.x + wall.w && p.y + p.h >= wall.y && p.y <= wall.y + wall.h) {
              wall.popped = true;
              audio.shatter();
              g.screenshake = 6;
              // Burst into colorful sparks
              for (let i = 0; i < 20; i++) {
                g.particles.push({
                  x: wall.x,
                  y: wall.y + Math.random() * wall.h,
                  vx: (Math.random() - 0.5) * 9,
                  vy: (Math.random() - 0.5) * 9,
                  color: '#f43f5e',
                  life: 30
                });
              }
            }
          });
        }

        // Particle System Decay
        g.particles.forEach(pt => {
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.life--;
        });
        g.particles = g.particles.filter(pt => pt.life > 0);

        // Stage 4 Prototype "Fail-Forward" Void Fall Mechanic
        if (p.y > 540) {
          if (currentStageIdx === 3) {
            // Transform failed leap into a permanent iteration stepping stone
            g.ghostPlatforms.push({
              x: Math.round(p.x / 10) * 10 - 25,
              y: Math.min(480, Math.round(p.y / 10) * 10 - 60),
              w: 75,
              h: 16,
              isGhost: true
            });
            triggerEasterEgg('worst_idea');
            audio.fail();
            // Respawn at beginning
            p.x = 80;
            p.y = 300;
            p.vx = 0;
            p.vy = 0;
          } else if (currentStageIdx === 2) {
            // ideate safety floor handles it
            p.y = 480;
            p.vy = -12;
          } else {
            // standard stage respawn
            audio.fail();
            p.x = 80;
            p.y = 300;
            p.vx = 0;
            p.vy = 0;
          }
        }

        // Stage Clear Trigger (Reaching the Right-Hand Summit Beacon)
        if (p.x >= 920 && p.y <= 380) {
          audio.win();
          setGameState('STAGE_CLEAR');
        }

        // Smooth Camera Lerp
        const targetCamX = p.x - 280;
        g.camera.x += (targetCamX - g.camera.x) * 0.08;
        if (g.camera.x < 0) g.camera.x = 0;

        // Screenshake decay
        if (g.screenshake > 0) g.screenshake *= 0.85;
      };

      // --- 60FPS VECTOR CANVAS RENDERER ---
      const render = (ctx) => {
        const g = gameRef.current;
        const p = g.player;
        const camX = g.camera.x;
        const shake = (Math.random() - 0.5) * g.screenshake;

        ctx.save();
        ctx.translate(-camX + shake, shake);

        // Clear Canvas
        ctx.fillStyle = '#07080d';
        ctx.fillRect(camX - 20, -20, 1000, 600);

        // Ambient Stage Aura Gradient
        const grad = ctx.createLinearGradient(camX, 0, camX + 800, 500);
        grad.addColorStop(0, 'rgba(15, 23, 42, 0.4)');
        grad.addColorStop(1, `${stage.themeColor}12`);
        ctx.fillStyle = grad;
        ctx.fillRect(camX, 0, 850, 500);

        // Background Depth Grid
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        for (let x = 0; x < 1500; x += 60) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, 500);
          ctx.stroke();
        }

        // Stage 3 Golden Sine Breadcrumb Flight Path
        if (currentStageIdx === 2) {
          ctx.save();
          ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
          ctx.lineWidth = 3;
          ctx.setLineDash([8, 12]);
          ctx.beginPath();
          for (let bx = 120; bx <= 980; bx += 10) {
            const by = 260 + Math.sin(bx * 0.015) * 70;
            if (bx === 120) ctx.moveTo(bx, by);
            else ctx.lineTo(bx, by);
          }
          ctx.stroke();
          ctx.restore();
        }

        // Draw Platforms
        g.platforms.forEach(plat => {
          if (plat.type === 'sonar' && !sonarActive) return;

          if (plat.type === 'sonar') {
            ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.setLineDash([]);
          } else if (plat.type === 'trampoline_floor') {
            ctx.fillStyle = 'rgba(251, 191, 36, 0.15)';
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.strokeStyle = '#eab308';
            ctx.strokeRect(plat.x, plat.y, plat.w, 4);
          } else if (plat.type === 'deadend') {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.fillStyle = '#64748b';
            ctx.font = '10px monospace';
            ctx.fillText('WHY?', plat.x - 2, plat.y + 40);
          } else {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.strokeStyle = stage.themeColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(plat.x, plat.y);
            ctx.lineTo(plat.x + plat.w, plat.y);
            ctx.stroke();
          }
        });

        // Draw Ghost Prototype Platforms in Stage 4
        g.ghostPlatforms.forEach((gplat, idx) => {
          ctx.save();
          ctx.fillStyle = gplat.isGhost ? 'rgba(16, 185, 129, 0.18)' : 'rgba(56, 189, 248, 0.25)';
          ctx.strokeStyle = gplat.isGhost ? '#10b981' : '#38bdf8';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([3, 3]);
          ctx.fillRect(gplat.x, gplat.y, gplat.w, gplat.h);
          ctx.strokeRect(gplat.x, gplat.y, gplat.w, gplat.h);
          ctx.font = '9px monospace';
          ctx.fillStyle = gplat.isGhost ? '#6ee7b7' : '#7dd3fc';
          ctx.fillText(`MVP v${idx + 1}`, gplat.x + 8, gplat.y + 11);
          ctx.restore();
        });

        // Draw Interactive Items
        g.items.forEach(item => {
          if (item.collected) return;

          // Stage 3 Sparks
          if (item.type === 'spark') {
            ctx.save();
            ctx.fillStyle = '#fbbf24';
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(item.x, item.y, 8, 0, Math.PI * 2);
            ctx.fill();
            // Radiating pulse halo
            ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(item.x, item.y, 14 + Math.sin(Date.now() * 0.008) * 4, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          // Stage 3 Trampolines
          if (item.type === 'trampoline') {
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(item.x, item.y, 14, 0, Math.PI, true);
            ctx.fill();
            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 2;
            ctx.stroke();
          }

          // Core Insight
          if (item.type === 'core_insight') {
            ctx.save();
            ctx.fillStyle = '#c084fc';
            ctx.shadowColor = '#a855f7';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(item.x, item.y, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = '10px monospace';
            ctx.fillStyle = '#f3e8ff';
            ctx.fillText('ROOT CAUSE', item.x - 30, item.y - 18);
            ctx.restore();
          }

          // Delight Stars in Stage 5
          if (item.type === 'delight') {
            ctx.save();
            ctx.fillStyle = '#fb7185';
            ctx.shadowColor = '#f43f5e';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(item.x, item.y, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = '10px monospace';
            ctx.fillStyle = '#ffe4e6';
            ctx.fillText('DELIGHT', item.x - 22, item.y - 16);
            ctx.restore();
          }
        });

        // Stage 3 Bubble Doubt Walls
        if (currentStageIdx === 2) {
          g.doubtWalls.forEach(wall => {
            if (wall.popped) return;
            ctx.save();
            ctx.fillStyle = 'rgba(244, 63, 94, 0.2)';
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 2;
            ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
            ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
            ctx.fillStyle = '#fda4af';
            ctx.font = '10px monospace';
            ctx.save();
            ctx.translate(wall.x + 12, wall.y + wall.h / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText(`[ ${wall.label} ]`, -35, 0);
            ctx.restore();
            ctx.restore();
          });
        }

        // Draw Stage Goal Beacon
        ctx.save();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
        ctx.strokeStyle = stage.themeColor;
        ctx.lineWidth = 3;
        ctx.shadowColor = stage.themeColor;
        ctx.shadowBlur = 20;
        ctx.strokeRect(920, 240, 45, 100);
        ctx.fillRect(920, 240, 45, 100);
        ctx.fillStyle = '#ffffff';
        ctx.font = '11px monospace';
        ctx.fillText('STAGE EXIT ➔', 885, 225);
        ctx.restore();

        // Draw Particles
        g.particles.forEach(pt => {
          ctx.fillStyle = pt.color;
          ctx.fillRect(pt.x, pt.y, 3, 3);
        });

        // --- DRAW PROTAGONIST "KIBO" ---
        ctx.save();
        ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
        ctx.scale(p.facing * (2 - p.squash), p.squash);

        // Kibo Stage 3 Lightbulb Halo
        if (currentStageIdx === 2) {
          ctx.strokeStyle = '#fde047';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, -26, 7, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Kibo Body
        ctx.fillStyle = '#0f172a';
        ctx.strokeStyle = stage.themeColor;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = stage.themeColor;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 7);
        ctx.fill();
        ctx.stroke();

        // Expressive Neon Eyes
        ctx.fillStyle = '#ffffff';
        if (p.isBlinking) {
          // Blinking slit
          ctx.fillRect(2, -4, 6, 2);
        } else {
          // Normal open eyes looking forward
          ctx.beginPath();
          ctx.arc(4, -4, 3, 0, Math.PI * 2);
          ctx.fill();
        }

        // Trailing Cape Accent
        ctx.fillStyle = `${stage.themeColor}88`;
        ctx.beginPath();
        ctx.moveTo(-p.w / 2, -2);
        ctx.lineTo(-p.w / 2 - 8, p.h / 2 - 2);
        ctx.lineTo(-p.w / 2, p.h / 2);
        ctx.fill();

        ctx.restore();
        ctx.restore();
      };

      return (
        <div className="relative w-full h-screen bg-[#07080d] overflow-hidden flex flex-col justify-between">
          
          {/* TOP MINIMALIST HUD */}
          <header className="z-20 flex items-center justify-between px-6 py-4 bg-[#0a0d17]/80 backdrop-blur-md border-b border-slate-800">
            <div className="flex items-center space-x-4">
              <div className="flex items-center space-x-2">
                <span className="inline-block w-2.5 h-2.5 rounded-full animate-ping" style={{ backgroundColor: stage.themeColor }} />
                <h1 className="font-mono text-sm font-semibold tracking-wider text-slate-200">
                  {stage.code}
                </h1>
              </div>
              <span className="text-xs text-slate-500 hidden sm:inline">|</span>
              <span className="text-xs font-mono text-slate-400 hidden sm:inline">
                {stage.subtitle}
              </span>
            </div>

            {/* Stage Quick Navigation Pills */}
            <div className="flex items-center space-x-1.5">
              {STAGES.map((s, idx) => (
                <button
                  key={s.id}
                  onClick={() => {
                    setCurrentStageIdx(idx);
                    setGameState('PLAYING');
                    loadStage(idx);
                  }}
                  className={`w-7 h-7 rounded-lg text-xs font-mono font-semibold transition-all ${
                    idx === currentStageIdx
                      ? 'bg-slate-100 text-slate-900 shadow-md scale-105'
                      : 'bg-slate-800/80 text-slate-400 hover:bg-slate-700'
                  }`}
                  title={s.subtitle}
                >
                  0{s.id}
                </button>
              ))}
            </div>

            {/* Quick Action Toggles */}
            <div className="flex items-center space-x-3">
              {/* Stage 3 Idea Wings Toggle */}
              {currentStageIdx === 2 && (
                <button
                  onClick={() => setIdeaWingsEnabled(!ideaWingsEnabled)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-mono font-semibold transition-all border ${
                    ideaWingsEnabled
                      ? 'bg-amber-500/20 text-amber-300 border-amber-400/50 shadow-md'
                      : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'
                  }`}
                >
                  🪽 Idea Wings: {ideaWingsEnabled ? 'ON' : 'OFF'}
                </button>
              )}

              {/* Stage 1 Sonar Perspective Toggle */}
              {currentStageIdx === 0 && (
                <button
                  onClick={() => {
                    const next = !sonarActive;
                    setSonarActive(next);
                    gameRef.current.keys.sonar = next;
                    if (next) audio.sonar();
                  }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-mono font-semibold transition-all border ${
                    sonarActive
                      ? 'bg-sky-500/20 text-sky-300 border-sky-400/50 shadow-md'
                      : 'bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700'
                  }`}
                >
                  👁️ Sonar [E]: {sonarActive ? 'ACTIVE' : 'OFF'}
                </button>
              )}

              {/* Mute Toggle */}
              <button
                onClick={() => {
                  audio.muted = !isMuted;
                  setIsMuted(!isMuted);
                }}
                className="p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition-colors border border-slate-700"
                title="Toggle Sound"
              >
                {isMuted ? '🔇' : '🔊'}
              </button>

              {/* Field Codex Drawer Trigger */}
              <button
                onClick={() => setCodexOpen(true)}
                className="px-3 py-1.5 rounded-lg bg-sky-500/10 hover:bg-sky-500/20 border border-sky-500/30 text-sky-300 font-mono text-xs font-medium transition-all"
              >
                📖 Codex ({discoveredEggs.length}/5)
              </button>
            </div>
          </header>

          {/* MAIN INTERACTIVE CANVAS VIEWPORT */}
          <main className="relative flex-1 w-full h-full flex items-center justify-center">
            <canvas
              ref={canvasRef}
              width={800}
              height={480}
              tabIndex={0}
              className="w-full max-w-5xl h-auto max-h-[85vh] bg-[#07080d] rounded-2xl shadow-2xl border border-slate-800 focus:outline-none"
            />

            {/* STAGE 3 WALKTHROUGH OVERLAY */}
            {showStage3Banner && gameState === 'PLAYING' && (
              <div className="absolute top-6 left-1/2 -translate-x-1/2 bg-slate-900/90 border border-amber-500/40 rounded-xl px-6 py-3.5 shadow-2xl backdrop-blur-md max-w-lg text-center animate-fade-in z-10">
                <div className="flex items-center justify-center space-x-2 text-amber-400 text-xs font-mono font-bold uppercase tracking-wider mb-1">
                  <span>💡 Ideation Playground</span>
                </div>
                <p className="text-xs text-slate-200 leading-relaxed mb-2">
                  <strong className="text-white">Hold UP / SPACE to float like a balloon.</strong> Touch doubt walls to pop them into confetti. Idea sparks will fly straight to you!
                </p>
                <button
                  onClick={() => setShowStage3Banner(false)}
                  className="px-3 py-1 rounded bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-semibold"
                >
                  Got It!
                </button>
              </div>
            )}

            {/* EASTER EGG POPUP TOAST */}
            {activeToast && (
              <div className="absolute bottom-16 left-1/2 -translate-x-1/2 bg-slate-900/95 border border-emerald-500/50 rounded-xl px-5 py-4 shadow-2xl backdrop-blur-md max-w-md w-full animate-bounce z-30">
                <div className="flex items-center space-x-2 text-emerald-400 text-xs font-mono font-bold tracking-wider mb-1">
                  <span>🐣 EASTER EGG UNLOCKED:</span>
                  <span>{activeToast.title}</span>
                </div>
                <p className="text-xs text-slate-300 leading-relaxed">
                  {activeToast.tip}
                </p>
              </div>
            )}

            {/* START SCREEN OVERLAY */}
            {gameState === 'TITLE' && (
              <div className="absolute inset-0 bg-[#07080d]/95 backdrop-blur-lg flex flex-col items-center justify-center p-6 text-center z-30">
                <div className="max-w-md space-y-6">
                  <div className="space-y-2">
                    <span className="text-xs font-mono tracking-widest text-sky-400 uppercase">Interactive Learning Odyssey</span>
                    <h1 className="text-4xl sm:text-5xl font-extrabold tracking-tight text-white">SYNAPSE</h1>
                    <p className="text-sm text-slate-400">Master Design Thinking through genuine indie platforming mechanics. No buzzwords. Zero forced logins.</p>
                  </div>

                  <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-800 text-left space-y-2 font-mono text-xs text-slate-300">
                    <div className="flex justify-between"><span className="text-slate-500">Move:</span> <span>A / D or Arrow Keys</span></div>
                    <div className="flex justify-between"><span className="text-slate-500">Jump / Float:</span> <span>W / Space / Up</span></div>
                    <div className="flex justify-between"><span className="text-slate-500">Air Dash:</span> <span>Shift or J</span></div>
                    <div className="flex justify-between"><span className="text-slate-500">User Perspective:</span> <span>E (Empathy Sonar)</span></div>
                    <div className="flex justify-between"><span className="text-slate-500">Drop Prototype:</span> <span>Q / F (In Stage 4)</span></div>
                  </div>

                  <button
                    onClick={startGame}
                    className="w-full py-3.5 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg transition-all transform hover:scale-[1.02] active:scale-[0.98]"
                  >
                    DIVE IN ➔
                  </button>
                </div>
              </div>
            )}

            {/* STAGE CLEAR MODAL */}
            {gameState === 'STAGE_CLEAR' && (
              <div className="absolute inset-0 bg-[#07080d]/90 backdrop-blur-md flex items-center justify-center p-6 z-30">
                <div className="max-w-lg w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 space-y-5 shadow-2xl">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <span className="font-mono text-xs text-slate-400">{stage.code} COMPLETE</span>
                    <span className="text-xs px-2.5 py-1 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Verified</span>
                  </div>

                  <div className="space-y-2">
                    <h2 className="text-2xl font-bold text-white">{stage.subtitle}</h2>
                    <blockquote className="border-l-2 border-sky-500 pl-3 text-xs italic text-slate-300">
                      "{stage.quote}"
                    </blockquote>
                  </div>

                  <div className="bg-slate-950/70 p-4 rounded-xl border border-slate-800/80 space-y-2">
                    <div className="text-xs font-mono text-sky-400 font-medium">WORKPLACE APPLICATION:</div>
                    <div className="text-sm font-semibold text-slate-100">{stage.tool}</div>
                    <p className="text-xs text-slate-400 leading-relaxed">{stage.lore}</p>
                  </div>

                  <div className="flex space-x-3 pt-2">
                    <button
                      onClick={restartCurrentStage}
                      className="w-1/3 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition"
                    >
                      Replay
                    </button>
                    <button
                      onClick={nextStage}
                      className="w-2/3 py-2.5 bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold rounded-xl text-xs transition"
                    >
                      CONTINUE ODYSSEY ➔
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* FINAL VICTORY MODAL */}
            {gameState === 'VICTORY' && (
              <div className="absolute inset-0 bg-[#07080d]/95 backdrop-blur-lg flex items-center justify-center p-6 z-30">
                <div className="max-w-lg w-full bg-slate-900 border border-emerald-500/30 rounded-2xl p-8 text-center space-y-6 shadow-2xl">
                  <div className="inline-block p-4 rounded-full bg-emerald-500/20 text-emerald-300 text-3xl">
                    🏆
                  </div>
                  <div className="space-y-2">
                    <h2 className="text-3xl font-extrabold text-white">Product-Market Fit Attained</h2>
                    <p className="text-xs text-slate-300">
                      You navigated all 5 phases of Design Thinking, transformed user friction into actionable insights, and turned disposable failures into product success.
                    </p>
                  </div>

                  <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 text-left space-y-2 font-mono text-xs">
                    <div className="text-emerald-400 font-semibold">ODYSSEY CREDENTIAL:</div>
                    <div className="text-slate-300">Practitioner: Autonomous Innovator</div>
                    <div className="text-slate-400">Easter Eggs Discovered: {discoveredEggs.length} / 5</div>
                  </div>

                  <button
                    onClick={() => {
                      setCurrentStageIdx(0);
                      setGameState('PLAYING');
                      loadStage(0);
                    }}
                    className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl transition"
                  >
                    PLAY AGAIN
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* BOTTOM MINIMAL CONTROL BAR (MOBILE / TOUCH FRIENDLY) */}
          <footer className="z-20 px-6 py-3 bg-[#0a0d17]/80 backdrop-blur-md border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
            <div className="flex items-center space-x-2">
              <span className="font-mono text-slate-500">Current Directive:</span>
              <span className="text-slate-300">{stage.directive}</span>
            </div>

            {/* Mobile Touch Action Buttons */}
            <div className="flex items-center space-x-2 sm:hidden">
              <button
                onTouchStart={() => { gameRef.current.keys.left = true; }}
                onTouchEnd={() => { gameRef.current.keys.left = false; }}
                className="w-10 h-10 rounded-lg bg-slate-800 active:bg-slate-700 text-white flex items-center justify-center text-lg"
              >
                ◀
              </button>
              <button
                onTouchStart={() => { gameRef.current.keys.right = true; }}
                onTouchEnd={() => { gameRef.current.keys.right = false; }}
                className="w-10 h-10 rounded-lg bg-slate-800 active:bg-slate-700 text-white flex items-center justify-center text-lg"
              >
                ▶
              </button>
              <button
                onTouchStart={() => {
                  gameRef.current.keys.up = true;
                  gameRef.current.player.jumpBuffer = 8;
                }}
                onTouchEnd={() => { gameRef.current.keys.up = false; }}
                className="w-12 h-10 rounded-lg bg-sky-500 active:bg-sky-400 text-slate-950 font-bold flex items-center justify-center text-sm"
              >
                JUMP
              </button>
              {currentStageIdx === 3 && (
                <button
                  onClick={dropWireframeBlock}
                  className="px-3 h-10 rounded-lg bg-emerald-600 active:bg-emerald-500 text-white font-mono text-xs flex items-center justify-center"
                >
                  BLOCK
                </button>
              )}
            </div>
          </footer>

          {/* FIELD CODEX & WORKPLACE TOOLKIT SLIDE-OVER DRAWER */}
          {codexOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex justify-end">
              <div className="w-full max-w-md bg-slate-900 border-l border-slate-800 h-full p-6 overflow-y-auto flex flex-col justify-between shadow-2xl">
                <div className="space-y-6">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                    <div>
                      <h2 className="text-lg font-bold text-white">Maker's Field Codex</h2>
                      <p className="text-xs font-mono text-sky-400">Design Thinking Playbook & Easter Eggs</p>
                    </div>
                    <button
                      onClick={() => setCodexOpen(false)}
                      className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"
                    >
                      ✕
                    </button>
                  </div>

                  {/* Crazy 8s Facilitation Timer Widget */}
                  <div className="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-mono text-amber-400 font-semibold">CRAZY 8s SPRINT TIMER</span>
                      <span className="font-mono text-sm text-slate-200">
                        {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-400 leading-tight">
                      Fold a paper into 8 rectangles. Sketch 1 wild idea per minute. Chimes sound every 60s.
                    </p>
                    <div className="flex space-x-2">
                      <button
                        onClick={() => setTimerRunning(!timerRunning)}
                        className={`flex-1 py-1.5 rounded-lg text-xs font-semibold ${
                          timerRunning ? 'bg-rose-500 text-white' : 'bg-amber-500 text-slate-950'
                        }`}
                      >
                        {timerRunning ? 'PAUSE' : 'START 8-MIN SPRINT'}
                      </button>
                      <button
                        onClick={() => { setTimerRunning(false); setTimerSeconds(480); }}
                        className="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs"
                      >
                        RESET
                      </button>
                    </div>
                  </div>

                  {/* Easter Egg Tracker */}
                  <div className="space-y-3">
                    <h3 className="text-xs font-mono text-slate-400 font-semibold tracking-wider">
                      DISCOVERED DESIGN TRUTHS ({discoveredEggs.length} / 5)
                    </h3>
                    <div className="space-y-2">
                      {EASTER_EGGS_CATALOG.map((egg) => {
                        const isUnlocked = discoveredEggs.includes(egg.id);
                        return (
                          <div
                            key={egg.id}
                            className={`p-3 rounded-xl border text-xs transition-all ${
                              isUnlocked
                                ? 'bg-slate-950 border-emerald-500/40 text-slate-200'
                                : 'bg-slate-950/40 border-slate-800/60 text-slate-500'
                            }`}
                          >
                            <div className="flex items-center justify-between font-mono mb-1">
                              <span className={isUnlocked ? 'text-emerald-400 font-medium' : 'text-slate-600'}>
                                {isUnlocked ? `🐣 ${egg.title}` : '🔒 Undiscovered Tip'}
                              </span>
                              <span className="text-[10px]">{isUnlocked ? 'UNLOCKED' : 'LOCKED'}</span>
                            </div>
                            <p className="text-[11px] leading-relaxed">
                              {isUnlocked ? egg.tip : `Hint: ${egg.trigger}`}
                            </p>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                <div className="pt-6 border-t border-slate-800 text-center">
                  <button
                    onClick={() => setCodexOpen(false)}
                    className="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium"
                  >
                    RETURN TO GAME
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render the React application into root
    ReactDOM.createRoot(document.getElementById('root')).render(<SynapseGame />);
  </script>
</body>
</html>
