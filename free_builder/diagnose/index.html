function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

/* Sound: soft, short, optional */
const sound = {
  ctx: null, muted: store.get("fb_muted", false),
  init() { if (!this.ctx) { const A = window.AudioContext || window.webkitAudioContext; if (A) this.ctx = new A(); } if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  tone(f, d = .3, g = .06, type = "sine", at = 0) {
    if (this.muted || !this.ctx) return;
    try { const t = this.ctx.currentTime + at, o = this.ctx.createOscillator(), a = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); a.gain.setValueAtTime(.0001, t); a.gain.linearRampToValueAtTime(g, t + .02); a.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(a); a.connect(this.ctx.destination); o.start(t); o.stop(t + d + .05); } catch (e) {}
  },
  tap() { this.tone(520, .12, .04, "triangle"); },
  chime() { [659.25, 880, 1318.5].forEach((f, i) => this.tone(f, 1.2, .05, "sine", i * .12)); },
  warm() { [392, 493.88, 587.33].forEach((f, i) => this.tone(f, .9, .05, "sine", i * .1)); }
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* Keep the screen awake while a timer runs (where supported) */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

/* Timer ring */
function ringSVG() {
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="54" fill="none" stroke-width="6"/><circle class="fg" id="ring" cx="60" cy="60" r="54" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="0"/></svg>`;
}
const timer = {
  total: 90, left: 90, running: false, raf: 0, last: 0, onEnd: null, ended: false,
  start(total, onEnd) { this.stop(); this.total = this.left = total; this.onEnd = onEnd; this.ended = false; this.resume(); },
  resume() { if (this.running || this.ended) return; this.running = true; this.last = performance.now(); keepAwake(true); this.tick(); },
  pause() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); this.paint(); },
  stop() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); },
  tick() {
    if (!this.running) return;
    const now = performance.now(); this.left = Math.max(0, this.left - (now - this.last) / 1000); this.last = now;
    this.paint();
    if (this.left <= 0) { this.running = false; this.ended = true; keepAwake(false); sound.chime(); buzz([60, 80, 60]); this.onEnd && this.onEnd(); return; }
    this.raf = requestAnimationFrame(() => this.tick());
  },
  paint() {
    const ring = $("ring"), num = $("tnum"), lbl = $("tlbl"), wrap = $("timer");
    if (!ring) return;
    ring.setAttribute("stroke-dashoffset", String(339.29 * (1 - this.left / this.total)));
    const s = Math.ceil(this.left);
    num.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    lbl.textContent = this.ended ? "" : (this.running ? T().left : T().paused);
    wrap.classList.toggle("done", this.ended);
  }
};

const ENV = [0, 1, 2, 4];             // a "No" here is something around the person
const S = { screen: "intro", req: "", who: "", q: 0, a: [] };
const DEMOS = { listen: ["Listening Duet", "倾听二重奏", "Dúo de escucha"], repair: ["Repair Kit", "修复工具包", "Kit de Reparación"], thanks: ["Specific Thanks", "具体的感谢", "Gracias Concretas"], swap: ["Perspective Swap", "视角互换", "Cambio de Perspectiva"], discovery: ["Discovery Duet", "探询二重奏", "Dúo de Descubrimiento"], coach: ["Coaching Co-Pilot", "教练副驾", "Copiloto de Coaching"] };
const li = () => ({ en: 0, zh: 1, es: 2 }[lang]);

function analyse() {
  const a = S.a, unsure = a.filter(x => x === 2).length;
  const envIssues = ENV.filter(i => a[i] === 1);
  const canDoIt = a[3] === 0, doneBefore = a[5] === 0, uneven = a[6] === 1;
  const skillGap = a[3] === 1;
  let verdict;
  if (unsure >= 3 || a[3] === 2) verdict = "unsure";
  else if (skillGap && envIssues.length === 0) verdict = "train";
  else if (skillGap) verdict = "both";
  else verdict = "not";
  const moves = [];
  envIssues.forEach(i => moves.push(T().moves[i]));
  if (canDoIt) moves.push(T().moves[3]);
  if (doneBefore && !canDoIt) moves.push(T().moves[5]);
  if (uneven) moves.push(T().moves[6]);
  a.forEach((x, i) => { if (x === 2) moves.push(fmt(T().unsureMove, { q: T().qs[i][0] }).replace(/&quot;/g, '"').replace(/&amp;/g, "&")); });
  return { verdict, moves };
}

function go(screen) { S.screen = screen; render(); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); }

function paintStepsBar() {
  const n = T().qs.length, at = S.screen === "q" ? S.q + 1 : S.screen === "req" ? 0 : S.screen === "result" ? n + 1 : -1;
  $("steps").innerHTML = at < 0 ? "" : Array.from({ length: n + 2 }, (_, i) => `<span class="${i < at ? "done" : i === at ? "now" : ""}"></span>`).join("");
}

function art() {
  return `<svg viewBox="0 0 320 140" style="width:100%;max-width:420px;height:auto;margin:4px 0" aria-hidden="true">
    <rect x="30" y="20" width="110" height="60" rx="14" fill="#fff" stroke="#E5E2DA"/><text x="85" y="56" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="18" fill="#17171A">“We need training”</text>
    <path d="M140 50 C170 50 170 30 196 30 M140 50 C170 50 170 70 196 70 M140 50 C170 50 170 110 196 110" fill="none" stroke="#17171A" stroke-width="1.6"/>
    <rect x="196" y="16" width="100" height="28" rx="14" fill="#17171A"/><text x="246" y="34" text-anchor="middle" font-family="Space Mono, monospace" font-size="10" fill="#fff">expectations?</text>
    <rect x="196" y="56" width="100" height="28" rx="14" fill="#17171A"/><text x="246" y="74" text-anchor="middle" font-family="Space Mono, monospace" font-size="10" fill="#fff">tools · feedback?</text>
    <rect x="196" y="96" width="100" height="28" rx="14" fill="#E2553F"/><text x="246" y="114" text-anchor="middle" font-family="Space Mono, monospace" font-size="10" fill="#fff">skills?</text>
  </svg>`;
}

function render() {
  const t = T(), stage = $("stage");
  paintStepsBar();
  let h = "";
  switch (S.screen) {
  case "intro":
    h = `<section class="screen">
      <span class="kicker">${t.introKicker}</span><h1>${t.introTitle}</h1>
      <p class="lead">${esc(t.introLead)}</p>
      <div class="pills">${t.introMeta.map(m => `<span class="pill">${esc(m)}</span>`).join("")}</div>
      ${art()}
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="toReq" data-focus>${esc(t.start)} →</button></div>
    </section>`; break;
  case "req":
    h = `<section class="screen">
      <h2>${esc(t.reqTitle)}</h2><p class="lead">${esc(t.reqLead)}</p>
      <label class="field"><textarea id="reqIn" maxlength="200" placeholder="${esc(t.reqPh)}">${esc(S.req)}</textarea></label>
      <label class="field"><span>${esc(t.whoLbl)}</span><input id="whoIn" maxlength="60" autocomplete="off" placeholder="${esc(t.whoPh)}" value="${esc(S.who)}"></label>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="toIntro">← ${esc(t.backBtn)}</button><button class="btn pri" data-act="toQ" id="nextBtn" ${S.req.trim() ? "" : "disabled"}>${esc(t.next)} →</button></div>
    </section>`; break;
  case "q": {
    const q = t.qs[S.q];
    h = `<section class="screen">
      <span class="kicker">${esc(fmt(t.qOf, { n: S.q + 1, m: t.qs.length }))}</span>
      <h2>${esc(q[0])}</h2>
      <p class="lead">${esc(q[1])}</p>
      <div class="heard">${t.answers.map((a, i) => `<button data-ans="${i}" aria-pressed="${S.a[S.q] === i}" style="${S.a[S.q] === i ? "border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)" : ""}" ${i === 0 ? "data-focus" : ""}><span class="e">${ANS_ICONS[i]}</span><span><b>${esc(a)}</b></span></button>`).join("")}</div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="prevQ">← ${esc(t.backBtn)}</button></div>
    </section>`; break; }
  case "result": {
    const r = analyse(), v = t.verdicts[r.verdict];
    const fit = r.verdict === "not" ? [] : ["listen", "repair", "thanks", "swap", "discovery", "coach"];
    h = `<section class="screen">
      <span class="kicker" style="color:var(--accent-ink)">${esc(t.resKicker)}</span>
      <div class="prompt" style="min-height:0"><div class="q" style="font-size:clamp(17px,4.6vw,20px)">“${esc(S.req.trim())}”</div>${S.who.trim() ? `<div class="meta"><span>${esc(S.who.trim())}</span></div>` : ""}</div>
      <h2>${esc(v[0])}</h2>
      <p class="serif" style="margin:0;font-size:18px">${esc(v[1])}</p>
      ${r.moves.length ? `<div><span class="kicker">${esc(t.movesLbl)}</span><ul class="chain" style="margin-top:10px">${r.moves.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>` : ""}
      ${r.verdict === "train" || r.verdict === "both" ? `<div class="tip"><i>✦</i><span><b>${esc(t.trainLbl)}</b>${esc(t.trainTip)}</span></div>
        <div><span class="kicker">${esc(t.demosLbl)}</span><div class="pills" style="margin-top:10px">${fit.map(k => `<a class="pill" style="color:var(--ink);text-decoration:none" href="/free_builder/${k}">${esc(DEMOS[k][li()])} ↗</a>`).join("")}</div></div>` : ""}
      <div class="card" style="background:var(--ink);color:#fff;border-color:var(--ink)"><span class="kicker" style="color:rgba(255,255,255,.55)">${esc(t.talkLbl)}</span>
        <ol style="margin:10px 0 0;padding-left:20px;display:grid;gap:8px;font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.35">${t.talkQs.map(q => `<li>${esc(q)}</li>`).join("")}</ol></div>
      <div class="monday"><b>${esc(t.monday)}</b>${esc(t.mondayTxt)}</div>
      <div class="btns"><button class="btn" data-act="copy">⧉ ${esc(t.copy)}</button><button class="btn" data-act="again">↻ ${esc(t.again)}</button></div>
      <div class="btns"><button class="btn pri" data-act="teach" data-focus>${esc(t.passOn)} →</button></div>
    </section>`; break; }
  case "teach": h = teachHTML("diagnose"); break;
  }
  const hadFocus = stage.contains(document.activeElement);
  stage.innerHTML = h;
  const f = stage.querySelector("[data-focus]");
  if (f && hadFocus) f.focus({ preventScroll: true });
}

const ANS_ICONS = [
  '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="var(--good)"/><path d="M7 11.5l2.8 2.6L15 8.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="var(--ink)"/><path d="M8 8l6 6M14 8l-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',
  '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.25" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="11" y="15" text-anchor="middle" font-family="Space Mono, monospace" font-size="11" fill="var(--muted)">?</text></svg>'
];

function teachHTML(demo) {
  const t = T(), chain = store.get("fb_teachback", []).filter(c => c.demo === demo);
  return `<section class="screen">
    <span class="kicker" style="color:var(--accent-ink)">${esc(t.teachKicker)}</span>
    <h2>${esc(t.teachTitle)}</h2>
    <p class="lead">${esc(t.teachLead)}</p>
    <div class="steps3">${t.t3.map((s, i) => `<div><b>0${i + 1}</b><span>${esc(s)}</span><small style="display:block;font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4">${esc(t.t3sub[i])}</small></div>`).join("")}</div>
    <div class="card" style="display:grid;gap:12px">
      <label class="field"><span>${esc(t.learnerName)}</span><input id="lName" maxlength="30" autocomplete="off" placeholder="${esc(t.learnerPh)}"></label>
      <label class="field"><span>${esc(t.learned)}</span><textarea id="lText" maxlength="280" placeholder="${esc(t.learnedPh)}"></textarea></label>
      <button class="btn pri" data-act="saveTeach" style="flex:none">${esc(t.save)}</button>
    </div>
    <div><span class="kicker">${esc(t.chainTitle)}</span>
      <ul class="chain" style="margin-top:10px">${chain.length ? chain.slice().reverse().map(c => `<li>${esc(c.text)}<small>${c.name ? esc(c.name) + " · " : ""}${esc(new Date(c.at).toLocaleDateString(lang === "zh" ? "zh-CN" : lang))}</small></li>`).join("") : `<li style="color:var(--muted)">${esc(t.chainEmpty)}</li>`}</ul></div>
    <a class="link" href="/free_builder/teachback">⊂⊃ ${esc(lang === "zh" ? "教回去链条 ↗" : lang === "es" ? "Cadena de Enseñar de Vuelta ↗" : "Teach-Back Chain ↗")}</a>
    <button class="link" data-act="restart">${esc(t.restart)}</button>
  </section>`;
}

function summaryText() {
  const t = T(), r = analyse(), v = t.verdicts[r.verdict];
  return [t.summaryHead, `${t.reqLine}: ${S.req.trim()}`, S.who.trim() ? `${t.whoLine}: ${S.who.trim()}` : "", "",
    ...t.qs.map((q, i) => `${i + 1}. ${q[0]} — ${t.answers[S.a[i]] || "—"}`), "", `→ ${v[0]}`, ...r.moves.map(m => `• ${m}`), "",
    ...t.talkQs.map(q => `? ${q}`), "", "wei-meng.org/free_builder/diagnose"].filter((x, i, a) => x !== "" || a[i - 1] !== "").join("\n");
}

$("stage").addEventListener("input", e => {
  const nb = $("nextBtn");
  if (e.target.id === "reqIn") { S.req = e.target.value; if (nb) nb.disabled = !S.req.trim(); }
  if (e.target.id === "whoIn") S.who = e.target.value;
});
$("stage").addEventListener("click", e => {
  sound.init();
  const an = e.target.closest("[data-ans]"), a = e.target.closest("[data-act]");
  if (an) {
    S.a[S.q] = +an.dataset.ans; sound.tap();
    if (S.q < T().qs.length - 1) { S.q++; go("q"); } else { sound.warm(); go("result"); }
    return;
  }
  if (!a) return;
  const k = a.dataset.act; sound.tap();
  switch (k) {
    case "toIntro": go("intro"); break;
    case "toReq": go("req"); break;
    case "toQ": if (S.req.trim()) { S.q = 0; go("q"); } break;
    case "prevQ": if (S.q > 0) { S.q--; go("q"); } else go("req"); break;
    case "copy": {
      const text = summaryText(), ok = () => toast(T().copied);
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok).catch(fb); else fb();
      function fb() { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (_) {} ta.remove(); ok(); }
      break; }
    case "again": Object.assign(S, { req: "", who: "", q: 0, a: [] }); go("req"); break;
    case "teach": go("teach"); break;
    case "saveTeach": {
      const text = ($("lText").value || "").trim(), name = ($("lName").value || "").trim();
      if (!text) { $("lText").focus(); return; }
      const chain = store.get("fb_teachback", []); chain.push({ demo: "diagnose", text, name, at: Date.now() }); store.set("fb_teachback", chain.slice(-50));
      sound.warm(); toast(T().saved); render(); break; }
    case "restart": Object.assign(S, { req: "", who: "", q: 0, a: [] }); go("intro"); break;
  }
});

window.__app = { S, go, render, analyse, summaryText };

/* ---------- facilitator guide ---------- */
const drawer = $("drawer");
function openGuide() {
  const t = T();
  $("panel").innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
      <div><span class="kicker">${esc(t.gKicker)}</span><h3 id="g-title">${esc(t.gTitle)}</h3></div>
      <button class="x" data-close aria-label="${esc(t.close)}">✕</button>
    </div>
    <h4>${esc(t.gWhy)}</h4><p>${esc(t.gWhyTxt)}</p>
    <h4>${esc(t.gSteps)}</h4><ol>${t.gStepList.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    <h4>${esc(t.gDebrief)}</h4><ul>${t.gDebriefList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    <h4>${esc(t.gNotes)}</h4><ul>${t.gNotesList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`;
  drawer.classList.add("show");
  setTimeout(() => drawer.querySelector("[data-close]").focus({ preventScroll: true }), 60);
}
function closeGuide() { drawer.classList.remove("show"); $("btn-guide").focus({ preventScroll: true }); }
drawer.addEventListener("click", e => { if (e.target === drawer || e.target.closest("[data-close]")) closeGuide(); });
$("btn-guide").addEventListener("click", openGuide);
window.addEventListener("keydown", e => { if (e.key === "Escape" && drawer.classList.contains("show")) closeGuide(); });

/* ---------- language + sound ---------- */
function paintSound() {
  const b = $("btn-sound"), t = T();
  b.innerHTML = sound.muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
  b.setAttribute("aria-label", sound.muted ? t.soundOff : t.soundOn); b.title = b.getAttribute("aria-label");
}
$("btn-sound").addEventListener("click", () => { sound.muted = !sound.muted; store.set("fb_muted", sound.muted); sound.init(); paintSound(); if (!sound.muted) sound.tap(); });

function applyLang(l) {
  lang = LANGS.includes(l) ? l : "en";
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.title = T().title;
  $("lang-lbl").textContent = LANG_LBL[lang];
  $("btn-guide").setAttribute("aria-label", T().guide); drawer.setAttribute("aria-label", T().guide);
  document.querySelectorAll("[data-t]").forEach(el => { const v = T()[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  paintSound();
  render();               // the clock object survives a re-render
  timer.paint();
  const pb = $("pauseBtn"); if (pb && !timer.running && !timer.ended) pb.textContent = T().resume;
  if (drawer.classList.contains("show")) openGuide();
  try { localStorage.setItem("wm_preferred_lang", lang); localStorage.setItem("wm_cases_lang", lang); } catch (e) {}
}
$("btn-lang").addEventListener("click", () => applyLang(LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]));

/* ---------- boot ---------- */
let saved = null;
try { saved = localStorage.getItem("wm_preferred_lang") || localStorage.getItem("wm_cases_lang"); } catch (e) {}
const nav = (navigator.language || "").toLowerCase();
applyLang(LANGS.includes(saved) ? saved : nav.startsWith("zh") ? "zh" : nav.startsWith("es") ? "es" : "en");
document.addEventListener("visibilitychange", () => { if (!document.hidden && timer.running) keepAwake(true); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/free_builder/sw.js", { scope: "/free_builder/" }).catch(() => {}); // offline cache
})();
</script>
</body>
