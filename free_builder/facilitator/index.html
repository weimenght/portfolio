<!doctype html>
<html lang="en">
<head>

  <title>Train the Facilitator — FREE//BUILDER</title>

  <meta name="theme-color" content="#F7F6F2">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2317171A'/%3E%3Crect x='7' y='7' width='8' height='8' rx='2' fill='%23fff'/%3E%3Crect x='17' y='7' width='8' height='8' rx='2' fill='%23fff' opacity='.55'/%3E%3Crect x='7' y='17' width='8' height='8' rx='2' fill='%23fff' opacity='.55'/%3E%3Crect x='17' y='17' width='8' height='8' rx='2' fill='%23E2553F'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root { --paper:#F7F6F2; --ink:#17171A; --muted:#6B6A70; --line:#E5E2DA; --grid:#ECE9E2; --accent:#E2553F; --accent-ink:#C2412D; --white:#fff; --good:#2F7A55;
      --sans:"Plus Jakarta Sans",system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;

    a { color:inherit; }

    td:first-child { font-family:var(--mono); font-size:11.5px; color:var(--accent-ink); white-space:nowrap; }
    .list { margin:0; padding-left:20px; display:grid; gap:8px; font-size:15px; }
    .dark { background:var(--ink); color:#fff; border-radius:24px; padding:22px 24px; }
    .dark .kicker { color:rgba(255,255,255,.55); }
    .dark .acc { color:#F2A091; }
    .dark ol, .dark ul { margin:12px 0 0; padding-left:20px; display:grid; gap:8px; font-size:15px; }
    .quote { font-family:var(--serif); font-style:italic; font-size:clamp(20px,3vw,26px); line-height:1.3; margin:0; }
    html:lang(zh) .quote { font-style:normal; font-family:var(--sans); }
    .note { font-size:12.5px; color:var(--muted); }
    .cta { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .cta a { font-family:var(--mono); font-size:12px; font-weight:700; text-decoration:none; padding:11px 16px; border-radius:99px; border:1px solid var(--ink); }
    .cta a.pri { background:var(--ink); color:#fff; }

    .field span { font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
    .field input { font:inherit; font-size:15px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--white); color:var(--ink); }
    footer { text-align:center; font-family:var(--mono); font-size:11px; color:var(--muted); padding:20px 16px 40px; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:6px; }
    @media (max-width:520px) { .steps li { grid-template-columns:1fr; gap:4px; } }
    @media (max-width:420px) { .brand b { display:none; } .chip { padding:7px 10px; } }
    @media print { .top, .cta, footer, .noprint { display:none !important; } body { background:#fff; } .card, .steps li, .dark { break-inside:avoid; } .dark { background:#fff; color:var(--ink); border:1px solid var(--ink); } .dark .kicker { color:var(--muted); } }
    
  </style>
</head>

eta": ["2 semanas", "3 módulos", "certificado por evidencias", "EN · 中文 · ES"]}, {"type": "steps", "kicker": "El camino", "title": "Vívelo. Dinamízalo. <span class=\"acc\">Transmítelo<\/span>.", "items": [{"n": "Módulo 1", "when": "Días 1–3", "t": "Vívelo", "d": "Juega tres prácticas como participante, en parejas, con un facilitador certificado. Apunta un momento en que sentiste que algo cambiaba."}, {"n": "Módulo 2", "when": "Días 4–8", "t": "Dinamízalo en pareja", "d": "Codinamiza una sesión con la guía para facilitadores. Tu pareja observa con la lista de observación; cambiáis de papel una vez."}, {"n": "Módulo 3", "when": "Días 9–14", "t": "Transmítelo", "d": "Dinamiza una sesión tú solo. Un participante te explica la práctica con sus palabras: esa transmisión es tu evidencia."}]}, {"type": "cards", "kicker": "Lo que observamos", "title": "La lista de <span class=\"acc\">observación<\/span>", "items": [{"k": "✓", "d": "Cede el protagonismo a las personas en menos de tres minutos."}, {"k": "✓", "d": "Lo mantiene opcional: pasar siempre está bien."}, {"k": "✓", "d": "Habla menos que los participantes."}, {"k": "✓", "d": "Modela la práctica antes de pedir que la prueben."}, {"k": "✓", "d": "Nunca clasifica ni puntúa a nadie."}, {"k": "✓", "d": "Termina con algo para probar el lunes."}]}, {"type": "dark", "kicker": "Certificación por evidencias", "items": ["Dos sesiones: una en pareja y otra a solas.", "Una transmisión de un participante, con sus palabras.", "Una breve reflexión: qué harías distinto la próxima vez.", "Sin examen ni nota. Un compañero y Wei firman juntos el certificado."], "ordered": true}, {"type": "cta", "kicker": "Empieza por la guía", "links": [{"l": "Guía para facilitadores", "href": "/free_builder/guide"}, {"l": "Llévalo a tu organización", "href": "/free_builder/#contact"}]}]}};

let lang = "en";
const B = {
