  </style>

tterns only — never who answered what.<\/li><\/ul><\/div><\/div>"}, {"type": "cards", "kicker": "Design rules for the frontline", "title": "What makes it <span class=\"acc\">work<\/span> on a shift", "items": [{"k": "01", "t": "60 seconds", "d": "If it doesn't fit between two tasks, it won't happen."}, {"k": "02", "t": "Paired, not solo", "d": "The phone sets up a moment between two colleagues."}, {"k": "03", "t": "No login", "d": "A QR code on the break-room wall is the whole onboarding."}, {"k": "04", "t": "Paper fallback", "d": "Every practice also exists as a printed card."}, {"k": "05", "t": "Local language first", "d": "Written per language, read aloud-friendly."}, {"k": "06", "t": "Privacy by default", "d": "Team patterns only; nothing tied to a name."}]}, {"type": "cta", "kicker": "Interested in piloting it?", "links": [{"l": "Talk to FREE//BUILDER", "href": "/free_builder/#contact"}, {"l": "See the practices", "href": "/free_builder/thanks"}]}]}, "zh": {"title": "面向一线的学习 — FREE//BUILDER", "blocks": [{"type": "lead", "kicker": "概念 · 覆盖每个人", "title": "给<span class=\"acc\">没有<\/span>电脑的人的学习。", "text": "门店、仓库、工厂、诊所：大多数人工作时从不坐在桌前，大多数学习也从未抵达他们。这个概念把同样的人际能力练习，放进交接班时的 60 秒——用大家本来就带着的手机。", "flag": "概念——尚未开发和测试", "meta": ["微信小程序或短信", "每天 60 秒", "无需登录，无需安装"]}, {"type": "html", "html": "<span class=\"kicker\">一周，三条消息<\/span><h2>对一位员工来说，它<span class=\"acc\">是什么感觉<\/span><\/h2><div class=\"phone-wrap\"><div class=\"phone\" role=\"img\" aria-label=\"一周，三条消息\"><div class=\"bar\">FREE//BUILDER · 60s<\/div><div class=\"msg\"><small>周一 · 07:55<\/small>本周：为一件具体的事感谢一个人。上一班谁帮过你？<\/div><div class=\"msg\"><small>周三 · 交接班<\/small>交接时两人配对 60 秒：告诉下一班一件做得好的事——以及为什么。<div class=\"btns\"><span>完成 ✓<\/span><span>稍后<\/span><\/div><\/div><div class=\"msg\"><small>周五 · 17:30<\/small>这周你感谢别人了吗？<div class=\"btns\"><span>是<\/span><span>部分<\/span><span>还没有<\/span><\/div><\/div><div class=\"msg me\">感谢了——丽娜帮我看着收银台，我才能去帮顾客。<\/div><\/div><div><h3>为班次设计，而不是为教室<\/h3><ul class=\"list\" style=\"margin- n pareja: cuenta al siguiente turno algo que salió bien y por qué.<div class=\"btns\"><span>Hecho ✓<\/span><span>Luego<\/span><\/div><\/div><div class=\"msg\"><small>Vie · 17:30<\/small>¿Diste las gracias a alguien esta semana?<div class=\"btns\"><span>Sí<\/span><span>En parte<\/span><span>Todavía no<\/span><\/div><\/div><div class=\"msg me\">Sí: Lina cubrió la caja para que yo pudiera ayudar a un cliente.<\/div><\/div><div><h3>Diseñado para el turno, no para el aula<\/h3><ul class=\"list\" style=\"margin-top:10px\"><li>Una pequeña práctica a la semana, de la misma biblioteca que las demos de los talleres.<\/li><li>Casi todo ocurre entre dos personas en el relevo: el móvil solo lo pone en marcha.<\/li><li>Funciona en una tableta compartida o con una tarjeta QR impresa cuando no se permiten móviles.<\/li><li>Cada mensaje va en el idioma de la persona; las respuestas son de un toque.<\/li><li>Los mandos solo ven patrones del equipo, nunca quién respondió qué.<\/li><\/ul><\/div><\/div>"}, {"type": "cards", "kicker": "Reglas de diseño para primera línea", "title": "Lo que hace que <span class=\"acc\">funcione<\/span> en un turno", "items": [{"k": "01", "t": "60 segundos", "d": "Si no cabe entre dos tareas, no ocurrirá."}, {"k": "02", "t": "En pareja, no a solas", "d": "El móvil prepara un momento entre dos colegas."}, {"k": "03", "t": "Sin registro", "d": "Un código QR en la sala de descanso es toda la incorporación."}, {"k": "04", "t": "Respaldo en papel", "d": "Cada práctica existe también como tarjeta impresa."}, {"k": "05", "t": "Primero el idioma local", "d": "Escrito por idioma, fácil de leer en voz alta."}, {"k": "06", "t": "Privacidad por defecto", "d": "Solo patrones de equipo; nada ligado a un nombre."}]}, {"type": "cta", "kicker": "¿Te interesa un piloto?", "links": [{"l": "Hablar con FREE//BUILDER", "href": "/free_builder/#contact"}, {"l": "Ver las prácticas", "href": "/free_builder/thanks"}]}]}};

  cards: b => B.head(b) + `<div class="cards">${b.items.map(c => `<div class="card${c.bad ? " bad" : ""}">${c.k ? `<span class="k">${esc(c.k)}</span>` : ""}${c.t ? `<h3>${esc(c.t)}</h3>` : ""}${c.d ? `<p>${esc(c.d)}</p>` : ""}${c.x ? `<div class="x"><b>${esc(c.xk || "")}</b>${esc(c.x)}</div>` : ""}${c.href ? `<p style="margin-top:10px"><a href="${c.href}" style="font-family:var(--mono);font-size:12px">${esc(c.link || "↗")}</a></p>` : ""}</div>`).join("")}</div>`,
  steps: b => B.head(b) + `<ol class="steps">${b.items.map(s => `<li><span class="n">${esc(s.n)}${s.when ? `<small class="when" data-week="${s.week != null ? s.week : ""}">${esc(s.when)}</small>` : ""}</span><div><h3>${esc(s.t)}</h3>${s.d ? `<p>${esc(s.d)}</p>` : ""}${s.tags ? `<div class="tags">${s.tags.map(t => t.href ? `<a href="${t.href}">${esc(t.l)} ↗</a>` : `<span>${esc(t.l)}</span>`).join("")}</div>` : ""}</div></li>`).join("")}</ol>`,
  table: b => B.head(b) + `<div class="tw" tabindex="0" role="region" aria-label="${esc(b.aria || b.kicker || "")}"><table><thead><tr>${b.cols.map(c => `<th scope="col">${esc(c)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map((c, i) => `<td class="${i === r.length - 1 && b.noteCol ? "note" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`,
  list: b => B.head(b) + `<ul class="list">${b.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`,
  dark: b => `<div class="dark"><span class="kicker">${esc(b.kicker)}</span>${b.title ? `<h2 style="color:#fff">${b.title}</h2>` : ""}${b.text ? `<p style="margin:6px 0 0;color:rgba(255,255,255,.8)">${esc(b.text)}</p>` : ""}${b.items ? `<${b.ordered ? "ol" : "ul"}>${b.items.map(i => `<li>${esc(i)}</li>`).join("")}</${b.ordered ? "ol" : "ul"}>` : ""}</div>`,
  quote: b => `<p class="quote">“${esc(b.text)}”</p>${b.by ? `<p class="note" style="margin-top:8px">${esc(b.by)}</p>` : ""}`,
  note: b => `<p class="note">${esc(b.text)}</p>`,
  html: b => b.html,
  cta: b => B.head(b) + `<div class="cta">${b.links.map((l, i) => `<a class="${i === 0 ? "pri" : ""}" href="${l.href}"${l.download ? " download" : ""}>${esc(l.l)} ${l.download ? "↓" : "↗"}</a>`).join("")}</div>`
};
function render() {
  const s = P[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.title = s.title;
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("main").innerHTML = s.blocks.map((b, i) => i === 0 ? B[b.type](b) : `<section${b.id ? ` id="${b.id}"` : ""}${b.noprint ? ' class="noprint"' : ""}>${B[b.type](b)}</section>`).join("");
  if (window.__after) window.__after(lang, s);
  try { localStorage.setItem("wm_preferred_lang", lang); localStorage.setItem("wm_cases_lang", lang); } catch (e) {}
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; render(); }));
let saved = null; try { saved = localStorage.getItem("wm_preferred_lang") || localStorage.getItem("wm_cases_lang"); } catch (e) {}
const nav = (navigator.language || "").toLowerCase();
lang = ["en", "zh", "es"].includes(saved) ? saved : nav.startsWith("zh") ? "zh" : nav.startsWith("es") ? "es" : "en";

render();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/free_builder/sw.js", { scope: "/free_builder/" }).catch(() => {});
})();
</script>
