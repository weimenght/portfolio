  <style>
    :root { --paper:#F7F6F2; --ink:#17171A; --muted:#6B6A70; --line:#E5E2DA; --accent:#E2553F; --accent-ink:#C2412D; --white:#fff;
      --sans:"Plus Jakarta Sans",system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
      --mono:"Space Mono",ui-monospace,Menlo,monospace; --syne:Syne,"Plus Jakarta Sans","PingFang SC","Noto Sans SC",sans-serif; --serif:"Instrument Serif",Georgia,"Songti SC",serif; }

    html { -webkit-text-size-adjust:100%; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.55; }
    a { color:inherit; }
    .top { position:sticky; top:0; z-index:5; background:rgba(var(--paper-rgb,247,246,242),.9); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }

    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; }
    .mark { width:34px; height:34px; border-radius:10px; background:var(--inkbg,var(--ink)); display:grid; place-items:center; }
    .brand b { font-family:var(--syne); font-size:14px; letter-spacing:.01em; } .brand b i { color:var(--accent-text,#E2553F); font-style:normal; }
    .chips { display:flex; gap:6px; }
    .chip { font:inherit; font-family:var(--mono); font-size:12px; padding:8px 12px; border-radius:99px; border:1px solid var(--line); background:var(--white); color:var(--ink); cursor:pointer; text-decoration:none; }
    .chip[aria-pressed="true"] { background:var(--inkbg,var(--ink)); color:#fff; border-color:var(--inkbd,var(--ink)); }
    .chip.pri { background:var(--inkbg,var(--ink)); color:#fff; border-color:var(--inkbd,var(--ink)); }
    main { max-width:900px; margin:0 auto; padding:28px 16px 60px; }
    .kicker { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    h1 { font-family:var(--syne); font-size:clamp(34px,7vw,56px); line-height:1.05; margin:10px 0 14px; letter-spacing:-.01em; }
    .acc { font-family:var(--serif); font-style:italic; font-weight:400; color:var(--accent-ink); }
    .lead { font-size:17px; color:rgba(var(--ink-rgb,23,23,26),.75); max-width:640px; margin:0; }
    .cover { padding-bottom:28px; border-bottom:1px solid var(--line); margin-bottom:28px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:24px; }
    .box { background:var(--white); border:1px solid var(--line); border-radius:20px; padding:18px 20px; }
    .box ol, .box ul { margin:10px 0 0; padding-left:20px; font-size:14px; display:grid; gap:4px; }
    .toc a { text-decoration:none; } .toc a:hover { color:var(--accent-ink); }
    .demo { background:var(--white); border:1px solid var(--line); border-radius:28px; padding:28px; margin:0 0 24px; }
    .demo-head { display:flex; justify-content:space-between; gap:14px; align-items:flex-start; flex-wrap:wrap; }
    .demo h2 { font-family:var(--syne); font-size:clamp(26px,5vw,34px); margin:6px 0 6px; line-height:1.1; }

    .pill { font-family:var(--mono); font-size:11px; padding:4px 10px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
    .num { font-family:var(--mono); font-size:12px; color:var(--accent-ink); }
    .demo .lead { font-size:15.5px; margin-top:12px; }
    .cols { display:grid; grid-template-columns:1.2fr 1fr; gap:24px; margin-top:22px; }
    h3 { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-ink); font-weight:400; margin:0 0 8px; }
    .why { font-family:var(--serif); font-style:italic; font-size:19px; line-height:1.4; margin:0 0 18px; }
    ol.steps { margin:0; padding:0; list-style:none; counter-reset:s; display:grid; gap:8px; }
    ol.steps li { counter-increment:s; display:flex; gap:10px; font-size:14.5px; }
    ol.steps li::before { content:counter(s); flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--inkbg,var(--ink)); color:#fff; font-family:var(--mono); font-size:11px; display:grid; place-items:center; margin-top:1px; }
    ul.dots { margin:0 0 18px; padding-left:18px; display:grid; gap:6px; font-size:14px; }
    .monday { border:1px dashed rgba(var(--ink-rgb,23,23,26),.25); border-radius:14px; padding:12px 14px; font-size:14px; margin-top:18px; }
    .monday b { display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-ink); font-weight:400; margin-bottom:2px; }

    footer { text-align:center; font-family:var(--mono); font-size:11px; color:var(--muted); padding:20px 16px 40px; }

    @media (max-width:640px) { .grid2, .cols { grid-template-columns:1fr; } .demo { padding:20px; border-radius:22px; } }
    @media print {
      @page { size:A4; margin:14mm; }
      body { background:var(--white,#fff); font-size:12px; }
      .top, footer { display:none; }
      main { padding:0; max-width:none; }
      .cover { page-break-after:always; border:0; }
      .demo { border:0; border-radius:0; padding:0; margin:0; page-break-after:always; break-after:page; }
      .demo:last-child { page-break-after:auto; }
      .box { break-inside:avoid; }
      a.chip { display:none; }
      .url { color:#000; }
    }
  
    /* Chinese: keep CJK upright (no faux italic); Latin italics stay real */
    html:lang(zh) { font-synthesis: weight; }
</style>

, "notes": ["Que sea voluntario. La gratitud forzada sale al revés.", "Agradece el esfuerzo y el cuidado, no solo los resultados.", "No se guarda ni se envía nada: cada persona entrega sus propias palabras."], "monday": "Empieza una reunión esta semana con un agradecimiento concreto."}}, "swap": {"en": {"product": "Perspective Swap", "kicker": "Human skills · Pairs", "lead": "Two colleagues. One awkward moment. Each of you knows only your half of the story. Talk until you find a way forward — then see what the other person was carrying all along.", "meta": ["2 people", "1 or 2 phones", "≈ 12 minutes"], "why": "Information asymmetry is how most real conflict feels: each side is reasonable with what they know. Hiding half the story makes people ask, not assume — and the reveal turns frustration into curiosity.", "stepsH": "Running it (≈ 15 minutes)", "steps": ["Pair people up — ideally across teams, regions or seniority.", "One phone per pair, or two phones with a shared code.", "Each reads their brief privately (1 minute).", "Talk for 5 minutes toward the shared goal.", "Reveal both sides and discuss the three questions.", "Swap roles and run it once more."], "debrief": ["When did your view of the other person change?", "Which question unlocked the conversation?", "Where in our real work does this hidden difference show up?"], "notes": ["Two phones can use different languages — the code keeps the same situation.", "Stress that the differences are learned habits, not personality or nationality.", "Pairs go deeper with the Intercultural Atlas as pre-work."], "monday": "Next time someone's reaction surprises you, ask one question before you explain yourself."}, "zh": {"product": "视角互换", "kicker": "人的能力 · 两人一组", "lead": "两位同事，一个尴尬的瞬间。你们每人只知道一半的故事。一起聊，直到找到前进的方向——然后看看对方一直在承受什么。", "meta": ["2 个人", "1 或 2 部手机", "约 12 分钟"], "why": "信息不对称正是大多数真实冲突的感觉：每一方根据自己知道的都很合理。藏起一半故事，让人们去问而不是去猜——而最后的揭晓，会把不满变成好奇。", "stepsH": "怎么带（约 15 分钟）", "steps": ["两两配对——最好跨团队、跨地区或跨层级。", "每组一部手机，或两部手机共用一个代码。", "各自私下阅读角色卡（1 分钟）。", "围绕共同目标聊 5 分钟。", "揭晓两边的故事，讨论三个问题。", "交换角色，再来一次。"], "debrief": ["你对对方的看法在什么时候改变了？", "哪个问题打开了对话？", "在我们的真实工作中，这个隐藏差异出现在哪里？"], "notes": ["两部手机可以用不同语言——代码保证情境相同。", "强调差异是习得的习惯，不是性格或国籍。", "先用跨文化图鉴做预习，对话会更深入。"], "monday": "下次别人的反应让你意外时，先问一个问题，再解释自己。"}, "es": {"product": "Cambio de Perspectiva", "kicker": "Habilidades humanas · Parejas", "lead": "Dos colegas. Un momento incómodo. Cada uno conoce solo su mitad de la historia. Hablad hasta encontrar una salida y luego descubrid lo que la otra persona llevaba consigo.", "meta": ["2 personas", "1 o 2 móviles", "≈ 12 minutos"], "why": "La asimetría de información es como se vive casi todo conflicto real: cada parte es razonable con lo que sabe. Ocultar media historia hace que la gente pregunte en vez de suponer, y la revelación convierte la frustración en curiosidad.", "stepsH": "Cómo hacerlo (≈ 15 minutos)", "steps": ["Formad parejas, mejor de equipos, regiones o niveles distintos.", "Un móvil por pareja, o dos con un código compartido.", "Cada uno lee su ficha en privado (1 minuto).", "Hablad 5 minutos hacia el objetivo común.", "Revelad los dos lados y comentad las tres preguntas.", "Cambiad de papel y repetid."], "debrief": ["¿Cuándo cambió tu visión de la otra persona?", "¿Qué pregunta abrió la conversación?", "¿Dónde aparece esta diferencia oculta en nuestro trabajo real?"], "notes": ["Los dos móviles pueden ir en idiomas distintos: el código mantiene la misma situación.", "Subraya que las diferencias son hábitos aprendidos, no personalidad ni nacionalidad.", "Las parejas profundizan más si usan antes el Atlas Intercultural."], "monday": "La próxima vez que una reacción te sorprenda, haz una pregunta antes de explicarte."}}, "repair": {"en": {"product": "Repair Kit", "kicker": "Human skills · Pairs", "lead": "Everyone gets it wrong at work sometimes. What builds trust is the repair. Practise one with a colleague — one of you repairs, the other says honestly how it landed — then swap.", "meta": ["2 people", "1 phone", "≈ 12 minutes"], "why": "Most people avoid repairs because they never practised one. A safe, made-up misstep and an honest partner make the words familiar — so the real repair is easier to start.", "stepsH": "Running it (≈ 15 minutes)", "steps": ["Pair people up. One phone per pair.", "A picks a misstep and repairs it in under a minute.", "B says honestly how it landed, using a sentence starter.", "If it didn't land, B picks one hint and A tries once more.", "Swap roles.", "Close with the optional real opening line."], "debrief": ["Which of the three moves was hardest to say?", "What did the receiver need that surprised the repairer?", "What gets in the way of repairs in our team?"], "notes": ["Keep missteps made-up unless people choose otherwise.", "There is no score — “not yet” is useful information, not failure.", "Repairs never require the other person to forgive."], "monday": "Make one small repair: name what you did, how it may have landed, and what you'll do next."}, "zh": {"product": "修复工具包", "kicker": "人的能力 · 两人一组", "lead": "工作中谁都会犯错。真正建立信任的，是修复。和一位同事练习一次——一人修复，另一人诚实地说出感受——然后交换。", "meta": ["2 个人", "1 部手机", "约 12 分钟"], "why": "大多数人回避修复，是因为从没练习过。一个安全的、虚构的失误，加上一位诚实的伙伴，会让这些话变得熟悉——真正的修复也就更容易开口。", "stepsH": "怎么带（约 15 分钟）", "steps": ["两两配对，每组一部手机。", "A 选一个失误，在一分钟内完成修复。", "B 用句子开头，诚实地说出感受。", "如果没有效果，B 选一个提示，A 再试一次。", "交换角色。", "最后可选：写下一句真实的开场白。"], "debrief": ["三个动作里，哪一个最难说出口？", "接受修复的一方需要什么，让修复的一方感到意外？", "在我们团队里，是什么在阻碍修复？"], "notes": ["除非大家愿意，失误都用虚构的。", "没有分数——“还没有”是有用的信息，不是失败。", "修复从不要求对方必须原谅。"], "monday": "做一次小小的修复：说出你做了什么、可能带来的影响、以及接下来会怎么做。"}, "es": {"product": "Kit de Reparación", "kicker": "Habilidades humanas · Parejas", "lead": "Todos nos equivocamos alguna vez en el trabajo. Lo que construye confianza es la reparación. Practica una con un colega: uno repara, el otro dice con honestidad cómo le llegó, y luego cambiáis.", "meta": ["2 personas", "1 móvil", "≈ 12 minutos"], "why": "Casi todos evitamos reparar porque nunca lo hemos practicado. Un error inventado y seguro, y una pareja honesta, hacen que las palabras resulten familiares, y así cuesta menos empezar la reparación real.", "stepsH": "Cómo hacerlo (≈ 15 minutos)", "steps": ["Formad parejas. Un móvil por pareja.", "A elige un error y lo repara en menos de un minuto.", "B dice con honestidad cómo le llegó, con un inicio de frase.", "Si no funcionó, B elige una pista y A lo intenta una vez más.", "Cambiad de papel.", "Cerrad con la frase real opcional."], "debrief": ["¿Cuál de los tres pasos costó más decir?", "¿Qué necesitaba quien recibía que sorprendió a quien reparaba?", "¿Qué frena las reparaciones en nuestro equipo?"], "notes": ["Usad errores inventados, salvo que la gente elija otra cosa.", "No hay puntuación: “todavía no” es información útil, no un fracaso.", "Reparar nunca exige que la otra persona perdone."], "monday": "Haz una pequeña reparación: di lo que hiciste, cómo pudo llegar y qué harás después."}}, "teachback": {"en": {"product": "Teach-Back Chain", "kicker": "Learning by teaching", "lead": "The surest way to learn something is to teach it. Each time you pass a skill on — and your colleague says it back in their own words — it becomes a link in your chain.", "why": "Explaining something forces you to organise it; hearing it back in someone else's words shows what actually landed. It turns a training day into a ripple through the team.", "stepsH": "Running it (≈ 10 minutes)", "steps": ["At the end of a session, pair people with someone who wasn't in it — or across pairs.", "Each person teaches one idea in two minutes.", "The learner says it back in their own words on the teacher's phone.", "The teacher names one thing the learner added.", "Within a week, each learner teaches it on once more."], "debrief": ["What did you understand better by teaching it?", "What did your learner add that surprised you?", "Who else in your team should hear this — and who will tell them?"], "notes": ["The chain counts people helped, never compares people.", "Everything stays on this phone; nothing is uploaded.", "Every FREE//BUILDER demo on this phone adds to the same chain."], "monday": "After your next training, teach one idea to a colleague within 48 hours."}, "zh": {"product": "教回去链条", "kicker": "以教促学", "lead": "学会一件事最可靠的方法，就是把它教给别人。每当你把一项能力传下去——同事再用自己的话说回来——它就成为你链条上的一环。", "why": "讲解会逼你把知识理清楚；听别人用自己的话说回来，才知道什么真正被接住了。它让一天的培训，在团队里一圈圈传开。", "stepsH": "怎么带（约 10 分钟）", "steps": ["课程结束时，让每人找一位没参加的同事——或在组与组之间配对。", "每人用两分钟教一个想法。", "学的人在教的人手机上，用自己的话说回来。", "教的人说出一件对方补充的内容。", "一周内，每位学的人再往下教一次。"], "debrief": ["教的时候，你对哪部分理解得更深了？", "对方补充了什么让你意外的内容？", "团队里还有谁该听到——谁去告诉 TA？"], "notes": ["链条记录帮助过的人，从不比较人。", "一切只在这部手机上，不会上传。", "这部手机上的每个 FREE//BUILDER 练习，都汇入同一条链条。"], "monday": "下次培训后 48 小时内，把一个想法教给一位同事。"}, "es": {"product": "Cadena de Enseñar de Vuelta", "kicker": "Aprender enseñando", "lead": "La forma más segura de aprender algo es enseñarlo. Cada vez que transmites una habilidad —y tu colega te la devuelve con sus palabras— se convierte en un eslabón de tu cadena.", "why": "Explicar algo te obliga a ordenarlo; oírlo de vuelta con las palabras de otra persona muestra qué llegó de verdad. Convierte un día de formación en una onda que recorre el equipo.", "stepsH": "Cómo hacerlo (≈ 10 minutos)", "steps": ["Al final de una sesión, emparejad a cada persona con alguien que no estuvo, o entre parejas.", "Cada uno enseña una idea en dos minutos.", "Quien aprende la devuelve con sus palabras en el móvil de quien enseña.", "Quien enseña nombra algo que la otra persona añadió.", "En una semana, cada aprendiz la transmite una vez más."], "debrief": ["¿Qué entendiste mejor al enseñarlo?", "¿Qué añadió tu aprendiz que te sorprendió?", "¿Quién más del equipo debería oírlo, y quién se lo contará?"], "notes": ["La cadena cuenta personas ayudadas, nunca compara personas.", "Todo se queda en este móvil; no se sube nada.", "Todas las demos de FREE//BUILDER en este móvil suman a la misma cadena."], "monday": "Después de tu próxima formación, enseña una idea a un colega en menos de 48 horas."}}, "discovery": {"en": {"product": "Discovery Duet", "kicker": "Client conversations · Pairs", "lead": "Every client asks for something. Few ask for what they really need. One of you plays a client with a hidden need; the other asks — no pitching — until they find it. Then swap.", "meta": ["2 people", "1 phone", "≈ 15 minutes"], "why": "The stated request is rarely the real need. Hiding the need on a card makes curiosity the only way forward, and the pitch bell turns a bad habit into a shared joke instead of a judgment.", "stepsH": "Running it (≈ 20 minutes)", "steps": ["Pair people up. One phone per pair.", "The client reads their card in private (1 minute).", "The asker has 4 minutes: questions only. The client taps the bell on any pitch.", "The asker summarises the need aloud, then reveals the card.", "Discuss the three questions, then swap."], "debrief": ["Which kinds of questions surfaced the hidden need?", "What made it hard not to pitch?", "Which real client are we probably pitching to too early?"], "notes": ["Works for internal stakeholders too — HR, IT, finance.", "The bell count is never compared between people.", "The goal is understanding the client, not winning them over."], "monday": "In your next client or stakeholder call, ask two more questions before you suggest anything."}, "zh": {"product": "探询二重奏", "kicker": "客户对话 · 两人一组", "lead": "每个客户都会提要求，但很少有人直接说出真正的需求。一人扮演带着隐藏需求的客户，另一人只提问、不推销，直到找到它。然后交换。", "meta": ["2 个人", "1 部手机", "约 15 分钟"], "why": "表面的要求很少是真正的需求。把需求藏在卡片上，好奇心就成了唯一的出路；而“推销铃”把一个坏习惯变成大家一起笑的梗，而不是评判。", "stepsH": "怎么带（约 20 分钟）", "steps": ["两两配对，每组一部手机。", "客户私下阅读卡片（1 分钟）。", "提问者有 4 分钟：只能提问。客户一听到推销就按铃。", "提问者大声总结需求，然后揭晓卡片。", "讨论三个问题，然后交换。"], "debrief": ["哪类问题让隐藏需求浮出水面？", "是什么让你忍不住想推销？", "我们可能正在对哪位真实客户推销得太早？"], "notes": ["同样适用于内部相关方——HR、IT、财务。", "铃声次数从不在人与人之间比较。", "目标是理解客户，而不是拿下客户。"], "monday": "在下一次客户或相关方沟通中，提任何建议之前，多问两个问题。"}, "es": {"product": "Dúo de Descubrimiento", "kicker": "Conversaciones con clientes · Parejas", "lead": "Todo cliente pide algo. Pocos piden lo que de verdad necesitan. Uno hace de cliente con una necesidad oculta; el otro pregunta —sin vender— hasta encontrarla. Luego cambiáis.", "meta": ["2 personas", "1 móvil", "≈ 15 minutos"], "why": "La petición declarada rara vez es la necesidad real. Ocultarla en una tarjeta hace que la curiosidad sea el único camino, y la campana convierte un mal hábito en una broma compartida, no en un juicio.", "stepsH": "Cómo hacerlo (≈ 20 minutos)", "steps": ["Formad parejas. Un móvil por pareja.", "El cliente lee su tarjeta en privado (1 minuto).", "Quien pregunta tiene 4 minutos: solo preguntas. El cliente toca la campana ante cualquier venta.", "Quien pregunta resume la necesidad en voz alta y luego se revela la tarjeta.", "Comentad las tres preguntas y cambiad."], "debrief": ["¿Qué tipo de preguntas sacaron la necesidad oculta?", "¿Qué hizo difícil no vender?", "¿A qué cliente real le estamos vendiendo demasiado pronto?"], "notes": ["Funciona también con clientes internos: RR. HH., IT, finanzas.", "El número de campanas nunca se compara entre personas.", "El objetivo es entender al cliente, no ganárselo."], "monday": "En tu próxima llamada con un cliente o una parte interesada, haz dos preguntas más antes de sugerir nada."}}, "room": {"en": {"product": "Room Mode", "kicker": "Live workshops · Everyone", "lead": "One big screen, everyone's phone. People answer a question anonymously, the answers group into themes, then pairs talk about one theme each — and share back what they noticed.", "meta": ["a room or a call", "every phone", "≈ 20 minutes"], "why": "Anonymous answers get the honest ones out; themes show the room it isn't alone; pairs turn a list on a screen into real conversations. The screen gathers — people do the thinking.", "stepsH": "Running it (≈ 20 minutes)", "steps": ["Open the host screen on a projector. Everyone joins with the code.", "Pick or type one question. Open answers for 3 minute a. Abre respuestas 3 minutos.", "Agrupad las respuestas en 3–5 temas con la sala.", "Formad parejas: un tema por pareja, 5 minutos de conversación.", "Cada pareja envía una frase. Leedlas en voz alta.", "Cierre: ¿qué probaremos el lunes?"], "debrief": ["¿Qué tema te sorprendió?", "¿Qué vio tu pareja que tú no?", "¿Qué pequeña cosa probaremos, y quién hará seguimiento?"], "notes": ["No se recogen nombres. Las respuestas desaparecen al terminar.", "Funciona en videollamada: comparte la pantalla y la gente se une con el móvil.", "El modo vista previa funciona entre pestañas de un dispositivo: ideal para ensayar."], "monday": "Haz a tu equipo una pregunta sincera y deja que hablen en parejas antes de que nadie presente."}}, "listen": {"en": {"product": "Listening Duet", "kicker": "Human Skills Studio · 01", "lead": "Two people, one phone. One talks, the other plays back what they heard. The only score: did they feel heard? Then you swap.", "meta": ["2 people", "1 phone", "≈ 10 minutes"], "why": "Playing back what you heard is the fastest way to make someone feel understood — and to find out you weren't listening as well as you thought. The app only keeps time and asks the questions. The people do the rest.", "stepsH": "Running it (≈ 20 minutes)", "steps": ["Pair people up, ideally with someone they don't work with every day. One phone per pair.", "Set the scene in one sentence: “No advice, no ‘me too’ — just listen and play back.”", "Let pairs run two rounds (about 10 minutes). Walk around; don't coach unless asked.", "Bring everyone back. Ask the debrief questions below.", "Close with the Monday line, and invite each person to teach it to one colleague this week."], "debrief": ["What did your partner do that made you feel heard?", "What was hard about not giving advice?", "Where at work would a 30-second play-back save time?"], "notes": ["Use the Warm-up deck for new teams; Work or Growth once there's trust.", "“Not yet” is a good outcome — it starts the most useful co
