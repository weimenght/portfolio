/* =====================================================================
   FB KIT · helpers (copy into every demo)
   ===================================================================== */
const LANGS = ["en", "zh", "es"], LANG_LBL = { en: "EN", zh: "中文", es: "ES" };
let lang = "en";
const T = () => I18N[lang];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s, v = {}) => String(s).replace(/\{(\w+)\}/g, (m, k) => (k in v ? esc(v[k]) : m));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* Seeded random + pairing codes: the same code on two phones gives the same scenario, no server needed. */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function newCode(n = 6) { let s = ""; for (let i = 0; i < n; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }
function seedFrom(code) { let h = 2166136261; for (const c of String(code).toUpperCase()) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

/* Sound: soft, short, optional */
const sound = {
  ctx: null, muted: store.get("fb_muted", false),
  init() { if (!this.ctx) { const A = window.AudioContext || window.webkitAudioContext; if (A) this.ctx = new A(); } if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  tone(f, d = .3, g = .06, type = "sine", at = 0) {
    if (this.muted || !this.ctx) return;
    try { const t = this.ctx.currentTime + at, o = this.ctx.createOscillator(), a = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); a.gain.setValueAtTime(.0001, t); a.gain.linearRampToValueAtTime(g, t + .02); a.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(a); a.connect(this.ctx.destination); o.start(t); o.stop(t + d + .05); } catch (e) {}
  },
  tap() { this.tone(520, .12, .04, "triangle"); },
  chime() { [659.25, 880, 1318.5].forEach((f, i) => this.tone(f, 1.2, .05, "sine", i * .12)); },
  warm() { [392, 493.88, 587.33].forEach((f, i) => this.tone(f, .9, .05, "sine", i * .1)); }
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* Keep the screen awake while a timer runs (where supported) */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

/* Timer ring */
function ringSVG() {
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="54" fill="none" stroke-width="6"/><circle class="fg" id="ring" cx="60" cy="60" r="54" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="0"/></svg>`;
}
const timer = {
  total: 90, left: 90, running: false, raf: 0, last: 0, onEnd: null, ended: false,
  start(total, onEnd) { this.stop(); this.total = this.left = total; this.onEnd = onEnd; this.ended = false; this.resume(); },
  resume() { if (this.running || this.ended) return; this.running = true; this.last = performance.now(); keepAwake(true); this.tick(); },
  pause() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); this.paint(); },
  stop() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); },
  tick() {
    if (!this.running) return;
    const now = performance.now(); this.left = Math.max(0, this.left - (now - this.last) / 1000); this.last = now;
    this.paint();
    if (this.left <= 0) { this.running = false; this.ended = true; keepAwake(false); sound.chime(); buzz([60, 80, 60]); this.onEnd && this.onEnd(); return; }
    this.raf = requestAnimationFrame(() => this.tick());
  },
  paint() {
    const ring = $("ring"), num = $("tnum"), lbl = $("tlbl"), wrap = $("timer");
    if (!ring) return;
    ring.setAttribute("stroke-dashoffset", String(339.29 * (1 - this.left / this.total)));
    const s = Math.ceil(this.left);
    num.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    lbl.textContent = this.ended ? "" : (this.running ? T().left : T().paused);
    wrap.classList.toggle("done", this.ended);
  }
};

/* Toast */
let toastT;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2600); }

const answered = i => S.ans[i].filter(x => x.trim()).length;

function go(screen) { if (screen !== "talk") timer.stop(); S.screen = screen; render(); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); if (screen === "talk") startTalk(); }
function paintStepsBar() {
  const key = { setup: 0, pass0: 1, write0: 1, pass1: 1, write1: 1, read: 2, talk: 3, agree: 4 }[S.screen];
  $("steps").innerHTML = key == null ? "" : FLOW.map((_, i) => `<span class="${i < key ? "done" : i === key ? "now" : ""}"></span>`).join("");
}

function art() {
  return `<svg viewBox="0 0 320 150" style="width:100%;max-width:420px;height:auto;margin:4px 0" aria-hidden="true">
    <g transform="rotate(-6 94 76)"><rect x="34" y="18" width="116" height="118" rx="10" fill="#17171A"/><rect x="34" y="18" width="14" height="118" rx="6" fill="#E2553F"/>
      <text x="62" y="46" font-family="Space Mono, monospace" font-size="10" font-weight="700" fill="#F7F6F2">MANUAL · A</text>
      <rect x="62" y="60" width="72" height="5" rx="2.5" fill="rgba(247,246,242,.5)"/><rect x="62" y="72" width="56" height="5" rx="2.5" fill="rgba(247,246,242,.3)"/><rect x="62" y="84" width="66" height="5" rx="2.5" fill="rgba(247,246,242,.3)"/><rect x="62" y="96" width="44" height="5" rx="2.5" fill="rgba(247,246,242,.3)"/></g>
    <g transform="rotate(6 226 78)"><rect x="168" y="20" width="116" height="118" rx="10" fill="#fff" stroke="#E5E2DA"/><rect x="168" y="20" width="14" height="118" rx="6" fill="#17171A"/>
      <text x="196" y="48" font-family="Space Mono, monospace" font-size="10" font-weight="700" fill="#E2553F">MANUAL · B</text>
      <rect x="196" y="62" width="72" height="5" rx="2.5" fill="#E5E2DA"/><rect x="196" y="74" width="56" height="5" rx="2.5" fill="#E5E2DA"/><rect x="196" y="86" width="66" height="5" rx="2.5" fill="#E5E2DA"/><rect x="196" y="98" width="44" height="5" rx="2.5" fill="#E5E2DA"/></g>
    <path d="M150 142c6 6 14 6 20 0" fill="none" stroke="#E2553F" stroke-width="2.5" stroke-linecap="round"/>
  </svg>`;
}

function manualHTML(i, dark) {
  const t = T();
  const rows = t.prompts.map((p, k) => S.ans[i][k].trim() ? `<div><span style="display:block;font-family:var(--mono);font-size:11px;letter-spacing:.04em;${dark ? "color:rgba(255,255,255,.6)" : "color:var(--muted)"}">${esc(p[0])}</span><span style="font-size:15.5px;line-height:1.45">${esc(S.ans[i][k].trim())}</span></div>` : "").join("");
  return `<div class="card" style="display:grid;gap:12px;${dark ? "background:var(--inkbg,var(--ink));color:#fff;border-color:var(--inkbd,var(--ink))" : ""}">
    <span class="kicker" style="${dark ? "color:rgba(255,255,255,.55)" : "color:var(--accent-ink)"}">${esc(nm(i))}</span>${rows}</div>`;
}

function render() {
  const t = T(), stage = $("stage");
  paintStepsBar();
  let h = "";
  switch (S.screen) {
  case "intro":
    h = `<section class="screen">
      <span class="kicker">${t.introKicker}</span><h1>${t.introTitle}</h1>
      <p class="lead">${esc(t.introLead)}</p>
      <div class="pills">${t.introMeta.map(m => `<span class="pill">${esc(m)}</span>`).join("")}</div>
      ${art()}
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="toSetup" data-focus>${esc(t.start)} →</button></div>
    </section>`; break;

  case "setup":
    h = `<section class="screen">
      <h2>${esc(t.setupTitle)}</h2>
      <label class="field"><span>${esc(t.nameA)}</span><input id="nA" maxlength="30" autocomplete="off" placeholder="${esc(t.phA)}" value="${esc(S.names[0])}"></label>
      <label class="field"><span>${esc(t.nameB)}</span><input id="nB" maxlength="30" autocomplete="off" placeholder="${esc(t.phB)}" value="${esc(S.names[1])}"></label>
      <div class="tip"><i>✦</i><span>${esc(t.goFirst)}</span></div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="toIntro">← ${esc(t.backBtn)}</button><button class="btn pri" data-act="toPass0" data-focus>${esc(t.next)} →</button></div>
    </section>`; break;

  case "pass0": case "pass1": {
    const i = S.screen === "pass0" ? 0 : 1, r = nm(i);
    h = `<section class="screen">${curtainHTML(fmt(t.passTo, { r }), esc(t.passLead), fmt(t.ready, { r }), i ? "toWrite1" : "toWrite0")}</section>`; break; }

  case "write0": case "write1": {
    const i = S.screen === "write0" ? 0 : 1;
    h = `<section class="screen">
      <span class="kicker" style="color:var(--accent-ink)">${fmt(t.writeKicker, { r: nm(i) })}</span>
      <h2>${esc(t.writeTitle)}</h2>
      <p style="margin:0;font-size:14px;color:var(--muted)">${esc(t.writeNote)}</p>
      ${t.prompts.map((p, k) => `<label class="field"><span>${esc(p[0])}</span><textarea data-ans="${k}" maxlength="220" style="min-height:70px" placeholder="${esc(p[1])}">${esc(S.ans[i][k])}</textarea></label>`).join("")}
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="${i ? "toRead" : "toPass1"}">${esc(t.done)} →</button></div>
    </section>`; break; }

  case "read":
    h = `<section class="screen">
      <span class="kicker">${esc(t.readKicker)}</span>
      <h2>${esc(t.readTitle)}</h2>
      <p class="lead">${esc(t.readLead)}</p>
      <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${manualHTML(0, true)}${manualHTML(1, false)}</div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="toTalk" data-focus>${esc(t.talk)} →</button></div>
    </section>`; break;

  case "talk":
    h = `<section class="screen">
      <h2>${esc(t.talkTitle)}</h2>
      <p class="lead">${esc(t.talkLead)}</p>
      <div class="timer" id="timer" style="width:min(56vw,210px)">${ringSVG()}<div class="num"><div><b id="tnum">5:00</b><small id="tlbl"></small></div></div></div>
      <div class="tip" id="ltip"><i>✦</i><span>${esc(t.talkTips[S.tipIdx % t.talkTips.length])}</span></div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="pause" id="pauseBtn">${esc(timer.running || timer.ended ? t.pause : t.resume)}</button><button class="btn pri" data-act="toAgree" data-focus>${esc(t.talkDone)} →</button></div>
    </section>`; break;

  case "agree":
    h = `<section class="screen">
      <h2>${esc(t.agreeTitle)}</h2>
      <p class="lead">${esc(t.agreeLead)}</p>
      ${[0, 1].map(i => `<label class="field"><span>${esc(nm(i))}</span><input data-prom="${i}" maxlength="140" autocomplete="off" placeholder="${esc(t.agreePh)}" value="${esc(S.promise[i])}"></label>`).join("")}
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="toSummary">${esc(t.toSummary)} →</button></div>
    </section>`; break;

  case "summary":
    h = `<section class="screen">
      <span class="kicker" style="color:var(--good)">✓ ${esc(t.sumKicker)}</span>
      <h2>${esc(t.sumTitle)}</h2>
      ${[0, 1].map(i => `<div class="card" style="display:grid;gap:6px;padding:14px 16px"><span class="kicker" style="color:var(--accent-ink)">${esc(nm(i))} · ${esc(t.promiseLbl)}</span><span style="font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.3">“${esc(S.promise[i].trim())}”</span></div>`).join("")}
      <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${manualHTML(0, false)}${manualHTML(1, false)}</div>
      <div class="tip"><i>◷</i><span>${esc(t.revisit)}</span></div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="copy">⧉ ${esc(t.copy)}</button><button class="btn pri" data-act="toEnd" data-focus>${esc(t.finish)} →</button></div>
    </section>`; break;

  case "end":
    h = `<section class="screen">
      <span class="kicker" style="color:var(--good)">✓ ${esc(t.endKicker)}</span>
      <h2>${esc(t.endTitle)}</h2>
      <p class="serif">${esc(t.endLead)}</p>
      <div class="monday"><b>${esc(t.monday)}</b>${esc(t.mondayTxt)}</div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="again">↻ ${esc(t.again)}</button><button class="btn pri" data-act="teach" data-focus>${esc(t.passOn)} →</button></div>
    </section>`; break;

  case "teach": h = teachHTML("manual"); break;
  }
  const hadFocus = stage.contains(document.activeElement);
  stage.innerHTML = h;
  const f = stage.querySelector("[data-focus]");
  if (f && hadFocus) f.focus({ preventScroll: true });
}

function teachHTML(demo) {
  const t = T(), chain = store.get("fb_teachback", []).filter(c => c.demo === demo);
  return `<section class="screen">
    <span class="kicker" style="color:var(--accent-ink)">${esc(t.teachKicker)}</span>
    <h2>${esc(t.teachTitle)}</h2>
    <p class="lead">${esc(t.teachLead)}</p>
    <div class="steps3">${t.t3.map((s, i) => `<div><b>0${i + 1}</b><span>${esc(s)}</span><small style="display:block;font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4">${esc(t.t3sub[i])}</small></div>`).join("")}</div>
    <div class="card" style="display:grid;gap:12px">
      <label class="field"><span>${esc(t.learnerName)}</span><input id="lName" maxlength="30" autocomplete="off" placeholder="${esc(t.learnerPh)}"></label>
      <label class="field"><span>${esc(t.learned)}</span><textarea id="lText" maxlength="280" placeholder="${esc(t.learnedPh)}"></textarea></label>
      <button class="btn pri" data-act="saveTeach" style="flex:none">${esc(t.save)}</button>
    </div>
    <div><span class="kicker">${esc(t.chainTitle)}</span>
      <ul class="chain" style="margin-top:10px">${chain.length ? chain.slice().reverse().map(c => `<li>${esc(c.text)}<small>${c.name ? esc(c.name) + " · " : ""}${esc(new Date(c.at).toLocaleDateString(lang === "zh" ? "zh-CN" : lang))}</small></li>`).join("") : `<li style="color:var(--muted)">${esc(t.chainEmpty)}</li>`}</ul></div>
    <a class="link" href="/free_builder/teachback">⊂⊃ ${esc(lang === "zh" ? "教回去链条 ↗" : lang === "es" ? "Cadena de Enseñar de Vuelta ↗" : "Teach-Back Chain ↗")}</a>
    <button class="link" data-act="restart">${esc(t.restart)}</button>
  </section>`;
}

function startTalk() {
  timer.start(300, () => toast(T().timeUp));
  const pb = $("pauseBtn"); if (pb) pb.textContent = T().pause;
  const tips = setInterval(() => {
    if (S.screen !== "talk") { clearInterval(tips); return; }
    S.tipIdx++; const el = $("ltip"); if (el) el.querySelector("span").textContent = T().talkTips[S.tipIdx % T().talkTips.length];
  }, 25000);
}

function summaryText() {
  const t = T();
  const man = i => [`— ${nm(i)} —`, ...t.prompts.map((p, k) => S.ans[i][k].trim() ? `${p[0]} ${S.ans[i][k].trim()}` : "").filter(Boolean)].join("\n");
  return [t.sumKicker, "", `${nm(0)} · ${t.promiseLbl}: ${S.promise[0].trim()}`, `${nm(1)} · ${t.promiseLbl}: ${S.promise[1].trim()}`, "", man(0), "", man(1), "", t.revisit, "", "wei-meng.org/free_builder/manual"].join("\n");
}

$("stage").addEventListener("input", e => {
  const el = e.target;
  if (el.id === "nA") S.names[0] = el.value; else if (el.id === "nB") S.names[1] = el.value;
  else if (el.dataset.ans != null) S.ans[S.screen === "write1" ? 1 : 0][+el.dataset.ans] = el.value;
  else if (el.dataset.prom != null) S.promise[+el.dataset.prom] = el.value;
});
$("stage").addEventListener("click", e => {
  sound.init();
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const k = a.dataset.act; sound.tap();
  switch (k) {
    case "toIntro": go("intro"); break;
    case "toSetup": go("setup"); break;
    case "toPass0": go("pass0"); break;
    case "toWrite0": go("write0"); break;
    case "toPass1": if (answered(0) < 3) { toast(T().needThree); return; } go("pass1"); break;
    case "toWrite1": go("write1"); break;
    case "toRead": if (answered(1) < 3) { toast(T().needThree); return; } sound.warm(); go("read"); break;
    case "toTalk": go("talk"); break;
    case "pause":
      if (timer.ended) return;
      if (timer.running) { timer.pause(); a.textContent = T().resume; } else { timer.resume(); a.textContent = T().pause; }
      break;
    case "toAgree": timer.stop(); go("agree"); break;
    case "toSummary": if (!S.promise[0].trim() || !S.promise[1].trim()) { toast(T().needPromise); return; } sound.chime(); go("summary"); break;
    case "copy": {
      const text = summaryText(), ok = () => toast(T().copied);
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok).catch(fb); else fb();
      function fb() { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (_) {} ta.remove(); ok(); }
      break; }
    case "toEnd": sound.warm(); go("end"); break;
    case "again": S.ans = [["", "", "", "", ""], ["", "", "", "", ""]]; S.promise = ["", ""]; go("setup"); break;
    case "teach": go("teach"); break;
    case "saveTeach": {
      const text = ($("lText").value || "").trim(), name = ($("lName").value || "").trim();
      if (!text) { $("lText").focus(); return; }
      const chain = store.get("fb_teachback", []); chain.push({ demo: "manual", text, name, at: Date.now() }); store.set("fb_teachback", chain.slice(-50));
      sound.warm(); toast(T().saved); render(); break; }
    case "restart": S.ans = [["", "", "", "", ""], ["", "", "", "", ""]]; S.promise = ["", ""]; go("intro"); break;
  }
});

window.__app = { S, go, render, summaryText };

/* ---------- facilitator guide ---------- */
const drawer = $("drawer");
function openGuide() {
  const t = T();
  $("panel").innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
      <div><span class="kicker">${esc(t.gKicker)}</span><h3 id="g-title">${esc(t.gTitle)}</h3></div>
      <button class="x" data-close aria-label="${esc(t.close)}">✕</button>
    </div>
    <h4>${esc(t.gWhy)}</h4><p>${esc(t.gWhyTxt)}</p>
    <h4>${esc(t.gSteps)}</h4><ol>${t.gStepList.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    <h4>${esc(t.gDebrief)}</h4><ul>${t.gDebriefList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    <h4>${esc(t.gNotes)}</h4><ul>${t.gNotesList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`;
  drawer.classList.add("show");
  setTimeout(() => drawer.querySelector("[data-close]").focus({ preventScroll: true }), 60);
}
function closeGuide() { drawer.classList.remove("show"); $("btn-guide").focus({ preventScroll: true }); }
drawer.addEventListener("click", e => { if (e.target === drawer || e.target.closest("[data-close]")) closeGuide(); });
$("btn-guide").addEventListener("click", openGuide);
window.addEventListener("keydown", e => { if (e.key === "Escape" && drawer.classList.contains("show")) closeGuide(); });

/* ---------- language + sound ---------- */
function paintSound() {
  const b = $("btn-sound"), t = T();
  b.innerHTML = sound.muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
  b.setAttribute("aria-label", sound.muted ? t.soundOff : t.soundOn); b.title = b.getAttribute("aria-label");
}
$("btn-sound").addEventListener("click", () => { sound.muted = !sound.muted; store.set("fb_muted", sound.muted); sound.init(); paintSound(); if (!sound.muted) sound.tap(); });

function applyLang(l) {
  lang = LANGS.includes(l) ? l : "en";
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.title = T().title;
  $("lang-lbl").textContent = LANG_LBL[lang];
  $("btn-guide").setAttribute("aria-label", T().guide); drawer.setAttribute("aria-label", T().guide);
  document.querySelectorAll("[data-t]").forEach(el => { const v = T()[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  paintSound();
  render();               // the clock object survives a re-render
  timer.paint();
  const pb = $("pauseBtn"); if (pb && !timer.running && !timer.ended) pb.textContent = T().resume;
  if (drawer.classList.contains("show")) openGuide();
  try { localStorage.setItem("wm_preferred_lang", lang); localStorage.setItem("wm_cases_lang", lang); } catch (e) {}
}
$("btn-lang").addEventListener("click", () => applyLang(LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]));

/* ---------- boot ---------- */
let saved = null;
try { saved = localStorage.getItem("wm_preferred_lang") || localStorage.getItem("wm_cases_lang"); } catch (e) {}
const nav = (navigator.language || "").toLowerCase();
applyLang(LANGS.includes(saved) ? saved : nav.startsWith("zh") ? "zh" : nav.startsWith("es") ? "es" : "en");
document.addEventListener("visibilitychange", () => { if (!document.hidden && timer.running) keepAwake(true); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/free_builder/sw.js", { scope: "/free_builder/" }).catch(() => {}); // offline cache
})();
</script>
</body>
</html>
