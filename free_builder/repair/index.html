function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const sound = {
  ctx: null, muted: store.get("fb_muted", false),
  init() { if (!this.ctx) { const A = window.AudioContext || window.webkitAudioContext; if (A) this.ctx = new A(); } if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  tone(f, d = .3, g = .06, type = "sine", at = 0) {
    if (this.muted || !this.ctx) return;
    try { const t = this.ctx.currentTime + at, o = this.ctx.createOscillator(), a = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); a.gain.setValueAtTime(.0001, t); a.gain.linearRampToValueAtTime(g, t + .02); a.gain.exponentialRampToValueAtTime(.0001, t + d);

  },
  tap() { this.tone(520, .12, .04, "triangle"); },

const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* Keep the screen awake while a timer runs (where supported) */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

/* Timer ring */
function ringSVG() {
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="54" fill="none" stroke-width="6"/><circle class="fg" id="ring" cx="60" cy="60" r="54" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="0"/></svg>`;
}
const timer = {
  total: 90, left: 90, running: false, raf: 0, last: 0, onEnd: null, ended: false,
  start(total, onEnd) { this.stop(); this.total = this.left = total; this.onEnd = onEnd; this.ended = false; this.resume(); },
  resume() { if (this.running || this.ended) return; this.running = true; this.last = performance.now(); keepAwake(true); this.tick(); },
  pause() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); this.paint(); },
  stop() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); },
  tick() {
    if (!this.running) return;
    const now = performance.now(); this.left = Math.max(0, this.left - (now - this.last) / 1000); this.last = now;
    this.paint();
    if (this.left <= 0) { this.running = false; this.ended = true; keepAwake(false); sound.chime(); buzz([60, 80, 60]); this.onEnd && this.onEnd(); return; }
    this.raf = requestAnimationFrame(() => this.tick());
  },
  paint() {
    const ring = $("ring"), num = $("tnum"), lbl = $("tlbl"), wrap = $("timer");
    if (!ring) return;
    ring.setAttribute("stroke-dashoffset", String(339.29 * (1 - this.left / this.total)));
    const s = Math.ceil(this.left);
    num.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    lbl.textContent = this.ended ? "" : (this.running ? T().left : T().paused);
    wrap.classList.toggle("done", this.ended);
  }
};

function curtainHTML(title, lead, btnLabel, act) {
  return `<div class="curtain">
    <svg class="hand" viewBox="0 0 84 84" aria-hidden="true"><rect x="27" y="10" width="30" height="52" rx="7" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="42" cy="54" r="2.5" fill="#E2553F"/><path d="M14 54c6 0 10 4 13 9M70 54c-6 0-10 4-13 9" stroke="rgba(255,255,255,.5)" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M34 72h16" stroke="#E2553F" stroke-width="2.5" stroke-linecap="round"/></svg>
    <h2>${title}</h2><p>${lead}</p>
    <button class="btn pri" data-act="${act}" style="width:100%;margin-top:6px">${btnLabel} →</button></div>`;
}



/* =====================================================================
   REPAIR KIT
   ===================================================================== */
const S = { screen: "intro", names: ["", ""], round: 0, pick: [null, null], own: ["", ""], tries: 0, hint: null, landed: [null, null], real: "" };
const FLOW = ["pick", "recipe", "repair", "respond", "check"];
const nameOf = i => S.names[i].trim() || I18N[lang][i ? "nameB" : "nameA"];
const rep = () => nameOf(S.round), rec = () => nameOf(1 - S.round);
const misstep = () => S.pick[S.round] === -1 ? [S.own[S.round].trim(), ""] : MISSTEPS[lang][S.pick[S.round]];

function go(screen) {
  if (screen !== "repair") timer.stop();
  S.screen = screen; render(); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  if (screen === "repair") { timer.start(60, () => toast(T().timeUp)); const pb = $("pauseBtn"); if (pb) pb.textContent = T().pause; }
}

function paintStepsBar() {
  const at = FLOW.indexOf(S.screen === "hint" ? "check" : S.screen);
  $("steps").innerHTML = at < 0 ? "" : FLOW.map((_, i) => `<span class="${i < at ? "done" : i === at ? "now" : ""}"></span>`).join("");
}

function rolesHTML() {
  return `<div class="roles">
    <div class="role speak"><div class="k">${esc(T().repairing)}</div><div class="n">${esc(rep())}</div></div>
    <div class="role"><div class="k">${esc(T().receiving)}</div><div class="n">${esc(rec())}</div></div>
  </div>`;
}

function kitArt() {
  return `<svg viewBox="0 0 320 150" style="width:100%;max-width:420px;height:auto;margin:4px 0" aria-hidden="true">
    <g transform="rotate(-4 160 80)">
      <path d="M70 46 h70 l12 34 -12 34 h-70 z" fill="#17171A"/>
      <path d="M250 46 h-70 l12 34 -12 34 h70 z" fill="#fff" stroke="#E5E2DA"/>
      <path d="M140 46 l12 34 -12 34" fill="none" stroke="#E2553F" stroke-width="3" stroke-dasharray="5 5"/>
      <path d="M180 46 l12 34 -12 34" fill="none" stroke="#E2553F" stroke-width="3" stroke-dasharray="5 5"/>
      <g stroke="#E2553F" stroke-width="3" stroke-linecap="round"><path d="M146 66h34"/><path d="M150 80h34"/><path d="M146 94h34"/></g>
    </g>
  </svg>`;
}

function render() {
  const t = T(), stage = $("stage");
  paintStepsBar();
  let h = "";
  switch (S.screen) {
  case "intro":
    h = `<section class="screen">
      <span class="kicker">${t.introKicker}</span><h1>${t.introTitle}</h1>
      <p class="lead">${esc(t.introLead)}</p>
      <div class="pills">${t.introMeta.map(m => `<span class="pill">${esc(m)}</span>`).join("")}</div>
      ${kitArt()}
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="toSetup" data-focus>${esc(t.start)} →</button></div>
    </section>`; break;

  case "setup":
    h = `<section class="screen">
      <h2>${esc(t.setupTitle)}</h2>
      <div class="row2">
        <label class="field"><span>${esc(t.nameA)}</span><input id="nA" maxlength="20" autocomplete="off" placeholder="${esc(t.phA)}" value="${esc(S.names[0])}"></label>
        <label class="field"><span>${esc(t.nameB)}</span><input id="nB" maxlength="20" autocomplete="off" placeholder="${esc(t.phB)}" value="${esc(S.names[1])}"></label>
      </div>
      <p style="margin:0;font-size:13.5px;color:var(--muted)">${esc(t.setupNote)}</p>
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="toPick" data-focus>${esc(t.next)} →</button></div>
    </section>`; break;

  case "pick": {
    const p = S.pick[S.round], ownOk = S.own[S.round].trim().length > 2;
    h = `<section class="screen">
      ${rolesHTML()}
      <h2>${fmt(t.pickTitle, { a: rep() })}</h2>
      <p class="lead">${fmt(t.pickLead, { b: rec() })}</p>
      <div class="heard">${MISSTEPS[lang].map((m, i) => `<button data-pick="${i}" aria-pressed="${p === i}" style="${p === i ? "border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)" : ""}"><span class="e" style="font-family:var(--mono);font-size:12px">0${i + 1}</span><span><b style="font-size:15px;font-weight:600">${esc(m[0])}</b></span></button>`).join("")}</div>
      <label class="field"><span>${esc(t.ownLbl)}</span><input id="own" maxlength="120" autocomplete="off" placeholder="${esc(t.ownPh)}" value="${esc(S.own[S.round])}"></label>
      <div class="tip"><i>✦</i><span><b>${esc(t.warmTitle)}</b>${esc(t.warmTxt)} <a href="/free_builder/coach/" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;text-underline-offset:3px">${esc(t.warmLink)}</a></span></div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="toRecipe" id="nextBtn" ${p != null && (p !== -1 || ownOk) ? "" : "disabled"}>${esc(t.next)} →</button></div>
    </section>`; break; }

  case "recipe": {
    const m = misstep();
    h = `<section class="screen">
      ${rolesHTML()}
      <div class="prompt" style="min-height:0"><div class="q" style="font-size:clamp(19px,5vw,23px)">${esc(m[0])}</div>
        ${m[1] ? `<div class="meta"><span>${fmt(t.imagine, { b: rec() })}: ${esc(m[1])}</span></div>` : ""}</div>
      <div><span class="kicker">${esc(t.recipeKicker)}</span><h3 style="margin:6px 0 0;font-family:var(--syne);font-size:20px">${esc(t.recipeTitle)}</h3></div>
      <div class="steps3">${t.recipe.map((r, i) => `<div><b>0${i + 1}</b><span>${esc(r[0])}</span><small style="display:block;font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4">${esc(r[1])}</small></div>`).join("")}</div>
      <p style="margin:0;font-size:13.5px"><span class="kicker" style="margin-right:6px">${esc(t.avoidLbl)}</span>${t.avoid.map(a => `<s style="color:var(--muted);margin-right:10px">${esc(a)}</s>`).join("")}</p>
      <div class="tip"><i>♡</i><span>${fmt(t.forB, { b: rec() })}</span></div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="toPick">← ${esc(t.backBtn)}</button><button class="btn pri" data-act="toRepair" data-focus>${fmt(t.startRepair, { a: rep() })} →</button></div>
    </section>`; break; }

  case "repair":
    h = `<section class="screen">
      ${rolesHTML()}
      <h2>${fmt(t.repairTitle, { a: rep() })}</h2>
      <p class="serif" style="font-size:17px;margin:0">${fmt(t.repairTo, { b: rec() })} · ${esc(misstep()[0])}</p>
      ${S.hint != null ? `<div class="tip" style="border-color:var(--accent)"><i>→</i><span><b>${fmt(t.hintLbl, { b: rec() })}</b>${esc(t.hints[S.hint])}</span></div>` : ""}
      <div class="timer" id="timer" style="width:min(48vw,180px)">${ringSVG()}<div class="num"><div><b id="tnum">1:00</b><small id="tlbl"></small></div></div></div>
      <div class="stems">${t.recipe.map((r, i) => `<div><b style="font-family:var(--mono);color:var(--accent);font-weight:400;margin-right:8px">0${i + 1}</b>${esc(r[0])} — <span style="color:var(--muted)">${esc(r[1])}</span></div>`).join("")}</div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="pause" id="pauseBtn">${esc(timer.running || timer.ended ? t.pause : t.resume)}</button><button class="btn pri" data-act="toRespond" data-focus>${esc(t.done)} →</button></div>
    </section>`; break;

  case "respond":
    h = `<section class="screen">
      <div class="roles">
        <div class="role"><div class="k">${esc(t.repairing)}</div><div class="n">${esc(rep())}</div></div>
        <div class="role speak"><div class="k">${esc(T().receiving)}</div><div class="n">${esc(rec())}</div></div>
      </div>
      <h2>${fmt(t.respondTitle, { b: rec() })}</h2>
      <p class="lead">${esc(t.respondLead)}</p>
      <div class="stems">${t.stems.map(s => `<div>${esc(s)}</div>`).join("")}</div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="toCheck" data-focus>${esc(t.checkBtn)} →</button></div>
    </section>`; break;

  case "check":
    h = `<section class="screen">
      <h2>${fmt(t.checkTitle, { b: rec() })}</h2>
      <div class="heard">
        <button data-land="0" data-focus><span class="e">${LAND_ICONS[0]}</span><span><b>${esc(t.yes)}</b><small>${esc(t.yesSub)}</small></span></button>
        <button data-land="1"><span class="e">${LAND_ICONS[1]}</span><span><b>${esc(t.partly)}</b><small>${esc(t.partlySub)}</small></span></button>
        <button data-land="2"><span class="e">${LAND_ICONS[2]}</span><span><b>${esc(t.no)}</b><small>${esc(t.noSub)}</small></span></button>
      </div>
    </section>`; break;

  case "hint":
    h = `<section class="screen">
      <h2>${fmt(t.hintTitle, { a: rep() })}</h2>
      <p class="lead">${fmt(t.hintLead, { a: rep() })}</p>
      <div class="seg" role="group" style="flex-direction:column;align-items:stretch">${t.hints.map((x, i) => `<button type="button" data-hint="${i}" aria-pressed="${S.hint === i}" style="text-align:left;border-radius:16px;padding:14px 16px;font-size:15px">${esc(x)}</button>`).join("")}</div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="retry" ${S.hint == null ? "disabled" : ""} data-focus>${esc(t.retry)} →</button></div>
    </section>`; break;

  case "swap":
    h = `<section class="screen">${curtainHTML(esc(t.swapTitle), fmt(t.swapLead, { s: nameOf(1), l: nameOf(0) }), esc(t.swapGo), "afterSwap")}</section>`; break;

  case "summary": {
    const lab = v => v == null ? "—" : t.landed[v];
    h = `<section class="screen">
      <span class="kicker" style="color:var(--good)">✓ ${esc(t.sumKicker)}</span>
      <h2>${esc(t.sumTitle)}</h2>
      <div class="sum">
        <div><b>${esc(nameOf(0))} → ${esc(nameOf(1))}</b><span>${esc(lab(S.landed[0]))}</span></div>
        <div><b>${esc(nameOf(1))} → ${esc(nameOf(0))}</b><span>${esc(lab(S.landed[1]))}</span></div>
      </div>
      <div class="card" style="display:grid;gap:12px">
        <h3 style="margin:0;font-family:var(--syne);font-size:20px">${esc(t.realTitle)}</h3>
        <p style="margin:0;font-size:14px;color:var(--muted)">${esc(t.realLead)}</p>
        <label class="field"><textarea id="real" maxlength="280" placeholder="${esc(t.realPh)}">${esc(S.real)}</textarea></label>
        <button class="btn" data-act="copyReal" style="flex:none">⧉ ${esc(t.copy)}</button>
      </div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="toEnd" data-focus>${esc(t.toClose)} →</button></div>
    </section>`; break; }

  case "end":
    h = `<section class="screen">
      <span class="kicker" style="color:var(--good)">✓ ${esc(t.endKicker)}</span>
      <h2>${esc(t.endTitle)}</h2>
      <p class="serif">${esc(t.endLead)}</p>
      <div class="monday"><b>${esc(t.monday)}</b>${esc(t.mondayTxt)}</div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="again">↻ ${esc(t.again)}</button><button class="btn pri" data-act="teach" data-focus>${esc(t.passOn)} →</button></div>
    </section>`; break;

  case "teach": h = teachHTML("repair"); break;
  }
  const hadFocus = stage.contains(document.activeElement);
  stage.innerHTML = h;
  const f = stage.querySelector("[data-focus]");
  if (f && hadFocus) f.focus({ preventScroll: true });
}

const LAND_ICONS = [
  '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="var(--good)"/></svg>',
  '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.25" fill="none" stroke="var(--ink)" stroke-width="1.5"/><path d="M11 2.75a8.25 8.25 0 0 1 0 16.5z" fill="var(--ink)"/></svg>',
  '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.25" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/></svg>'
];

function teachHTML(demo) {
  const t = T(), chain = store.get("fb_teachback", []).filter(c => c.demo === demo);
  return `<section class="screen">
    <span class="kicker" style="color:var(--accent)">${esc(t.teachKicker)}</span>
    <h2>${esc(t.teachTitle)}</h2>
    <p class="lead">${esc(t.teachLead)}</p>
    <div class="steps3">${t.t3.map((s, i) => `<div><b>0${i + 1}</b><span>${esc(s)}</span><small style="display:block;font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4">${esc(t.t3sub[i])}</small></div>`).join("")}</div>
    <div class="card" style="display:grid;gap:12px">
      <label class="field"><span>${esc(t.learnerName)}</span><input id="lName" maxlength="30" autocomplete="off" placeholder="${esc(t.learnerPh)}"></label>
      <label class="field"><span>${esc(t.learned)}</span><textarea id="lText" maxlength="280" placeholder="${esc(t.learnedPh)}"></textarea></label>
      <button class="btn pri" data-act="saveTeach" style="flex:none">${esc(t.save)}</button>
    </div>
    <div><span class="kicker">${esc(t.chainTitle)}</span>
      <ul class="chain" style="margin-top:10px">${chain.length ? chain.slice().reverse().map(c => `<li>${esc(c.text)}<small>${c.name ? esc(c.name) + " · " : ""}${esc(new Date(c.at).toLocaleDateString(lang === "zh" ? "zh-CN" : lang))}</small></li>`).join("") : `<li style="color:var(--muted)">${esc(t.chainEmpty)}</li>`}</ul></div>
    <a class="link" href="/free_builder/teachback">⊂⊃ ${esc(lang === "zh" ? "教回去链条 ↗" : lang === "es" ? "Cadena de Enseñar de Vuelta ↗" : "Teach-Back Chain ↗")}</a>
    <button class="link" data-act="restart">${esc(t.restart)}</button>
  </section>`;
}

function answerLand(v) {
  S.landed[S.round] = v;
  if (v === 0) { sound.warm(); toast("♡"); nextRound(); }
  else if (S.tries < 1) { sound.tap(); S.hint = null; go("hint"); }
  else { sound.tap(); nextRound(); }
}
function nextRound() {
  S.tries = 0; S.hint = null;
  if (S.round === 0) go("swap"); else go("summary");
}

$("stage").addEventListener("input", e => {
  const id = e.target.id, v = e.target.value;
  if (id === "nA") S.names[0] = v;
  if (id === "nB") S.names[1] = v;
  if (id === "own") {
    S.own[S.round] = v;
    if (v.trim()) { S.pick[S.round] = -1; document.querySelectorAll("[data-pick]").forEach(b => { b.setAttribute("aria-pressed", "false"); b.style.cssText = ""; }); }
    const nb = $("nextBtn"); if (nb) nb.disabled = !(S.pick[S.round] != null && (S.pick[S.round] !== -1 || v.trim().length > 2));
  }
  if (id === "real") S.real = v;
});
$("stage").addEventListener("click", e => {
  sound.init();
  const p = e.target.closest("[data-pick]"), l = e.target.closest("[data-land]"), hi = e.target.closest("[data-hint]"), a = e.target.closest("[data-act]");
  if (p) { sound.tap(); S.pick[S.round] = +p.dataset.pick; S.own[S.round] = ""; render(); return; }
  if (l) { answerLand(+l.dataset.land); return; }
  if (hi) { sound.tap(); S.hint = +hi.dataset.hint; render(); return; }
  if (!a) return;
  const k = a.dataset.act; sound.tap();
  switch (k) {
    case "toSetup": go("setup"); break;
    case "toPick": go("pick"); break;
    case "toRecipe": go("recipe"); break;
    case "toRepair": go("repair"); break;
    case "pause":
      if (timer.ended) return;
      if (timer.running) { timer.pause(); a.textContent = T().resume; } else { timer.resume(); a.textContent = T().pause; }
      break;
    case "toRespond": go("respond"); break;
    case "toCheck": go("check"); break;
    case "retry": if (S.hint == null) return; S.tries++; go("repair"); break;
    case "afterSwap": S.round = 1; go("pick"); break;
    case "copyReal": {
      const text = ($("real").value || "").trim(); if (!text) { $("real").focus(); return; }
      const ok = () => toast(T().copied);
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok).catch(fb); else fb();
      function fb() { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (_) {} ta.remove(); ok(); }
      break; }
    case "toEnd": S.real = ""; sound.warm(); go("end"); break;
    case "again": Object.assign(S, { round: 0, pick: [null, null], own: ["", ""], tries: 0, hint: null, landed: [null, null], real: "" }); S.names = [S.names[1], S.names[0]]; go("pick"); break;
    case "teach": go("teach"); break;
    case "saveTeach": {
      const text = ($("lText").value || "").trim(), name = ($("lName").value || "").trim();
      if (!text) { $("lText").focus(); return; }
      const chain = store.get("fb_teachback", []); chain.push({ demo: "repair", text, name, at: Date.now() }); store.set("fb_teachback", chain.slice(-50));
      sound.warm(); toast(T().saved); render(); break; }
    case "restart": Object.assign(S, { screen: "intro", round: 0, pick: [null, null], own: ["", ""], tries: 0, hint: null, landed: [null, null], real: "" }); go("intro"); break;
  }
});

window.__app = { S, go, render, timer };

/* ---------- facilitator guide ---------- */
const drawer = $("drawer");
function openGuide() {
  const t = T();
  $("panel").innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
      <div><span class="kicker">${esc(t.gKicker)}</span><h3 id="g-title">${esc(t.gTitle)}</h3></div>
      <button class="x" data-close aria-label="${esc(t.close)}">✕</button>
    </div>
    <h4>${esc(t.gWhy)}</h4><p>${esc(t.gWhyTxt)}</p>
    <h4>${esc(t.gSteps)}</h4><ol>${t.gStepList.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    <h4>${esc(t.gDebrief)}</h4><ul>${t.gDebriefList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    <h4>${esc(t.gNotes)}</h4><ul>${t.gNotesList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`;
  drawer.classList.add("show");
  setTimeout(() => drawer.querySelector("[data-close]").focus({ preventScroll: true }), 60);
}
function closeGuide() { drawer.classList.remove("show"); $("btn-guide").focus({ preventScroll: true }); }
drawer.addEventListener("click", e => { if (e.target === drawer || e.target.closest("[data-close]")) closeGuide(); });
$("btn-guide").addEventListener("click", openGuide);
window.addEventListener("keydown", e => { if (e.key === "Escape" && drawer.classList.contains("show")) closeGuide(); });

/* ---------- language + sound ---------- */
function paintSound() {
  const b = $("btn-sound"), t = T();
  b.innerHTML = sound.muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
  b.setAttribute("aria-label", sound.muted ? t.soundOff : t.soundOn); b.title = b.getAttribute("aria-label");
}
$("btn-sound").addEventListener("click", () => { sound.muted = !sound.muted; store.set("fb_muted", sound.muted); sound.init(); paintSound(); if (!sound.muted) sound.tap(); });

function applyLang(l) {
  lang = LANGS.includes(l) ? l : "en";
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.title = T().title;
  $("lang-lbl").textContent = LANG_LBL[lang];
  document.querySelectorAll("[data-t]").forEach(el => { const v = T()[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  paintSound();
  render();               // the clock object survives a re-render
  timer.paint();
  const pb = $("pauseBtn"); if (pb && !timer.running && !timer.ended) pb.textContent = T().resume;
  if (drawer.classList.contains("show")) openGuide();
  try { localStorage.setItem("wm_preferred_lang", lang); localStorage.setItem("wm_cases_lang", lang); } catch (e) {}
}
$("btn-lang").addEventListener("click", () => applyLang(LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]));

/* ---------- boot ---------- */
let saved = null;
try { saved = localStorage.getItem("wm_preferred_lang") || localStorage.getItem("wm_cases_lang"); } catch (e) {}
const nav = (navigator.language || "").toLowerCase();
applyLang(LANGS.includes(saved) ? saved : nav.startsWith("zh") ? "zh" : nav.startsWith("es") ? "es" : "en");
document.addEventListener("visibilitychange", () => { if (!document.hidden && timer.running) keepAwake(true); });
})();
</script>
</body>
</html>
