/* Keep the screen awake while a timer runs (where supported) */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

/* Timer ring */
function ringSVG() {
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="54" fill="none" stroke-width="6"/><circle class="fg" id="ring" cx="60" cy="60" r="54" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="0"/></svg>`;
}
const timer = {
  total: 90, left: 90, running: false, raf: 0, last: 0, onEnd: null, ended: false,
  start(total, onEnd) { this.stop(); this.total = this.left = total; this.onEnd = onEnd; this.ended = false; this.resume(); },
  resume() { if (this.running || this.ended) return; this.running = true; this.last = performance.now(); keepAwake(true); this.tick(); },
  pause() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); this.paint(); },
  stop() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); },
  tick() {
    if (!this.running) return;
    const now = performance.now(); this.left = Math.max(0, this.left - (now - this.last) / 1000); this.last = now;
    this.paint();
    if (this.left <= 0) { this.running = false; this.ended = true; keepAwake(false); sound.chime(); buzz([60, 80, 60]); this.onEnd && this.onEnd(); return; }
    this.raf = requestAnimationFrame(() => this.tick());
  },
  paint() {
    const ring = $("ring"), num = $("tnum"), lbl = $("tlbl"), wrap = $("timer");
    if (!ring) return;
    ring.setAttribute("stroke-dashoffset", String(339.29 * (1 - this.left / this.total)));
    const s = Math.ceil(this.left);
    num.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    lbl.textContent = this.ended ? "" : (this.running ? T().left : T().paused);
    wrap.classList.toggle("done", this.ended);
  }
};

const CODE_ABC = "ABCDEFGHJKMNPQRSTUVWXYZ";
const newRoomCode = () => Array.from({ length: 4 }, () => CODE_ABC[Math.floor(Math.random() * CODE_ABC.length)]).join("");
const uid = () => Math.random().toString(36).slice(2, 10);
const isLiveCfg = () => !!(ROOM_CONFIG.supabaseUrl && ROOM_CONFIG.anonKey) && !/[?&]local=1/.test(location.search);

/* ---------- transport: Supabase Realtime broadcast (raw Phoenix protocol, no library) or BroadcastChannel preview ---------- */
function makeTransport(code, onMsg, onStatus) {
  const topic = "realtime:fbroom-" + code;
  if (!isLiveCfg()) {
    let bc = null;
    try { bc = new BroadcastChannel("fb_room_" + code); bc.onmessage = e => onMsg(e.data.event, e.data.payload); } catch (e) {}
    setTimeout(() => onStatus(bc ? "preview" : "bad"), 0);
    return { send(ev, p) { try { bc && bc.postMessage({ event: ev, payload: p }); } catch (e) {} }, close() { try { bc && bc.close(); } catch (e) {} } };
  }
  let ws = null, ref = 0, hb = null, closed = false, tries = 0, joined = false;
  const base = (ROOM_CONFIG.realtimeUrl || ROOM_CONFIG.supabaseUrl.replace(/^http/, "ws") + "/realtime/v1/websocket").replace(/\/$/, "");
  const url = `${base}${base.includes("?") ? "&" : "?"}apikey=${encodeURIComponent(ROOM_CONFIG.anonKey)}&vsn=1.0.0`;
  const raw = m => { try { ws && ws.readyState === 1 && ws.send(JSON.stringify(m)); } catch (e) {} };
  function connect() {
    onStatus("connecting");
    try { ws = new WebSocket(url); } catch (e) { return retry(); }
    ws.onopen = () => {
      tries = 0;
      raw({ topic, event: "phx_join", ref: String(++ref), payload: { config: { broadcast: { self: false, ack: false }, presence: { key: "" }, private: false }, access_token: ROOM_CONFIG.anonKey } });
      clearInterval(hb); hb = setInterval(() => raw({ topic: "phoenix", event: "heartbeat", payload: {}, ref: String(++ref) }), 25000);
    };
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (_) { return; }
      if (m.event === "phx_reply" && m.topic === topic && m.payload && m.payload.status === "ok" && !joined) { joined = true; onStatus("ok"); onMsg("_ready", {}); }
      else if (m.event === "broadcast" && m.payload) onMsg(m.payload.event, m.payload.payload);
      else if (m.event === "phx_error" || m.event === "phx_close") { joined = false; onStatus("bad"); }
    };
    ws.onclose = () => { joined = false; clearInterval(hb); if (!closed) retry(); };
    ws.onerror = () => { try { ws.close(); } catch (_) {} };
  }
  function retry() { onStatus("bad"); setTimeout(() => { if (!closed) connect(); }, Math.min(15000, 800 * 2 ** tries++)); }
  connect();
  return {
    send(ev, p) { if (joined) raw({ topic, event: "broadcast", ref: String(++ref), payload: { type: "broadcast", event: ev, payload: p } }); },
    close() { closed = true; clearInterval(hb); try { ws && ws.close(); } catch (e) {} }
  };
}

/* ---------- state ---------- */
const PH = ["lobby", "collect", "cluster", "pair", "share", "close"];
// one anonymous id per browser tab (survives a refresh, not a closed tab)
let PID = ""; try { PID = sessionStorage.getItem("fb_room_pid") || ""; if (!PID) { PID = uid(); sessionStorage.setItem("fb_room_pid", PID); } } catch (e) { PID = uid(); }
const S = { screen: "intro", role: null, code: "", net: "", tx: null, pid: PID, codeIn: "" };
// host
const H = { phase: "lobby", prompt: "", promptIdx: 0, answers: [], themes: [], people: {}, pairs: {}, pairTheme: {}, shares: {}, talk: 5, endsAt: 0, seen: 0 };
// guest
const G = { phase: "lobby", prompt: "", sent: 0, myPair: 0, theme: null, q: "", endsAt: 0, shareSent: false, lost: false, gotState: false, draft: "", shareDraft: "" };

const hostKey = () => "fb_room_host_" + S.code;
function saveHost() { /* nothing persists: answers live only in this tab for the session */ }

function connect(code, role) {
  S.code = code; S.role = role;
  if (S.tx) S.tx.close();
  document.body.classList.toggle("host", role === "host");
  S.tx = makeTransport(code, onMsg, st => { S.net = st; paintNet(); });
  if (role === "guest") {
    hello(); clearInterval(S.helloIv);
    S.helloIv = setInterval(() => { if (S.role === "guest") hello(); }, 20000);
    clearTimeout(S.lostT); S.lostT = setTimeout(() => { if (!G.gotState) { G.lost = true; render(); } }, isLiveCfg() ? 9000 : 2500);
  }
}
function hello() { S.tx && S.tx.send("hello", { pid: S.pid }); }

/* host: the single source of truth; it rebroadcasts state on any change */
let stateT = 0;
function pushState() {
  clearTimeout(stateT);
  stateT = setTimeout(() => {
    const themes = H.themes.map(t => ({ id: t.id, name: t.name, c: t.c, items: H.answers.filter(a => a.theme === t.id).map(a => a.text) }));
    S.tx && S.tx.send("state", { phase: H.phase, prompt: H.prompt, pairs: H.pairs, pairTheme: H.pairTheme, themes, q: T().pairQ, left: H.endsAt ? Math.max(0, Math.round((H.endsAt - Date.now()) / 1000)) : 0 });
    saveHost();
  }, 120);
}

function onMsg(ev, p) {
  if (ev === "_ready") { if (S.role === "guest") hello(); else pushState(); return; }
  if (S.role === "host") {
    if (!p || !p.pid) return;
    const fresh = !H.people[p.pid]; H.people[p.pid] = Date.now();
    if (ev === "hello") {
      if (fresh && H.phase === "pair") { addLate(p.pid); }
      if (fresh) sound.tap();
      pushState(); renderSoft();
    } else if (ev === "answer" && H.phase === "collect") {
      if (H.answers.some(a => a.aid === p.aid)) return;
      const mine = H.answers.filter(a => a.pid === p.pid).length;
      if (mine >= 3) return;
      H.answers.push({ aid: p.aid, pid: p.pid, text: String(p.text || "").slice(0, 200), theme: null });
      sound.tap(); saveHost(); renderSoft();
    } else if (ev === "share" && H.phase === "share") {
      const pair = H.pairs[p.pid]; if (!pair) return;
      H.shares[pair] = String(p.text || "").slice(0, 200); sound.warm(); saveHost(); renderSoft();
    }
  } else if (S.role === "guest" && ev === "state") {
    G.gotState = true; G.lost = false;
    const changed = G.phase !== p.phase;
    G.phase = p.phase; G.prompt = p.prompt; G.q = p.q;
    G.myPair = (p.pairs || {})[S.pid] || 0;
    const tid = (p.pairTheme || {})[G.myPair];
    G.theme = (p.themes || []).find(t => t.id === tid) || null;
    if (p.left) G.endsAt = Date.now() + p.left * 1000; else G.endsAt = 0;
    if (changed) { if (p.phase === "collect") G.sent = 0; if (p.phase === "share") G.shareSent = false; sound.chime(); buzz(40); }
    // keep typing intact: only re-render when the phase or pair changed, or nothing is focused
    if (changed || !document.activeElement || !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) render();
  }
}

/* ---------- host actions ---------- */
function activePeople() { return Object.keys(H.people); }
function makePairs() {
  const ids = activePeople().sort(() => Math.random() - .5);
  H.pairs = {}; let n = 0;
  for (let i = 0; i < ids.length; i += 2) {
    n++;
    H.pairs[ids[i]] = n;
    if (ids[i + 1]) H.pairs[ids[i + 1]] = n;
  }
  // an odd one out joins the last pair as a trio
  if (ids.length % 2 === 1 && n > 1) { H.pairs[ids[ids.length - 1]] = n - 1; n--; }
  const used = H.themes.filter(t => H.answers.some(a => a.theme === t.id));
  const pool = used.length ? used : H.themes;
  H.pairTheme = {};
  for (let k = 1; k <= n; k++) H.pairTheme[k] = pool.length ? pool[(k - 1) % pool.length].id : null;
}
function addLate(pid) {
  const counts = {}; Object.values(H.pairs).forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  const lone = Object.keys(counts).find(k => counts[k] === 1);
  const duo = Object.keys(counts).find(k => counts[k] === 2);
  if (lone) H.pairs[pid] = +lone;
  else if (duo) H.pairs[pid] = +duo; // join a pair as a trio rather than wait alone
  else { const n = Object.keys(counts).length + 1; H.pairs[pid] = n; const pool = H.themes.filter(t => H.answers.some(a => a.theme === t.id)); H.pairTheme[n] = pool.length ? pool[(n - 1) % pool.length].id : null; }
}
function ensureThemes() {
  if (H.themes.length) return;
  H.themes = [0, 1, 2, 3].map(i => ({ id: "t" + i, name: "", c: COLORS[i] }));
}
// a light keyword grouping the facilitator can then correct by hand
function tokens(s) {
  s = s.toLowerCase();
  if (/[一-鿿]/.test(s)) { const c = s.replace(/[^一-鿿]/g, ""); const out = new Set(); for (let i = 0; i < c.length - 1; i++) out.add(c.slice(i, i + 2)); return out; }
  const stop = new Set("the and that this with have from what when where they them their there about would could should into your our for not are was but all can just more less make makes than then very really much some team work que los las del por con para una uno como más pero esto esta nuestro nuestra".split(" "));
  return new Set(s.split(/[^a-záéíóúñü]+/).filter(w => w.length > 3 && !stop.has(w)).map(w => w.replace(/(ing|ed|es|s)$/, "")));
}
function autoGroup() {
  ensureThemes();
  const sets = H.themes.map(() => new Set());
  H.answers.forEach(a => a.theme = null);
  H.answers.forEach((a, idx) => {
    const tk = tokens(a.text); let best = -1, score = 0;
    sets.forEach((st, i) => { let s = 0; tk.forEach(w => st.has(w) && s++); if (s > score) { score = s; best = i; } });
    if (best < 0) { const sizes = H.themes.map(t => H.answers.filter(x => x.theme === t.id).length); best = sizes.indexOf(Math.min(...sizes)); }
    a.theme = H.themes[best].id; tk.forEach(w => sets[best].add(w));
  });
}
function setPhase(ph) {
  H.phase = ph;
  if (ph === "cluster") ensureThemes();
  if (ph === "pair") { makePairs(); H.endsAt = Date.now() + H.talk * 60000; }
  if (ph === "share") { H.endsAt = 0; H.shares = {}; }
  sound.chime(); pushState(); render();
}

  case "close":
    b = `<span class="kicker" style="color:var(--good)">✓</span><h2>${esc(t.endTitle)}</h2><p class="serif">${esc(t.endLead)}</p>
      <div class="monday"><b>${esc(t.monday)}</b>${esc(t.mondayTxt)}</div>
      <a class="link" href="/free_builder/teachback">⊂⊃ ${esc(t.teachLink)}</a>`; break;
  }
  return `<section class="screen">${head}${b}</section>`;
}

function roomArt() {
  return `<svg viewBox="0 0 320 130" style="width:100%;max-width:420px;height:auto;margin:6px auto" aria-hidden="true">
    <rect x="70" y="10" width="180" height="70" rx="12" fill="#17171A"/><rect x="88" y="28" width="60" height="8" rx="4" fill="#E2553F"/><rect x="88" y="44" width="110" height="6" rx="3" fill="rgba(247,246,242,.35)"/><rect x="88" y="56" width="80" height="6" rx="3" fill="rgba(247,246,242,.35)"/>
    ${[40, 92, 144, 196, 248].map((x, i) => `<rect x="${x}" y="92" width="22" height="34" rx="5" fill="#fff" stroke="#E5E2DA"/><circle cx="${x + 11}" cy="120" r="2.5" fill="${COLORS[i]}"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" begin="${i * .2}s" repeatCount="indefinite"/></circle>`).join("")}
  </svg>`;
}

/* clocks tick without re-rendering */
setInterval(() => {
  if (S.role === "host" && H.phase === "pair") { const el = $("hclock"); if (el) el.textContent = fmtClock(H.endsAt - Date.now()); if (H.endsAt && Date.now() > H.endsAt && !H.rang) { H.rang = true; sound.chime(); } }
  if (S.role === "guest" && G.phase === "pair") { const el = $("gclock"); if (el) el.textContent = fmtClock(G.endsAt - Date.now()); }
  // host: forget phones not seen for 3 minutes (only before pairing)
  if (S.role === "host" && (H.phase === "lobby" || H.phase === "collect")) { const now = Date.now(); let ch = false; for (const k in H.people) if (now - H.people[k] > 180000) { delete H.people[k]; ch = true; } if (ch) paintCounts(); }
}, 500);

/* ---------- events ---------- */
$("stage").addEventListener("input", e => {
  const el = e.target;
  if (el.id === "codeIn") { const v = el.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4); if (v !== el.value) el.value = v; S.codeIn = v; const b = $("joinBtn"); if (b) b.disabled = v.length !== 4; }
  if (el.id === "promptIn") { H.prompt = el.value; document.querySelectorAll("[data-prompt]").forEach(b => b.setAttribute("aria-pressed", "false")); const b = $("collectBtn"); if (b) b.disabled = !el.value.trim(); }
  if (el.dataset.theme) { const th = themeOf(el.dataset.theme); if (th) { th.name = el.value; pushState(); } }
  if (el.id === "ansIn") { G.draft = el.value; const b = $("sendBtn"); if (b) b.disabled = !el.value.trim(); }
  if (el.id === "shareIn") { G.shareDraft = el.value; const b = $("shareBtn"); if (b) b.disabled = !el.value.trim(); }
});
$("stage").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "codeIn" && S.codeIn.length === 4) { e.preventDefault(); joinRoom(S.codeIn); }
});
function joinRoom(code) {
  Object.assign(G, { phase: "lobby", sent: 0, myPair: 0, theme: null, gotState: false, lost: false, draft: "", shareDraft: "", shareSent: false });
  S.screen = "room"; connect(code, "guest"); render();
  try { history.replaceState(null, "", location.pathname + "?c=" + code + (location.search.includes("local=1") ? "&local=1" : "")); } catch (e) {}
}
$("stage").addEventListener("click", e => {
  sound.init();
  const pr = e.target.closest("[data-prompt]"), ac = e.target.closest("[data-aid]"), tk = e.target.closest("[data-talk]"), a = e.target.closest("[data-act]");
  if (pr) { H.prompt = T().prompts[+pr.dataset.prompt]; sound.tap(); render(); return; }
  if (ac && S.role === "host" && H.phase === "cluster") {
    const ans = H.answers.find(x => x.aid === ac.dataset.aid); if (!ans) return;
    const i = ans.theme ? H.themes.findIndex(t => t.id === ans.theme) : -1;
    ans.theme = H.themes[(i + 1) % H.themes.length].id; sound.tap(); pushState(); render(); return;
  }
  if (tk) { H.talk = +tk.dataset.talk; H.endsAt = Date.now() + H.talk * 60000; H.rang = false; sound.tap(); pushState(); render(); return; }
  if (!a) return;
  const k = a.dataset.act; sound.tap();
  switch (k) {
    case "host": {
      S.screen = "room"; const code = newRoomCode(); Object.assign(H, { phase: "lobby", prompt: "", answers: [], themes: [], people: {}, pairs: {}, pairTheme: {}, shares: {}, talk: 5, endsAt: 0, rang: false });
      connect(code, "host"); render(); break; }
    case "join": if (S.codeIn.length === 4) joinRoom(S.codeIn); break;
    case "leave": if (S.tx) S.tx.close(); S.tx = null; S.role = null; S.screen = "intro"; document.body.classList.remove("host"); render(); break;
    case "collect": if (H.prompt.trim()) setPhase("collect"); break;
    case "cluster": setPhase("cluster"); break;
    case "auto": autoGroup(); pushState(); render(); break;
    case "pair": setPhase("pair"); break;
    case "share": setPhase("share"); break;
    case "close": setPhase("close"); break;
    case "copySum": {
      const t = T(), text = [`FREE//BUILDER — Room Mode · ${S.code}`, H.prompt, "",
        ...H.themes.filter(th => H.answers.some(x => x.theme === th.id)).map((th, i) => `${th.name || fmt(t.themePh, { n: i + 1 })}: ${H.answers.filter(x => x.theme === th.id).map(x => x.text).join(" / ")}`), "",
        t.closeTitle + ":", ...Object.entries(H.shares).map(([n, s]) => `${n}. ${s}`)].join("\n");
      const ok = () => toast(t.copied);
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok).catch(fb); else fb();
      function fb() { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (_) {} ta.remove(); ok(); }
      break; }
    case "newSession": if (S.tx) S.tx.close(); S.tx = null; S.role = null; S.screen = "intro"; document.body.classList.remove("host"); render(); break;
    case "send": {
      const v = G.draft.trim(); if (!v || G.sent >= 3) return;
      S.tx && S.tx.send("answer", { pid: S.pid, aid: uid(), text: v }); G.sent++; G.draft = ""; sound.warm(); render();
      const ta = $("ansIn"); if (ta && !matchMedia("(pointer: coarse)").matches) ta.focus(); break; }
    case "sendShare": {
      const v = G.shareDraft.trim(); if (!v) return;
      S.tx && S.tx.send("share", { pid: S.pid, text: v }); G.shareSent = true; sound.warm(); render(); break; }
  }
});

/* auto-join from a shared link: /free_builder/room?c=KITE */
const qc = (new URLSearchParams(location.search).get("c") || "").toUpperCase().replace(/[^A-Z]/g, "");
if (qc.length === 4) { S.codeIn = qc; setTimeout(() => joinRoom(qc), 0); }

window.__app = { S, H, G, render, setPhase, autoGroup, onMsg };

/* ---------- facilitator guide ---------- */
const drawer = $("drawer");
function openGuide() {
  const t = T();
  $("panel").innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
      <div><span class="kicker">${esc(t.gKicker)}</span><h3 id="g-title">${esc(t.gTitle)}</h3></div>
      <button class="x" data-close aria-label="${esc(t.close)}">✕</button>
    </div>
    <h4>${esc(t.gWhy)}</h4><p>${esc(t.gWhyTxt)}</p>
    <h4>${esc(t.gSteps)}</h4><ol>${t.gStepList.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    <h4>${esc(t.gDebrief)}</h4><ul>${t.gDebriefList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    <h4>${esc(t.gNotes)}</h4><ul>${t.gNotesList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`;
  drawer.classList.add("show");
  setTimeout(() => drawer.querySelector("[data-close]").focus({ preventScroll: true }), 60);
}
function closeGuide() { drawer.classList.remove("show"); $("btn-guide").focus({ preventScroll: true }); }
drawer.addEventListener("click", e => { if (e.target === drawer || e.target.closest("[data-close]")) closeGuide(); });
$("btn-guide").addEventListener("click", openGuide);
window.addEventListener("keydown", e => { if (e.key === "Escape" && drawer.classList.contains("show")) closeGuide(); });

/* ---------- language + sound ---------- */
function paintSound() {
  const b = $("btn-sound"), t = T();
  b.innerHTML = sound.muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
  b.setAttribute("aria-label", sound.muted ? t.soundOff : t.soundOn); b.title = b.getAttribute("aria-label");
}
$("btn-sound").addEventListener("click", () => { sound.muted = !sound.muted; store.set("fb_muted", sound.muted); sound.init(); paintSound(); if (!sound.muted) sound.tap(); });

function applyLang(l) {
  lang = LANGS.includes(l) ? l : "en";
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.title = T().title;
  $("lang-lbl").textContent = LANG_LBL[lang];
  $("btn-guide").setAttribute("aria-label", T().guide); drawer.setAttribute("aria-label", T().guide);
  document.querySelectorAll("[data-t]").forEach(el => { const v = T()[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  paintSound();
  render();               // the clock object survives a re-render
  timer.paint();
  const pb = $("pauseBtn"); if (pb && !timer.running && !timer.ended) pb.textContent = T().resume;
  if (drawer.classList.contains("show")) openGuide();
  try { localStorage.setItem("wm_preferred_lang", lang); localStorage.setItem("wm_cases_lang", lang); } catch (e) {}
}
$("btn-lang").addEventListener("click", () => applyLang(LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]));

/* ---------- boot ---------- */
let saved = null;
try { saved = localStorage.getItem("wm_preferred_lang") || localStorage.getItem("wm_cases_lang"); } catch (e) {}
const nav = (navigator.language || "").toLowerCase();
applyLang(LANGS.includes(saved) ? saved : nav.startsWith("zh") ? "zh" : nav.startsWith("es") ? "es" : "en");
document.addEventListener("visibilitychange", () => { if (!document.hidden && timer.running) keepAwake(true); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/free_builder/sw.js", { scope: "/free_builder/" }).catch(() => {}); // offline cache
})();
</script>
</body>
</html>
