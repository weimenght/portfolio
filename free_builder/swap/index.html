 { dim: "Direct ↔ indirect feedback", title: "The quiet review",
   sit: "Yesterday's design review. In front of the team, the team lead said: “This doesn't work. We need to rethink it.” The designer said nothing for the rest of the meeting.",

   b: { r: "设计师", b: ["在你习惯的工作环境里，当众批评会让人丢面子。", "你的沉默是因为受伤，不是同意。", "如果是一对一说同样的话，你会很欢迎。"] },
   diff: "直接沟通与含蓄沟通。有的团队里，直说是尊重；有的团队里，尊重是私下、温和地说。沉默可能意味着完全不同的东西。" },
 { dim: "固定 ↔ 弹性的时间", title: "“周五前”",
   sit: "合作团队答应“周五前”给数据。现在是周一，数据还没到，项目经理已经发了两条越来越简短的消息。",
   goal: "商量一个新计划——以及以后怎么谈日期。",
   a: { r: "项目经理", b: ["“周五”就是周五下午五点，你的整个计划都建立在它上面。", "你已经不得不向总监解释延期。", "没人告诉你会延期——这才最让你难受。"] },
   b: { r: "合作团队负责人", b: ["对你来说，“周五”是一个真诚的估计，而不是合同。", "周三一个重要客户出了紧急状况，你选择了客户，再来一次也会这样选。", "那几条简短的消息让你觉得很冷——明明合作了好几年。"] },
   diff: "钟表时间与事件时间。有的团队把截止日期当作固定承诺；有的团队把它当作估计，会因关系和紧急事件而调整。两者都不是不负责。" },
 { dim: "扁平 ↔ 层级", title: "“有没有异议？”",
   sit: "经理在规划会结尾问：“有没有异议？”——一片安静。一周后，经理从别人那里听说，资深工程师觉得这个计划有风险。",
   goal: "商量好风险怎样及时传到经理这里。",
   a: { r: "经理", b: ["你公开问了。没人说话就是同意——问这个问题就是为了这个。", "从别人那里听到，感觉像被绕过了。", "你是真心想早点听到坏消息。"] },
   b: { r: "资深工程师", b: ["当着全组的面反驳经理，你觉得非常不尊重。", "你通过一位信任的同事转达了——你以为这是得体的方式。", "会议最后那句“有没有异议？”听起来像走个形式。"] },
   diff: "低权力距离与高权力距离。有人在任何场合都会直接对任何人发言；有人表达尊重的方式，是私下或通过他人提出顾虑。开放的问题，不一定是敞开的门。" },
 { dim: "任务优先 ↔ 关系优先", title: "第一次通话",
   sit: "和新供应商的第一次视频会议。十分钟后，采购方就开始谈价格和合同条款。供应商明显变得拘谨起来。",
   goal: "一起规划下一次会议。",
   a: { r: "采购方", b: ["你时间很紧，直奔主题是一种礼貌。", "你对这个供应商印象很好——所以才直接谈条款。", "供应商突然变得拘谨，让你很困惑。"] },
   b: { r: "供应商", b: ["在稍微了解对方之前，你没法信任一个合作伙伴。", "一上来就谈价格，感觉像被当成了自动售货机。", "你准备好了要聊两个团队怎么合作。"] },
   diff: "基于任务的信任与基于关系的信任。有人先看到好的工作，才建立信任；有人先建立信任，才会有好的工作。寒暄可能才是真正的正事。" },
 { dim: "果断 ↔ 共识", title: "一纸通知",
   sit: "组长在周一全员会上宣布全组改用一个新工具。到了周三，分析师的小组悄悄换回了旧工具。",
   goal: "商量好下一个团队决定要怎么做。",
   a: { r: "组长", b: ["你决定得很快，因为上次等待让团队损失了好几周。", "你觉得清楚地宣布出来，才是尊重大家。", "悄悄换回旧工具，感觉像是在拆台。"] },
   b: { r: "分析师", b: ["你的团队期待：影响日常工作的改变，事先要征求意见。", "没有征求意见的决定，让你觉得自己的专业不被重视。", "你知道新工具有一个缺陷，但没人问过。"] },
   diff: "自上而下与共识决策。有的团队重视领导快速拍板；有的团队重视花时间让每个人一起走。快速的决定，落地可能很慢。" },
 { dim: "随时在线 ↔ 守护时间", title: "晚上 11 点的消息",
   sit: "晚上 11 点，一位同事发来消息：“能帮忙看下这个 PPT 吗？”另一位第二天早上 9 点才回。之后这位同事在站会上问为什么这么久才回。",
   goal: "商量出对你们俩都合适的消息规则。",
   a: { r: "发消息的同事", b: ["你习惯晚上工作，因为那时才能静下心来——通常你并不期待马上回复……", "但这一次，客户早上 8 点就要看这份 PPT。", "你没说很急，你以为这很明显。"] },
   b: { r: "回消息的同事", b: ["晚上属于家人，你是故意关掉手机的。", "晚上 11 点的消息让你觉得必须随时待命。", "在站会上被问起，感觉像被当众指责。"] },
   diff: "边界与紧急程度。团队对下班后的消息是否可以、是否被期待、是否打扰，看法各不相同。没说出口的紧急，才是真正的陷阱。" }
],
es: [
 { dim: "Feedback directo ↔ indirecto", title: "La revisión silenciosa",
   sit: "Revisión de diseño de ayer. Delante del equipo, la persona líder dijo: “Esto no funciona. Hay que repensarlo.” La diseñadora no volvió a hablar en toda la reunión.",
   goal: "Acordad cómo os daréis feedback antes de la próxima revisión.",
   a: { r: "líder del equipo", b: ["Decirlo claro es tu forma de mostrar respeto: no haces perder el tiempo.", "La diseñadora se quedó callada y supusiste que estaba de acuerdo.", "Te preocupa que el lanzamiento se retrase si los problemas no se nombran pronto."] },
   b: { r: "diseñadora", b: ["Donde aprendiste a trabajar, una crítica delante de otros es quedar en evidencia.", "Tu silencio era dolor, no acuerdo.", "Habrías agradecido el mismo comentario a solas."] },
   diff: "Comunicación directa frente a indirecta. En unos equipos, decirlo claro es respeto; en otros, el respeto es decirlo en privado y con suavidad. El silencio puede significar cosas muy distintas." },
 { dim: "Tiempo fijo ↔ flexible", title: "“Para el viernes”",
   sit: "El equipo socio prometió los datos “para el viernes”. Es lunes, no han llegado y la jefa de proyecto ha enviado dos mensajes cada vez más secos.",
   goal: "Acordad un nuevo plan, y cómo hablaréis de fechas a partir de ahora.",
   a: { r: "jefa de proyecto", b: ["“Viernes” significa viernes a las 17:00. Todo tu plan dependía de eso.", "Ya has tenido que explicar el retraso a tu directora.", "Nadie te avisó de que se retrasaba: eso es lo que más duele."] },
   b: { r: "responsable del equipo socio", b: ["Para ti, “viernes” era una estimación de buena fe, no un contrato.", "El miércoles un cliente clave tuvo una crisis; elegiste al cliente y lo volverías a hacer.", "Los mensajes secos te parecieron fríos, después de años trabajando bien juntos."] },
   diff: "Tiempo de reloj frente a tiempo de evento. Unos equipos tratan las fechas como promesas fijas; otros, como estimaciones que se adaptan a las relaciones y a las urgencias. Ninguno es descuidado." },
 { dim: "Plano ↔ jerárquico", title: "“¿Alguna objeción?”",
   sit: "El jefe cerró la reunión de planificación con “¿Alguna objeción?”: silencio. Una semana después, supo por otra persona que la ingeniera sénior cree que el plan es arriesgado.",
   goal: "Acordad cómo llegarán los riesgos al jefe a tiempo.",
   a: { r: "jefe", b: ["Preguntaste abiertamente. El silencio es un sí: para eso era la pregunta.", "Enterarte por otros se siente como si te hubieran esquivado.", "De verdad quieres oír las malas noticias pronto."] },
   b: { r: "ingeniera sénior", b: ["Contradecir a tu jefe delante de todo el equipo te parece una falta de respeto.", "Lo hiciste llegar a través de un colega de confianza: el canal respetuoso, pensabas.", "“¿Alguna objeción?” al final de la reunión sonó a mera formalidad."] },
   diff: "Distancia jerárquica baja frente a alta. Hay quien habla a cualquiera en cualquier sala; hay quien muestra respeto planteando sus dudas en privado o a través de otros. Una pregunta abierta no siempre es una puerta abierta." },
 { dim: "Tarea primero ↔ relación primero", title: "La primera llamada",
   sit: "Primera videollamada con un proveedor nuevo. A los diez minutos, la compradora pasó a precios y condiciones. El proveedor se volvió claramente más reservado.",
   goal: "Planificad juntos la próxima reunión.",
   a: { r: "compradora", b: ["Vas justa de tiempo; ir al grano es una cortesía.", "El proveedor te gustó: por eso pasaste directamente a las condiciones.", "Su repentina reserva te desconcertó."] },
   b: { r: "proveedor", b: ["No puedes confiar en un socio sin conocerlo un poco.", "Saltar al precio te hizo sentir como una máquina expendedora.", "Habías preparado una charla sobre cómo podrían trabajar juntos los dos equipos."] },
   diff: "Confianza basada en la tarea frente a la relación. Para unos, la confianza llega tras el buen trabajo; para otros, el buen trabajo llega tras la confianza. La charla previa puede ser el verdadero negocio." },
 { dim: "Decidir rápido ↔ por consenso", title: "El anuncio",
   sit: "La líder anunció en la reunión general del lunes una herramienta nueva para todo el equipo. El miércoles, el equipo del analista había vuelto en silencio a la antigua.",
   goal: "Acordad cómo se tomará la próxima decisión del equipo.",
   a: { r: "líder del equipo", b: ["Decidiste rápido porque la última vez esperar costó semanas.", "Pensaste que anunciarlo con claridad era lo respetuoso.", "La vuelta silenciosa a la herramienta antigua te parece un sabotaje."] },
   b: { r: "analista", b: ["Tu equipo espera que le consulten antes de un cambio que afecta al día a día.", "Una decisión sin consulta te hizo sentir que tu experiencia no contaba.", "Conoces un fallo de la nueva herramienta por el que nadie preguntó."] },
   diff: "Decisiones de arriba abajo frente a consenso. Unos equipos valoran una decisión rápida desde arriba; otros, el tiempo que cuesta sumar a todos. Las decisiones rápidas pueden tardar en aterrizar." },
 { dim: "Siempre conectado ↔ tiempo protegido", title: "El mensaje de las 23:00",
   sit: "A las 23:00, una colega envió un mensaje: “¿Puedes revisar la presentación?” El otro respondió a las 9:00. Luego ella preguntó en la reunión diaria por qué había tardado tanto.",
   goal: "Acordad normas de mensajes que os sirvan a los dos.",
   a: { r: "colega que escribió", b: ["Trabajas tarde porque es cuando puedes pensar; normalmente no esperas respuesta inmediata…", "Esta vez, un cliente esperaba la presentación a las 8:00.", "No dijiste que era urgente; supusiste que era obvio."] },
   b: { r: "colega que respondió", b: ["Las noches son para tu familia; apagaste el móvil a propósito.", "El mensaje de las 23:00 te pareció una presión para estar siempre disponible.", "Que te lo preguntaran en la reunión diaria se sintió como una crítica en público."] },
   diff: "Límites y urgencia. Los equipos difieren en si los mensajes fuera de horario son normales, esperados o invasivos. La urgencia no dicha es la verdadera trampa." }
]
};

const CORRIDORS = {"en": [{"id": 1, "dim": "Bad news & hierarchy", "title": "The vanishing roadblock", "cities": ["San Francisco", "Bengaluru"], "sit": [["Alex · Engineering manager, San Francisco", "Shipping the auth service tomorrow. Any blockers?"], ["Rohan · Tech lead, Bengaluru (vendor team)", "The team is actively analysing the payload flows. All good on our side."], ["Alex · next day", "The build broke on a legacy schema dependency! Why wasn't this flagged yesterday?"], ["Rohan", "We worked through the night to fix it without alarming your leadership."]], "aName": "Alex", "bName": "Rohan", "aRole": "Alex · Engineering manager, San Francisco", "bRole": "Rohan · Tech lead, Bengaluru (vendor team)", "aBrief": "I asked directly about blockers. Raising risk early is the job, and bad news early is good news.", "bBrief": "Flagging a blocker in an open channel, to the client's manager, felt like failing in public. “Actively analysing” was my signal that something was wrong.", "lenses": {"culture": "Erin Meyer's Culture Map places India toward the hierarchical end of its “Leading” scale and the US toward the egalitarian end, on average. Taking an unsolved problem to someone senior can feel like a failure of duty.", "power": "Rohan works for a vendor. Admitting a blocker to the client's manager can feel like risking the contract, in any country.", "person": "Rohan is proud of his team's craft and didn't want his junior engineers blamed."}, "script": "Rohan, part of my job is clearing things your team can't control. What's one dependency I can push through for you this week?"}, {"id": 2, "dim": "Feedback & tone", "title": "The blunt code review", "cities": ["Amsterdam", "São Paulo"], "sit": [["Daan · Staff engineer, Amsterdam", "PR review: “This implementation is unacceptable. Scrap the ORM pattern and rewrite it.”"], ["Thiago · Senior developer, São Paulo", "Acknowledged."], ["Daan · later that week", "Why has Thiago gone quiet on every review since?"]], "aName": "Daan", "bName": "Thiago", "aRole": "Daan · Staff engineer, Amsterdam", "bRole": "Thiago · Senior developer, São Paulo", "aBrief": "Code isn't a person. Being clear saves everyone hours of back-and-forth.", "bBrief": "Not one word about what worked, in a public PR, with “unacceptable”. That isn't how you treat a colleague you respect.", "lenses": {"culture": "On Meyer's “Evaluating” scale, the Netherlands sits near the direct end for negative feedback, while Brazil sits further toward indirect, on average.", "power": "Written review comments lose tone, and Daan is more senior. Harsh words from above land harder.", "person": "Daan writes tersely to everyone, including his manager. Thiago had worked late to get this PR in."}, "script": "Thiago, the schema work is solid. One concern: the ORM query pattern will struggle at peak load. Got ten minutes to look at options together?"}, {"id": 3, "dim": "Silence & turn-taking", "title": "The four-second silence", "cities": ["London", "Tokyo"], "sit": [["Harry · Director, London", "Any objections to retiring the legacy schema next month?"], ["Kenji · Architect, Tokyo", "(unmutes… pauses)"], ["Harry", "Great, silence is consent! On to item two."], ["Three days later", "The Tokyo team flags a critical dependency on the legacy schema."]], "aName": "Harry", "bName": "Kenji", "aRole": "Harry · Director, London", "bRole": "Kenji · Architect, Tokyo", "aBrief": "On a video call, silence means agreement. If nobody objects in a couple of seconds, we move on.", "bBrief": "I was forming a disagreement in my second language, carefully, so it wouldn't embarrass anyone. He moved on before I could speak.", "lenses": {"culture": "Pausing before disagreeing with a senior person is often described in Japanese business settings. But research on everyday conversation finds turn-taking gaps are similar across languages (Stivers et al., 2009), so don't assume the pause was “cultural”.", "power": "Harry chairs the call and is the most senior person on it. Objecting to the chair, live and in front of others, is hard anywhere.", "person": "Kenji was working in his second language, at 9pm Tokyo time, on a technical point that needed precise wording."}, "script": "I'm going to pause here. Kenji, when you're ready, I'd love the Tokyo view on any edge cases."}, {"id": 4, "dim": "Trust & relationships", "title": "The cold ping", "cities": ["Munich", "Mexico City"], "sit": [["Stefan · Project manager, Munich", "09:02 · “Carlos, send the API documentation now. We're past the deadline.”"], ["Carlos · Engineering lead, Mexico City", "…"], ["Stefan · next day", "“Did you get my message? Why haven't you sent it?”"], ["Carlos", "“Hola Stefan. We're reviewing it.”"]], "aName": "Stefan", "bName": "Carlos", "aRole": "Stefan · Project manager, Munich", "bRole": "Carlos · Engineering lead, Mexico City", "aBrief": "Getting straight to the point respects his time. Deadlines are deadlines.", "bBrief": "Two messages, no hello, no question about how we're doing. It feels like I'm a ticket, not a colleague.", "lenses": {"culture": "Meyer's “Trusting” scale places Germany toward task-based trust (built through reliable work) and Mexico toward relationship-based trust (built through personal connection), on average.", "power": "Stefan sits at headquarters. Carlos's team are often the last to hear when priorities change, so curt demands land as orders.", "person": "Carlos's team had been fixing a production outage all night. Stefan didn't know because he hadn't asked."}, "script": "Hola Carlos, how's the team doing this week? I hear it's been busy. When could we realistically go through the API docs together?"}, {"id": 5, "dim": "Decoding “yes”", "title": "The yes that meant maybe", "cities": ["Sydney", "Hanoi"], "sit": [["Liam · Client project manager, Sydney", "Can you commit to 15 October? Is that possible?"], ["Linh · Engineering lead, Hanoi", "Yes… we will do our best."], ["Liam · 16 October", "It's not live? You said yes!"], ["Linh", "I said we would do our best. The scope needed services we didn't have."]], "aName": "Liam", "bName": "Linh", "aRole": "Liam · Client project manager, Sydney", "bRole": "Linh · Engineering lead, Hanoi", "aBrief": "Yes means yes. If the date was impossible, she should have said no.", "bBrief": "Saying “no” outright to a client is very hard. “We will do our best”, with a pause, was my warning.", "lenses": {"culture": "In many high-context settings, Vietnam among them, a direct “no” to a client may be avoided, and “we'll do our best” can signal real doubt. Plenty of low-context speakers hedge with the same words.", "power": "Liam controls the budget for Linh's team. Saying no to the person who pays you is hard everywhere.", "person": "Linh had just been promoted and wanted to show she could deliver."}, "script": "Linh, if we aim for 15 October, what are the three things that would have to go perfectly? What would you trade off to get there?"}, {"id": 6, "dim": "Disagreement", "title": "The heated debate", "cities": ["Paris", "Singapore"], "sit": [["Camille · Design lead, Paris", "I completely disagree with this user journey. It makes no logical sense!"], ["Jia Hui · Product manager, Singapore", "(goes quiet; one-word answers for the rest of the sprint)"], ["Camille · at drinks", "Coming? That was a great debate!"]], "aName": "Camille", "bName": "Jia Hui", "aRole": "Camille · Design lead, Paris", "bRole": "Jia Hui · Product manager, Singapore", "aBrief": "Arguing hard about ideas shows I take them seriously. It's not personal; we're still friends afterwards.", "bBrief": "Being told my work “makes no logical sense” in front of the team felt like a public attack. A drink doesn't undo that.", "lenses": {"culture": "Meyer's “Disagreeing” scale places France toward open confrontation as engagement, and many Southeast and East Asian workplaces toward avoiding open confrontation, on average.", "power": "Camille sits at headquarters and has informal influence over regional promotions, which raises the stakes of a public clash.", "person": "Jia Hui had spent two weeks on the journey while caring for a sick parent."}, "script": "Jia Hui, let's look at where our two journeys differ. If we tested both, what user behaviour would tell us which works better?"}, {"id": 7, "dim": "Time & scheduling", "title": "The elastic deadline", "cities": ["Zurich", "Rome"], "sit": [["Anna · Logistics planner, Zurich", "Our dock slot was locked for Friday 09:00. Your trucks arrived Tuesday at 14:00."], ["Matteo · Operations lead, Rome", "A key customer's plant broke down on Thursday. We moved everyone to fix it. We saved them, and delivered today!"], ["Anna", "You broke our whole schedule."]], "aName": "Anna", "bName": "Matteo", "aRole": "Anna · Logistics planner, Zurich", "bRole": "Matteo · Operations lead, Rome", "aBrief": "If slots are elastic, the supply chain collapses. Being on time is respect.", "bBrief": "A customer was in crisis. Protecting an internal slot over a real emergency isn't service.", "lenses": {"culture": "Meyer's “Scheduling” scale places Switzerland near the linear-time end and Italy toward flexible time, on average.", "power": "Anna's plant pays automated penalties for missed dock slots; Matteo's bonus is tied to customer satisfaction.", "person": "Matteo drove to the customer himself on Sunday to make sure the fix worked."}, "script": "Matteo, great work saving that customer. Dock changes here ripple into three other plants. When a crisis hits, can we agree a one-hour alert so we can move slots in time?"}, {"id": 8, "dim": "Persuading", "title": "The “why first” pushback", "cities": ["New York", "Paris"], "sit": [["Jordan · VP Product, New York", "Here's our new CRM! Three case studies show 40% higher close rates. Let's onboard by Friday!"], ["Elodie · Country lead, Paris", "Wait. Why this vendor? What's the reasoning behind its data model?"], ["Jordan · privately", "Why does Paris always want to philosophise?"]], "aName": "Jordan", "bName": "Elodie", "aRole": "Jordan · VP Product, New York", "bRole": "Elodie · Country lead, Paris", "aBrief": "Show results, skip the theory. People want proof that it works.", "bBrief": "If the reasoning is flawed, the case studies are luck. Convince me the method is sound first.", "lenses": {"culture": "Meyer's “Persuading” scale contrasts principles-first reasoning (often associated with France) with applications-first reasoning (often associated with the US). Both are rigorous; they start in different places.", "power": "The decision came from New York with little European input, so “why?” also means “we weren't consulted”.", "person": "Elodie has an engineering background and lived through a failed CRM migration."}, "script": "Elodie, before the demo, let me take five minutes on why we chose this data model over the alternatives. Then the results. I'd value your read on the evaluation."}], "zh": [{"id": 1, "dim": "坏消息与层级", "title": "消失的障碍", "cities": ["旧金山", "班加罗尔"], "sit": [["Alex · 工程经理，旧金山", "认证服务明天上线。有什么阻碍吗？"], ["Rohan · 技术负责人，班加罗尔（供应商团队）", "团队正在积极分析负载流程。我们这边一切正常。"], ["Alex · 第二天", "构建因为一个遗留数据结构依赖挂了！昨天为什么没提出来？"], ["Rohan", "我们通宵修复了它，以免惊动你们的领导层。"]], "aName": "Alex", "bName": "Rohan", "aRole": "Alex · 工程经理，旧金山", "bRole": "Rohan · 技术负责人，班加罗尔（供应商团队）", "aBrief": "我直接问了有没有阻碍。尽早暴露风险是本职工作，坏消息越早越好。", "bBrief": "在公开频道里、当着客户经理的面提出阻碍，感觉就像当众失败。“正在积极分析”是我在发出有问题的信号。", "lenses": {"culture": "Erin Meyer 的《文化地图》在“领导”维度上，平均而言把印度放在偏层级的一端，美国放在偏平等的一端。把一个未解决的问题交给上级，可能会让人觉得是失职。", "power": "Rohan 为供应商工作。在任何国家，向客户经理承认有阻碍，都可能感觉是在拿合同冒险。", "person": "Rohan 为团队的手艺感到自豪，不想让手下的初级工程师受责备。"}, "script": "Rohan，我工作的一部分就是清除你们团队控制不了的障碍。这周有哪一个依赖是我可以帮你推动的？"}, {"id": 2, "dim": "反馈与语气", "title": "直白的代码评审", "cities": ["阿姆斯特丹", "圣保罗"], "sit": [["Daan · 资深工程师，阿姆斯特丹", "PR 评审：“这个实现不可接受。放弃这个 ORM 模式，重写。”"], ["Thiago · 高级开发，圣保罗", "收到。"], ["Daan · 那周晚些时候", "为什么 Thiago 之后在每次评审里都不吭声了？"]], "aName": "Daan", "bName": "Thiago", "aRole": "Daan · 资深工程师，阿姆斯特丹", "bRole": "Thiago · 高级开发，圣保罗", "aBrief": "代码不是人。说清楚能为大家省下好几个小时的来回。", "bBrief": "在公开的 PR 里，一句肯定都没有，还用了“不可接受”。这不是对待一位你尊重的同事的方式。", "lenses": {"culture": "在 Meyer 的“评估”维度上，平均而言，荷兰在负面反馈上接近直接的一端，而巴西更偏向间接。", "power": "书面评审意见会丢失语气，而且 Daan 资历更深。来自上面的严厉措辞，分量更重。", "person": "Daan 对所有人都写得很简短，包括他的经理。Thiago 为了赶上这个 PR 加班到很晚。"}, "script": "Thiago，数据结构部分做得很扎实。有一个顾虑：这个 ORM 查询模式在高峰负载下会吃力。有十分钟一起看看方案吗？"}, {"id": 3, "dim": "沉默与轮流发言", "title": "四秒钟的沉默", "cities": ["伦敦", "东京"], "sit": [["Harry · 总监，伦敦", "下个月停用遗留数据结构，有人反对吗？"], ["Kenji · 架构师，东京", "（取消静音……停顿）"], ["Harry", "很好，沉默就是同意！进入第二项。"], ["三天后", "东京团队指出对遗留数据结构有一个关键依赖。"]], "aName": "Harry", "bName": "Kenji", "aRole": "Harry · 总监，伦敦", "bRole": "Kenji · 架构师，东京", "aBrief": "在视频会议上，沉默就是同意。如果几秒钟内没人反对，我们就继续。", "bBrief": "我正在用第二语言小心地组织反对意见，免得让任何人难堪。还没等我开口，他就继续了。", "lenses": {"culture": "在日本的商务场合中，常有人描述在反对上级之前会先停顿。但关于日常对话的研究发现，不同语言之间的话轮间隔其实相近（Stivers et al., 2009），所以不要假设这次停顿是“文化性的”。", "power": "Harry 主持会议，也是在场资历最深的人。在任何地方，当着别人的面实时反对主持人都很难。", "person": "Kenji 在用第二语言工作，当时是东京时间晚上 9 点，讨论的是一个需要精确措辞的技术问题。"}, "script": "我在这里停一下。Kenji，你准备好的时候，我很想听听东京对边界情况的看法。"}, {"id": 4, "dim": "信任与关系", "title": "冷冰冰的催促", "cities": ["慕尼黑", "墨西哥城"], "sit": [["Stefan · 项目经理，慕尼黑", "09:02 · “Carlos，现在就把 API 文档发过来。已经过截止日期了。”"], ["Carlos · 工程负责人，墨西哥城", "……"], ["Stefan · 第二天", "“收到我的消息了吗？为什么还没发？”"], ["Carlos", "“Hola Stefan。我们正在审阅。”"]], "aName": "Stefan", "bName": "Carlos", "aRole": "Stefan · 项目经理，慕尼黑", "bRole": "Carlos · 工程负责人，墨西哥城", "aBrief": "开门见山是尊重他的时间。截止日期就是截止日期。", "bBrief": "两条消息，没有问候，也没问我们怎么样。感觉我是一张工单，而不是一位同事。", "lenses": {"culture": "在 Meyer 的“信任”维度上，平均而言，德国偏向基于任务的信任（通过可靠的工作建立），墨西哥偏向基于关系的信任（通过个人联系建立）。", "power": "Stefan 在总部。Carlos 的团队常常是最后得知优先级变化的人，所以生硬的要求读起来就像命令。", "person": "Carlos 的团队整晚都在修复一次生产故障。Stefan 不知道，因为他没有问。"}, "script": "Hola Carlos，团队这周怎么样？听说挺忙的。我们什么时候可以比较现实地一起过一遍 API 文档？"}, {"id": 5, "dim": "解读“是”", "title": "意味着“也许”的“是”", "cities": ["悉尼", "河内"], "sit": [["Liam · 客户项目经理，悉尼", "你们能承诺 10 月 15 日吗？可能吗？"], ["Linh · 工程负责人，河内", "可以……我们会尽力。"], ["Liam · 10 月 16 日", "还没上线？你说了可以的！"], ["Linh", "我说的是我们会尽力。这个范围需要我们没有的服务。"]], "aName": "Liam", "bName": "Linh", "aRole": "Liam · 客户项目经理，悉尼", "bRole": "Linh · 工程负责人，河内", "aBrief": "“是”就是“是”。如果日期不可能，她就该说不。", "bBrief": "直接对客户说“不”非常难。“我们会尽力”，加上停顿，就是我的警告。", "lenses": {"culture": "在许多高语境环境中（越南是其中之一），人们可能会避免直接对客户说“不”，“我们会尽力”可能是真正的疑虑信号。不过，很多低语境的人也会用同样的话来含糊其辞。", "power": "Liam 掌握着 Linh 团队的预算。在任何地方，对付钱给你的人说不都很难。", "person": "Linh 刚刚升职，想证明自己能交付。"}, "script": "Linh，如果我们以 10 月 15 日为目标，有哪三件事必须完美进行？为了做到，你会做哪些取舍？"}, {"id": 6, "dim": "分歧", "title": "激烈的辩论", "cities": ["巴黎", "新加坡"], "sit": [["Camille · 设计负责人，巴黎", "我完全不同意这个用户旅程。它在逻辑上完全说不通！"], ["Jia Hui · 产品经理，新加坡", "（沉默下来；这个迭代剩下的时间里只回一两个字）"], ["Camille · 下班喝酒时", "来吗？刚才的辩论太棒了！"]], "aName": "Camille", "bName": "Jia Hui", "aRole": "Camille · 设计负责人，巴黎", "bRole": "Jia Hui · 产品经理，新加坡", "aBrief": "对想法激烈争论，说明我认真对待它们。这不是针对个人；之后我们还是朋友。", "bBrief": "当着团队的面被说我的工作“在逻辑上完全说不通”，感觉像是公开攻击。一杯酒抵消不了。", "lenses": {"culture": "在 Meyer 的“分歧”维度上，平均而言，法国偏向把公开对抗视为投入，而许多东南亚和东亚职场偏向避免公开对抗。", "power": "Camille 在总部，对区域晋升有非正式影响力，这提高了公开冲突的风险。", "person": "Jia Hui 一边照顾生病的父母，一边在这个旅程上花了两周时间。"}, "script": "Jia Hui，我们来看看两个旅程的不同之处。如果两个都测试，什么样的用户行为能告诉我们哪个更好？"}, {"id": 7, "dim": "时间与日程", "title": "有弹性的截止时间", "cities": ["苏黎世", "罗马"], "sit": [["Anna · 物流规划师，苏黎世", "我们的码头时段锁定在周五 09:00。你们的卡车周二 14:00 才到。"], ["Matteo · 运营负责人，罗马", "一个重要客户的工厂周四出了故障。我们调动所有人去修。我们救了他们，今天也送到了！"], ["Anna", "你们打乱了我们整个日程。"]], "aName": "Anna", "bName": "Matteo", "aRole": "Anna · 物流规划师，苏黎世", "bRole": "Matteo · 运营负责人，罗马", "aBrief": "如果时段是有弹性的，供应链就会崩溃。准时就是尊重。", "bBrief": "一个客户陷入了危机。为了保护一个内部时段而不顾真正的紧急情况，这不是服务。", "lenses": {"culture": "在 Meyer 的“日程”维度上，平均而言，瑞士接近线性时间的一端，意大利偏向灵活时间。", "power": "Anna 的工厂错过码头时段会被自动罚款；Matteo 的奖金与客户满意度挂钩。", "person": "Matteo 周日亲自开车去客户那里，确保修复有效。"}, "script": "Matteo，救下那个客户干得漂亮。这里的码头变更会波及另外三家工厂。危机发生时，我们能约定提前一小时预警，好让我们及时调整时段吗？"}, {"id": 8, "dim": "说服", "title": "“先讲为什么”的反推", "cities": ["纽约", "巴黎"], "sit": [["Jordan · 产品副总裁，纽约", "这是我们的新 CRM！三个案例研究显示成交率提高了 40%。周五前完成上线吧！"], ["Elodie · 国家负责人，巴黎", "等等。为什么是这家供应商？它的数据模型背后的逻辑是什么？"], ["Jordan · 私下", "为什么巴黎总想讲哲学？"]], "aName": "Jordan", "bName": "Elodie", "aRole": "Jordan · 产品副总裁，纽约", "bRole": "Elodie · 国家负责人，巴黎", "aBrief": "展示结果，跳过理论。人们想要的是有效的证据。", "bBrief": "如果逻辑有缺陷，那些案例研究就只是运气。先让我相信方法是可靠的。", "lenses": {"culture": "Meyer 的“说服”维度对比了原则优先的推理（常与法国联系在一起）和应用优先的推理（常与美国联系在一起）。两者都很严谨，只是起点不同。", "power": "这个决定来自纽约，欧洲几乎没有参与，所以“为什么？”也意味着“我们没被征求意见”。", "person": "Elodie 有工程背景，经历过一次失败的 CRM 迁移。"}, "script": "Elodie，在演示之前，我先花五分钟讲讲为什么我们选择这个数据模型而不是其他方案，然后再看结果。我很想听听你对评估的看法。"}], "es": [{"id": 1, "dim": "Malas noticias y jerarquía", "title": "El bloqueo que desapareció", "cities": ["San Francisco", "Bengaluru"], "sit": [["Alex · Manager de ingeniería, San Francisco", "Mañana lanzamos el servicio de autenticación. ¿Algún bloqueo?"], ["Rohan · Tech lead, Bengaluru (equipo proveedor)", "El equipo está analizando activamente los flujos de datos. Todo bien por nuestra parte."], ["Alex · al día siguiente", "¡La build se ha roto por una dependencia de un esquema antiguo! ¿Por qué no se avisó ayer?"], ["Rohan", "Trabajamos toda la noche para arreglarlo sin alarmar a vuestra dirección."]], "aName": "Alex", "bName": "Rohan", "aRole": "Alex · Manager de ingeniería, San Francisco", "bRole": "Rohan · Tech lead, Bengaluru (equipo proveedor)", "aBrief": "Pregunté directamente por bloqueos. Avisar pronto de los riesgos es el trabajo; las malas noticias pronto son buenas noticias.", "bBrief": "Señalar un bloqueo en un canal abierto, ante el manager del cliente, era como fallar en público. «Analizando activamente» era mi señal de que algo iba mal.", "lenses": {"culture": "El Culture Map de Erin Meyer sitúa a India hacia el extremo jerárquico de su escala de «Liderar» y a EE. UU. hacia el igualitario, de media. Llevar un problema sin resolver a alguien de más rango puede sentirse como faltar al deber.", "power": "Rohan trabaja para un proveedor. Admitir un bloqueo ante el manager del cliente puede sentirse como arriesgar el contrato, en cualquier país.", "person": "Rohan está orgulloso del oficio de su equipo y no quería que culparan a sus ingenieros júnior."}, "script": "Rohan, parte de mi trabajo es quitar de en medio lo que tu equipo no controla. ¿Qué dependencia puedo desbloquear por ti esta semana?"}, {"id": 2, "dim": "Feedback y tono", "title": "La revisión de código sin filtro", "cities": ["Ámsterdam", "São Paulo"], "sit": [["Daan · Staff engineer, Ámsterdam", "Revisión del PR: «Esta implementación es inaceptable. Descarta el patrón ORM y reescríbelo»."], ["Thiago · Desarrollador sénior, São Paulo", "Recibido."], ["Daan · esa misma semana, más tarde", "¿Por qué Thiago no ha vuelto a decir nada en ninguna revisión?"]], "aName": "Daan", "bName": "Thiago", "aRole": "Daan · Staff engineer, Ámsterdam", "bRole": "Thiago · Desarrollador sénior, São Paulo", "aBrief": "El código no es una persona. Ser claro ahorra horas de idas y venidas a todos.", "bBrief": "Ni una palabra sobre lo que funcionaba, en un PR público, con «inaceptable». Así no se trata a un compañero al que respetas.", "lenses": {"culture": "En la escala de «Evaluar» de Meyer, Países Bajos está cerca del extremo directo para el feedback negativo, mientras que Brasil está más hacia el indirecto, de media.", "power": "Los comentarios escritos pierden el tono, y Daan tiene más antigüedad. Las palabras duras desde arriba pesan más.", "person": "Daan escribe de forma escueta a todo el mundo, incluido su manager. Thiago se había quedado hasta tarde para entregar este PR."}, "script": "Thiago, el trabajo del esquema es sólido. Una duda: el patrón de consultas ORM sufrirá en los picos de carga. ¿Tienes diez minutos para ver opciones juntos?"}, {"id": 3, "dim": "Silencio y turnos de palabra", "title": "El silencio de cuatro segundos", "cities": ["Londres", "Tokio"], "sit": [["Harry · Director, Londres", "¿Alguna objeción a retirar el esquema antiguo el mes que viene?"], ["Kenji · Arquitecto, Tokio", "(activa el micro… hace una pausa)"], ["Harry", "¡Genial, quien calla otorga! Siguiente punto."], ["Tres días después", "El equipo de Tokio avisa de una dependencia crítica del esquema antiguo."]], "aName": "Harry", "bName": "Kenji", "aRole": "Harry · Director, Londres", "bRole": "Kenji · Arquitecto, Tokio", "aBrief": "En una videollamada, el silencio es acuerdo. Si nadie objeta en un par de segundos, seguimos.", "bBrief": "Estaba formulando un desacuerdo en mi segundo idioma, con cuidado, para no avergonzar a nadie. Siguió antes de que pudiera hablar.", "lenses": {"culture": "A menudo se describe que en entornos de negocio japoneses se hace una pausa antes de discrepar de alguien de más rango. Pero la investigación sobre la conversación cotidiana encuentra pausas entre turnos similares en todos los idiomas (Stivers et al., 2009), así que no des por hecho que la pausa era «cultural».", "power": "Harry preside la llamada y es la persona de más rango. Objetar al que preside, en directo y delante de otros, es difícil en cualquier sitio.", "person": "Kenji trabajaba en su segundo idioma, a las 21:00 hora de Tokio, sobre un punto técnico que exigía palabras precisas."}, "script": "Voy a hacer una pausa aquí. Kenji, cuando estés listo, me encantaría oír la visión de Tokio sobre los casos límite."}, {"id": 4, "dim": "Confianza y relaciones", "title": "El mensaje en frío", "cities": ["Múnich", "Ciudad de México"], "sit": [["Stefan · Project manager, Múnich", "09:02 · «Carlos, envía ya la documentación de la API. Vamos tarde.»"], ["Carlos · Líder de ingeniería, Ciudad de México", "…"], ["Stefan · al día siguiente", "«¿Recibiste mi mensaje? ¿Por qué no la has enviado?»"], ["Carlos", "«Hola Stefan. La estamos revisando.»"]], "aName": "Stefan", "bName": "Carlos", "aRole": "Stefan · Project manager, Múnich", "bRole": "Carlos · Líder de ingeniería, Ciudad de México", "aBrief": "Ir al grano respeta su tiempo. Un plazo es un plazo.", "bBrief": "Dos mensajes, sin un hola, sin preguntar cómo estamos. Siento que soy un ticket, no un compañero.", "lenses": {"culture": "La escala de «Confiar» de Meyer sitúa a Alemania hacia const timer = {
  total: 90, left: 90, running: false, raf: 0, last: 0, onEnd: null, ended: false,

      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="toMode">← ${esc(t.backBtn)}</button><button class="btn pri" data-act="toSituation" data-focus>${esc(t.next)} →</button></div>
    </section>`; break;

  case "situation":
    h = `<section class="screen">
      <span class="kicker">${esc(sc.corridor ? t.fromAtlas + " · " + sc.dim : t.sitKicker)}${S.mode === 2 ? " · " + esc(S.code) : ""}</span>
      <h2>${esc(sc.title)}</h2>
      ${Array.isArray(sc.sit) ? `<div class="card" style="display:grid;gap:12px;padding:18px">${sc.sit.map(m => `<div><span style="display:block;font-family:var(--mono);font-size:11px;color:var(--muted)">${esc(m[0])}</span><span style="font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.35">${/^[“"]/.test(m[1]) ? esc(m[1]) : "“" + esc(m[1]) + "”"}</span></div>`).join("")}</div>` : `<div class="prompt" style="min-height:0"><div class="q" style="font-size:clamp(19px,5vw,23px)">${esc(sc.sit)}</div></div>`}
      <div class="roles">
        <div class="role ${S.mode === 2 && myRole() === 0 ? "speak" : ""}"><div class="k">A${sc.a.role ? " · " + esc(sc.a.role.split(" · ").slice(1).join(" · ")) : ""}</div><div class="n">${esc(cap(sc.a.r))}</div></div>
        <div class="role ${S.mode === 2 && myRole() === 1 ? "speak" : ""}"><div class="k">B${sc.b.role ? " · " + esc(sc.b.role.split(" · ").slice(1).join(" · ")) : ""}</div><div class="n">${esc(cap(sc.b.r))}</div></div>
      </div>
      <div class="tip"><i>◎</i><span><b>${esc(t.goalLbl)}</b>${esc(sc.goal)}</span></div>
      <div class="spacer"></div>
      <div class="btns">
        ${S.mode === 1 && !S.swapped && S.fixed == null ? `<button class="btn" data-act="another">↻ ${esc(t.another)}</button>` : ""}
        <button class="btn pri" data-act="toBrief" data-focus>${esc(t.readBriefs)} →</button>
      </div>
    </section>`; break;

  case "pass0": case "pass1": {
    const i = S.screen === "pass0" ? 0 : 1, r = roleObj(i).r;
    h = `<section class="screen">${curtainHTML(fmt(t.passTo, { r: rn(r) }), fmt(t.passLead, { r: rn(r) }), fmt(t.ready, { r: rn(r) }), i === 0 ? "toBrief0" : "toBrief1")}</section>`; break; }

  case "brief0": case "brief1": case "brief": {
    const i = S.screen === "brief" ? myRole() : S.screen === "brief0" ? 0 : 1, r = roleObj(i).r;
    const nextAct = S.screen === "brief0" ? "toPass1" : "toTalk";
    h = `<section class="screen">
      ${briefHTML(i, { dark: true, kicker: fmt(t.briefKicker, { r: rn(r) }), title: esc(t.briefTitle) })}
      <p style="margin:0;font-size:13.5px;color:var(--muted)">${esc(t.briefNote)}</p>
      <div class="tip"><i>◎</i><span><b>${esc(t.goalLbl)}</b>${esc(sc.goal)}</span></div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="${nextAct}" data-focus>${esc(t.hide)} →</button></div>
    </section>`; break; }

  case "talk":
    h = `<section class="screen">
      <h2>${esc(t.talkTitle)}</h2>
      <p class="lead">${esc(t.talkLead)}</p>
      <div class="tip"><i>◎</i><span><b>${esc(t.goalLbl)}</b>${esc(sc.goal)}</span></div>
      <div class="timer" id="timer" style="width:min(56vw,210px)">${ringSVG()}<div class="num"><div><b id="tnum">5:00</b><small id="tlbl"></small></div></div></div>
      <div class="tip" id="ltip"><i>✦</i><span>${esc(t.talkTips[S.tipIdx % t.talkTips.length])}</span></div>
      <div class="spacer"></div>
      <div class="btns">
        <button class="btn" data-act="pause" id="pauseBtn">${esc(timer.running || timer.ended ? t.pause : t.resume)}</button>
        <button class="btn pri" data-act="toOutcome" data-focus>${esc(t.reached)} →</button>
      </div>
    </section>`; break;

  case "outcome":
    h = `<section class="screen">
      <h2>${esc(t.outcomeTitle)}</h2>
      <div class="heard">${t.outcomes.map((o, i) => `<button data-out="${i}" ${i === 0 ? "data-focus" : ""}><span class="e">${OUT_ICONS[i]}</span><span><b>${esc(o[0])}</b><small>${esc(o[1])}</small></span></button>`).join("")}</div>
      <p style="margin:0;font-size:13.5px;color:var(--muted)">${esc(t.outcomeNote)}</p>
    </section>`; break;

  case "reveal":
    h = `<section class="screen">
      <span class="kicker" style="color:var(--accent-ink)">${esc(t.revealKicker)} · ${esc(sc.dim)}</span>
      <h2>${esc(t.revealTitle)}</h2>
      <div style="display:grid;gap:10px">${briefHTML(0, { dark: myRole() === 0 && S.mode === 2, kicker: "A · " + esc(cap(sc.a.r)) })}${briefHTML(1, { dark: myRole() === 1 && S.mode === 2, kicker: "B · " + esc(cap(sc.b.r)) })}</div>
      ${sc.lenses ? `<div class="monday"><b>${esc(t.lensLbl)}</b><div style="display:grid;gap:8px;margin-top:6px">${["culture", "power", "person"].map(k => `<div><span style="font-family:var(--mono);font-size:11px;color:var(--muted)">${esc(t.lensNames[k])}</span><br>${esc(sc.lenses[k])}</div>`).join("")}</div></div>
      <div class="card" style="background:var(--inkbg,var(--ink));color:#fff;border-color:var(--inkbd,var(--ink))"><span class="kicker" style="color:rgba(255,255,255,.55)">${esc(t.lineLbl)}</span><p style="margin:6px 0 0;font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.35">“${esc(sc.script)}”</p></div>` : `<div class="monday"><b>${esc(t.diffLbl)}</b>${esc(sc.diff)}</div>`}
      <p style="margin:0;font-size:12.5px;color:var(--muted)">${esc(t.dimNote)}</p>
      <div><span class="kicker">${esc(t.reflectLbl)}</span>
        <ol style="margin:10px 0 0;padding-left:20px;display:grid;gap:8px;font-size:15px;line-height:1.5">${t.reflect.map(q => `<li>${esc(q)}</li>`).join("")}</ol></div>
      <div class="spacer"></div>
      <div class="btns">
        ${S.rounds < 1 ? `<button class="btn" data-act="toSwap">⇄ ${esc(t.swapBtn)}</button>` : ""}
        <button class="btn pri" data-act="toEnd" ${S.rounds >= 1 ? "data-focus" : ""}>${esc(t.finish)} →</button>
      </div>
    </section>`; break;

  case "swap":
    h = `<section class="screen">${curtainHTML(esc(t.swapTitle), fmt(t.swapLead, { a: rn(sc.a.r), b: rn(sc.b.r) }) + (S.mode === 2 ? "<br><br>" + esc(t.swap2) : ""), esc(t.swapGo), "afterSwap")}</section>`; break;

  case "end":
    h = `<section class="screen">
      <span class="kicker" style="color:var(--good)">✓ ${esc(t.endKicker)}</span>
      <h2>${esc(t.endTitle)}</h2>
      <p class="serif">${esc(t.endLead)}</p>
      <div class="monday"><b>${esc(t.monday)}</b>${esc(t.mondayTxt)}</div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="again">↻ ${esc(t.again)}</button><button class="btn pri" data-act="teach" data-focus>${esc(t.passOn)} →</button></div>
    </section>`; break;

  case "teach": h = teachHTML("swap"); break;
  }
  const hadFocus = stage.contains(document.activeElement);
  stage.innerHTML = h;
  const f = stage.querySelector("[data-focus]");
  if (f && hadFocus) f.focus({ preventScroll: true });
}

const svgI = p => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#17171A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const PHONE1 = svgI('<rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2" stroke="#E2553F"/>');
const PHONE2 = svgI('<rect x="2.5" y="5" width="8" height="15" rx="2"/><rect x="13.5" y="5" width="8" height="15" rx="2"/><path d="M8.5 2.5c2-1.3 5-1.3 7 0" stroke="#E2553F"/>');
const OUT_ICONS = [
  '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="var(--good)"/></svg>',
  '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.25" fill="none" stroke="var(--ink)" stroke-width="1.5"/><path d="M11 2.75a8.25 8.25 0 0 1 0 16.5z" fill="var(--ink)"/></svg>',
  '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.25" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/></svg>'
];

function teachHTML(demo) {
  const t = T(), chain = store.get("fb_teachback", []).filter(c => c.demo === demo);
  return `<section class="screen">
    <span class="kicker" style="color:var(--accent-ink)">${esc(t.teachKicker)}</span>
    <h2>${esc(t.teachTitle)}</h2>
    <p class="lead">${esc(t.teachLead)}</p>
    <div class="steps3">${t.t3.map((s, i) => `<div><b>0${i + 1}</b><span>${esc(s)}</span><small style="display:block;font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4">${esc(t.t3sub[i])}</small></div>`).join("")}</div>
    <div class="card" style="display:grid;gap:12px">
      <label class="field"><span>${esc(t.learnerName)}</span><input id="lName" maxlength="30" autocomplete="off" placeholder="${esc(t.learnerPh)}"></label>
      <label class="field"><span>${esc(t.learned)}</span><textarea id="lText" maxlength="280" placeholder="${esc(t.learnedPh)}"></textarea></label>
      <button class="btn pri" data-act="saveTeach" style="flex:none">${esc(t.save)}</button>
    </div>
    <div><span class="kicker">${esc(t.chainTitle)}</span>
      <ul class="chain" style="margin-top:10px">${chain.length ? chain.slice().reverse().map(c => `<li>${esc(c.text)}<small>${c.name ? esc(c.name) + " · " : ""}${esc(new Date(c.at).toLocaleDateString(lang === "zh" ? "zh-CN" : lang))}</small></li>`).join("") : `<li style="color:var(--muted)">${esc(t.chainEmpty)}</li>`}</ul></div>
    <a class="link" href="/free_builder/teachback">⊂⊃ ${esc(lang === "zh" ? "教回去链条 ↗" : lang === "es" ? "Cadena de Enseñar de Vuelta ↗" : "Teach-Back Chain ↗")}</a>
    <button class="link" data-act="restart">${esc(t.restart)}</button>
  </section>`;
}

function startTalk() {
  timer.start(300, () => toast(T().timeUp));
  const pb = $("pauseBtn"); if (pb) pb.textContent = T().pause;
  const tips = setInterval(() => {
    if (S.screen !== "talk") { clearInterval(tips); return; }
    S.tipIdx++; const el = $("ltip"); if (el) el.querySelector("span").textContent = T().talkTips[S.tipIdx % T().talkTips.length];
  }, 25000);
}

function reset(full) {
  Object.assign(S, { swapped: false, outcome: null, rounds: 0, tipIdx: 0 });
  if (full) { S.code = newCode(); pickFromCode(); }
}

$("stage").addEventListener("input", e => {
  if (e.target.id !== "codeIn") return;
  const v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (v !== e.target.value) e.target.value = v;
  if (v.length === 6) { S.code = v; pickFromCode(); const c = $("codeShow"); if (c) c.textContent = v; render(); toast("✓ " + v); }
});
$("stage").addEventListener("click", e => {
  sound.init();
  const m = e.target.closest("[data-mode]"), r = e.target.closest("[data-role]"), o = e.target.closest("[data-out]"), a = e.target.closest("[data-act]");
  if (m) { sound.tap(); S.mode = +m.dataset.mode; reset(true); go(S.mode === 2 ? "code" : "situation"); return; }
  if (r) { sound.tap(); S.role = +r.dataset.role; render(); return; }
  if (o) { sound.warm(); S.outcome = +o.dataset.out; go("reveal"); return; }
  if (!a) return;
  const k = a.dataset.act; sound.tap();
  switch (k) {
    case "toIntro": go("intro"); break;
    case "toMode": go("mode"); break;
    case "newCode": S.code = newCode(); pickFromCode(); render(); break;
    case "toSituation": go("situation"); break;
    case "another": { const prev = S.sc; let g = 0; do { S.code = newCode(); pickFromCode(); g++; } while (S.sc === prev && g < 40); render(); break; }
    case "toBrief": go(S.mode === 2 ? "brief" : "pass0"); break;
    case "toBrief0": go("brief0"); break;
    case "toPass1": go("pass1"); break;
    case "toBrief1": go("brief1"); break;
    case "toTalk": go("talk"); break;
    case "pause":
      if (timer.ended) return;
      if (timer.running) { timer.pause(); a.textContent = T().resume; } else { timer.resume(); a.textContent = T().pause; }
      break;
    case "toOutcome": timer.stop(); go("outcome"); break;
    case "toSwap": go("swap"); break;
    case "afterSwap": S.swapped = !S.swapped; S.rounds++; S.outcome = null; go(S.mode === 2 ? "brief" : "pass0"); break;
    case "toEnd": sound.warm(); go("end"); break;
    case "again": S.fixed = null; reset(true); go(S.mode === 2 ? "code" : "situation"); break;
    case "teach": go("teach"); break;
    case "saveTeach": {
      const text = ($("lText").value || "").trim(), name = ($("lName").value || "").trim();
      if (!text) { $("lText").focus(); return; }
      const chain = store.get("fb_teachback", []); chain.push({ demo: "swap", text, name, at: Date.now() }); store.set("fb_teachback", chain.slice(-50));
      sound.warm(); toast(T().saved); render(); break; }
    case "restart": reset(true); go("intro"); break;
  }
});

window.__app = { S, go, render, timer, pickFromCode, SCEN };

/* ---------- facilitator guide ---------- */
const drawer = $("drawer");
function openGuide() {
  const t = T();
  $("panel").innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
      <div><span class="kicker">${esc(t.gKicker)}</span><h3 id="g-title">${esc(t.gTitle)}</h3></div>
      <button class="x" data-close aria-label="${esc(t.close)}">✕</button>
    </div>
    <h4>${esc(t.gWhy)}</h4><p>${esc(t.gWhyTxt)}</p>
    <h4>${esc(t.gSteps)}</h4><ol>${t.gStepList.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    <h4>${esc(t.gDebrief)}</h4><ul>${t.gDebriefList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    <h4>${esc(t.gNotes)}</h4><ul>${t.gNotesList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`;
  drawer.classList.add("show");
  setTimeout(() => drawer.querySelector("[data-close]").focus({ preventScroll: true }), 60);
}
function closeGuide() { drawer.classList.remove("show"); $("btn-guide").focus({ preventScroll: true }); }
drawer.addEventListener("click", e => { if (e.target === drawer || e.target.closest("[data-close]")) closeGuide(); });
$("btn-guide").addEventListener("click", openGuide);
window.addEventListener("keydown", e => { if (e.key === "Escape" && drawer.classList.contains("show")) closeGuide(); });

/* ---------- language + sound ---------- */
function paintSound() {
  const b = $("btn-sound"), t = T();
  b.innerHTML = sound.muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
  b.setAttribute("aria-label", sound.muted ? t.soundOff : t.soundOn); b.title = b.getAttribute("aria-label");
}
$("btn-sound").addEventListener("click", () => { sound.muted = !sound.muted; store.set("fb_muted", sound.muted); sound.init(); paintSound(); if (!sound.muted) sound.tap(); });

function applyLang(l) {
  lang = LANGS.includes(l) ? l : "en";
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.title = T().title;
  $("lang-lbl").textContent = LANG_LBL[lang];
  $("btn-guide").setAttribute("aria-label", T().guide); drawer.setAttribute("aria-label", T().guide);
  document.querySelectorAll("[data-t]").forEach(el => { const v = T()[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  paintSound();
  render();               // the clock object survives a re-render
  timer.paint();
  const pb = $("pauseBtn"); if (pb && !timer.running && !timer.ended) pb.textContent = T().resume;
  if (drawer.classList.contains("show")) openGuide();
  try { localStorage.setItem("wm_preferred_lang", lang); localStorage.setItem("wm_cases_lang", lang); } catch (e) {}
}
$("btn-lang").addEventListener("click", () => applyLang(LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]));

/* ---------- boot ---------- */
let saved = null;
try { saved = localStorage.getItem("wm_preferred_lang") || localStorage.getItem("wm_cases_lang"); } catch (e) {}
const nav = (navigator.language || "").toLowerCase();
applyLang(LANGS.includes(saved) ? saved : nav.startsWith("zh") ? "zh" : nav.startsWith("es") ? "es" : "en");
document.addEventListener("visibilitychange", () => { if (!document.hidden && timer.running) keepAwake(true); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/free_builder/sw.js", { scope: "/free_builder/" }).catch(() => {}); // offline cache
})();
</script>
</body>
</html>
