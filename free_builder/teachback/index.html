/* Seeded random + pairing codes: the same code on two phones gives the same scenario, no server needed. */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function newCode(n = 6) { let s = ""; for (let i = 0; i < n; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }

const sound = {
  ctx: null, muted: store.get("fb_muted", false),
  init() { if (!this.ctx) { const A = window.AudioContext || window.webkitAudioContext; if (A) this.ctx = new A(); } if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  tone(f, d = .3, g = .06, type = "sine", at = 0) {

    try { const t = this.ctx.currentTime + at, o = this.ctx.createOscillator(), a = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); a.gain.setValueAtTime(.0001, t); a.gain.linearRampToValueAtTime(g, t + .02); a.gain.exponentialRampToValueAtTime(.0001, t + d);

  },
  tap() { this.tone(520, .12, .04, "triangle"); },

};

/* Keep the screen awake while a timer runs (where supported) */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

/* Timer ring */
function ringSVG() {
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="54" fill="none" stroke-width="6"/><circle class="fg" id="ring" cx="60" cy="60" r="54" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="0"/></svg>`;
}
const timer = {
  total: 90, left: 90, running: false, raf: 0, last: 0, onEnd: null, ended: false,
  start(total, onEnd) { this.stop(); this.total = this.left = total; this.onEnd = onEnd; this.ended = false; this.resume(); },
  resume() { if (this.running || this.ended) return; this.running = true; this.last = performance.now(); keepAwake(true); this.tick(); },
  pause() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); this.paint(); },
  stop() { this.running = false; cancelAnimationFrame(this.raf); keepAwake(false); },
  tick() {
    if (!this.running) return;
    const now = performance.now(); this.left = Math.max(0, this.left - (now - this.last) / 1000); this.last = now;
    this.paint();
    if (this.left <= 0) { this.running = false; this.ended = true; keepAwake(false); sound.chime(); buzz([60, 80, 60]); this.onEnd && this.onEnd(); return; }
    this.raf = requestAnimationFrame(() => this.tick());
  },
  paint() {
    const ring = $("ring"), num = $("tnum"), lbl = $("tlbl"), wrap = $("timer");
    if (!ring) return;
    ring.setAttribute("stroke-dashoffset", String(339.29 * (1 - this.left / this.total)));
    const s = Math.ceil(this.left);
    num.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    lbl.textContent = this.ended ? "" : (this.running ? T().left : T().paused);
    wrap.classList.toggle("done", this.ended);
  }
};

/* Toast */
let toastT;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2600); }

   ===================================================================== */
const S = { screen: "chain", demo: null, other: "", points: ["", "", ""], teacher: store.get("fb_tb_teacher", ""), learner: "", back: "", clearArmed: false, fresh: null, tipIdx: 0 };
const FLOW = ["what", "prep", "teach", "back", "add"];
const chain = () => store.get("fb_teachback", []).filter(c => c && c.text);
const demoName = k => T().demos[k] || T().demos.other;

function go(screen) {
  if (screen !== "teach") timer.stop();
  S.screen = screen; S.clearArmed = false; render(); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  if (screen === "teach") startTeach();
}
function paintStepsBar() {
  const at = FLOW.indexOf(S.screen === "pass" ? "back" : S.screen);
  $("steps").innerHTML = at < 0 ? "" : FLOW.map((_, i) => `<span class="${i < at ? "done" : i === at ? "now" : ""}"></span>`).join("");
}

/* the chain itself: one ring per link, coloured by what was taught */
function chainSVG(items) {
  const per = 11, n = Math.max(items.length, 1), rows = Math.ceil(n / per), rh = 40, w = 320, h = rows * rh + 6;
  let g = "";
  items.forEach((c, i) => {
    const r = Math.floor(i / per), k = i % per, col = r % 2 ? per - 1 - k : k;
    const x = 24 + col * 27, y = 23 + r * rh, odd = i % 2 === 1, isNew = S.fresh && c.at === S.fresh;
    const stroke = DEMO_COLOR[c.demo] || DEMO_COLOR.other;
    // even links lie flat, odd links stand narrow, so neighbours read as interlocked
    g += `<ellipse cx="${x}" cy="${y}" rx="${odd ? 15 : 17}" ry="${odd ? 7 : 12}" fill="none" stroke="${stroke}" stroke-width="${isNew ? 5 : 4}">${isNew && !reduceMotion ? `<animate attributeName="stroke-width" values="9;5" dur=".7s"/>` : ""}</ellipse>`;
  });
  if (!items.length) g = `<ellipse cx="160" cy="23" rx="17" ry="12" fill="none" stroke="#E5E2DA" stroke-width="4" stroke-dasharray="5 5"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" role="img" aria-label="${esc(items.length === 1 ? T().link1 : fmt(T().links, { n: items.length }))}">${g}</svg>`;
}

function render() {
  const t = T(), stage = $("stage");
  paintStepsBar();
  let h = "";
  switch (S.screen) {
  case "chain": {
    const items = chain(), people = new Set(items.map(c => (c.name || "").trim().toLowerCase()).filter(Boolean)).size;
    const by = {}; items.forEach(c => { by[c.demo] = (by[c.demo] || 0) + 1; });
    h = `<section class="screen">
      <span class="kicker">${t.introKicker}</span><h1>${t.introTitle}</h1>
      <p class="lead">${esc(t.introLead)}</p>
      <div class="card" style="display:grid;gap:14px">
        <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill" style="color:var(--ink)">${esc(items.length === 1 ? t.link1 : fmt(t.links, { n: items.length }))}</span>${people ? `<span class="pill">${esc(people === 1 ? t.person1 : fmt(t.people, { n: people }))}</span>` : ""}
          ${Object.keys(by).map(k => `<span class="pill" style="display:inline-flex;gap:6px;align-items:center"><i style="width:8px;height:8px;border-radius:50%;background:${DEMO_COLOR[k] || DEMO_COLOR.other}"></i>${esc(demoName(k))} · ${by[k]}</span>`).join("")}</div>
        ${chainSVG(items)}
        ${items.length ? "" : `<p style="margin:0;font-size:14px;color:var(--muted)">${esc(t.empty)}</p>`}
      </div>
      ${items.length ? `<ul class="chain">${items.slice().reverse().slice(0, 30).map(c => `<li style="border-left:3px solid ${DEMO_COLOR[c.demo] || DEMO_COLOR.other}">${esc(c.text)}<small>${c.name ? esc(c.name) + " · " : ""}${esc(demoName(c.demo))} · ${esc(new Date(c.at).toLocaleDateString(lang === "zh" ? "zh-CN" : lang))}</small></li>`).join("")}</ul>` : ""}
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="toWhat" data-focus>${esc(t.teachNow)} →</button></div>
      ${items.length ? `<div class="btns"><button class="btn" data-act="copy">⧉ ${esc(t.copyChain)}</button><button class="btn" data-act="clear" style="color:var(--muted)">${esc(t.clear)}</button></div>` : ""}
    </section>`; break; }

  case "what":
    h = `<section class="screen">
      <h2>${esc(t.whatTitle)}</h2><p class="lead">${esc(t.whatLead)}</p>
      <div class="seg" role="group">${DEMO_KEYS.map(k => `<button type="button" data-demo="${k}" aria-pressed="${S.demo === k}" style="display:inline-flex;gap:7px;align-items:center"><i style="width:8px;height:8px;border-radius:50%;background:${DEMO_COLOR[k]}"></i>${esc(k === "other" ? t.other : demoName(k))}</button>`).join("")}</div>
      ${S.demo === "other" ? `<label class="field"><span>${esc(t.other)}</span><input id="otherIn" maxlength="60" autocomplete="off" placeholder="${esc(t.otherPh)}" value="${esc(S.other)}"></label>` : ""}
      <div class="row2">
        <label class="field"><span>${esc(t.teacherLbl)}</span><input id="teacherIn" maxlength="24" autocomplete="off" placeholder="${esc(t.teacherPh)}" value="${esc(S.teacher)}"></label>
        <label class="field"><span>${esc(t.learnerLbl)}</span><input id="learnerIn" maxlength="24" autocomplete="off" placeholder="${esc(t.learnerPh)}" value="${esc(S.learner)}"></label>
      </div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="toChain">← ${esc(t.backBtn)}</button><button class="btn pri" data-act="toPrep" id="nextBtn" ${canPrep() ? "" : "disabled"}>${esc(t.next)} →</button></div>
    </section>`; break;

  case "prep": {
    const hints = DEMO_HINTS[lang][S.demo] || DEMO_HINTS[lang].other;
    h = `<section class="screen">
      <span class="kicker">${esc(S.demo === "other" ? S.other : demoName(S.demo))}</span>
      <h2>${esc(t.prepTitle)}</h2><p class="lead">${esc(t.prepLead)}</p>
      ${[0, 1, 2].map(i => `<label class="field"><span>0${i + 1}</span><input data-pt="${i}" maxlength="80" autocomplete="off" placeholder="${esc(hints[i] || t.pointPh[i])}" value="${esc(S.points[i])}"></label>`).join("")}
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="toWhat">← ${esc(t.backBtn)}</button><button class="btn pri" data-act="toTeach" data-focus>${esc(t.next)} →</button></div>
    </section>`; break; }

  case "teach": {
    const hints = DEMO_HINTS[lang][S.demo] || DEMO_HINTS[lang].other;
    const pts = S.points.map((p, i) => p.trim() || hints[i]).filter(Boolean);
    h = `<section class="screen">
      <h2>${fmt(t.teachTitle, { n: S.teacher.trim() })}</h2>
      <p class="lead">${esc(t.teachLead)}</p>
      ${pts.length ? `<div class="stems">${pts.map((p, i) => `<div><b style="font-family:var(--mono);color:var(--accent-ink);font-weight:400;margin-right:8px">0${i + 1}</b>${esc(p)}</div>`).join("")}</div>` : ""}
      <div class="timer" id="timer" style="width:min(48vw,180px)">${ringSVG()}<div class="num"><div><b id="tnum">2:00</b><small id="tlbl"></small></div></div></div>
      <div class="tip" id="ltip"><i>✦</i><span>${esc(t.teachTips[S.tipIdx % t.teachTips.length])}</span></div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="pause" id="pauseBtn">${esc(timer.running || timer.ended ? t.pause : t.resume)}</button><button class="btn pri" data-act="toPass" data-focus>${esc(t.done)} →</button></div>
    </section>`; break; }

  case "pass":
    h = `<section class="screen">${curtainHTML(fmt(t.passTitle, { l: S.learner.trim() }), esc(t.passLead), fmt(t.passGo, { l: S.learner.trim() }), "toBack")}</section>`; break;

  case "back":
    h = `<section class="screen">
      <h2>${fmt(t.backTitle, { l: S.learner.trim() })}</h2>
      <p class="lead">${esc(t.backLead)}</p>
      <label class="field"><textarea id="backIn" maxlength="280" placeholder="${esc(t.backPh)}" style="min-height:140px">${esc(S.back)}</textarea></label>
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="toAdd" id="nextBtn" ${S.back.trim().length > 3 ? "" : "disabled"}>${esc(t.next)} →</button></div>
    </section>`; break;

  case "add":
    h = `<section class="screen">
      <h2>${esc(t.addTitle)}</h2>
      <p class="lead">${fmt(t.addLead, { t: S.teacher.trim(), l: S.learner.trim() })}</p>
      <div class="prompt" style="min-height:0"><div class="q" style="font-size:21px">“${esc(S.back.trim())}”</div><div class="meta"><span>${esc(S.learner.trim())}</span><span>${esc(S.demo === "other" ? S.other : demoName(S.demo))}</span></div></div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn pri" data-act="save" data-focus>⊂⊃ ${esc(t.save)}</button></div>
    </section>`; break;

  case "link":
    h = `<section class="screen">
      <span class="kicker" style="color:var(--good)">✓ ${esc(t.linkKicker)}</span>
      <h2>${fmt(t.linkTitle, { l: S.learner.trim() })}</h2>
      <div class="card">${chainSVG(chain())}</div>
      <p class="serif">${fmt(t.linkLead, { l: S.learner.trim() })}</p>
      <div class="monday"><b>${esc(t.monday)}</b>${esc(t.mondayTxt)}</div>
      <div class="spacer"></div>
      <div class="btns"><button class="btn" data-act="toWhatAgain">↻ ${esc(t.again)}</button><button class="btn pri" data-act="toChain" data-focus>${esc(t.seeChain)} →</button></div>
    </section>`; break;
  }
  const hadFocus = stage.contains(document.activeElement);
  stage.innerHTML = h;
  const f = stage.querySelector("[data-focus]");
  if (f && hadFocus) f.focus({ preventScroll: true });
}

function canPrep() { return S.demo && S.learner.trim() && S.teacher.trim() && (S.demo !== "other" || S.other.trim()); }

function startTeach() {
  timer.start(120, () => toast(T().teachTips[0]));
  const pb = $("pauseBtn"); if (pb) pb.textContent = T().pause;
  const iv = setInterval(() => {
    if (S.screen !== "teach") { clearInterval(iv); return; }
    S.tipIdx++; const el = $("ltip"); if (el) el.querySelector("span").textContent = T().teachTips[S.tipIdx % T().teachTips.length];
  }, 25000);
}

function chainText() {
  const t = T(), items = chain();
  return [`FREE//BUILDER — ${t.product}`, items.length === 1 ? t.link1 : fmt(t.links, { n: items.length }), "",
    ...items.map(c => `⊂⊃ ${demoName(c.demo)}${c.name ? " · " + c.name : ""}: ${c.text}`), "", "wei-meng.org/free_builder/teachback"].join("\n");
}

$("stage").addEventListener("input", e => {
  const el = e.target, nb = $("nextBtn");
  if (el.id === "otherIn") { S.other = el.value; if (nb) nb.disabled = !canPrep(); }
  if (el.id === "teacherIn") { S.teacher = el.value; store.set("fb_tb_teacher", el.value); if (nb) nb.disabled = !canPrep(); }
  if (el.id === "learnerIn") { S.learner = el.value; if (nb) nb.disabled = !canPrep(); }
  if (el.dataset.pt) S.points[+el.dataset.pt] = el.value;
  if (el.id === "backIn") { S.back = el.value; if (nb) nb.disabled = !(el.value.trim().length > 3); }
});
$("stage").addEventListener("click", e => {
  sound.init();
  const d = e.target.closest("[data-demo]"), a = e.target.closest("[data-act]");
  if (d) { sound.tap(); S.demo = d.dataset.demo; render(); if (S.demo === "other") { const o = $("otherIn"); if (o && !matchMedia("(pointer: coarse)").matches) o.focus(); } return; }
  if (!a) return;
  const k = a.dataset.act; sound.tap();
  switch (k) {
    case "toChain": S.fresh = null; go("chain"); break;
    case "toWhat": go("what"); break;
    case "toWhatAgain": Object.assign(S, { demo: null, other: "", points: ["", "", ""], learner: "", back: "", fresh: null }); go("what"); break;
    case "toPrep": if (canPrep()) go("prep"); break;
    case "toTeach": go("teach"); break;
    case "pause":
      if (timer.ended) return;
      if (timer.running) { timer.pause(); a.textContent = T().resume; } else { timer.resume(); a.textContent = T().pause; }
      break;
    case "toPass": go("pass"); break;
    case "toBack": go("back"); break;
    case "toAdd": go("add"); break;
    case "save": {
      const at = Date.now(), list = store.get("fb_teachback", []);
      list.push({ demo: S.demo, text: S.back.trim() + (S.demo === "other" && S.other.trim() ? ` (${S.other.trim()})` : ""), name: S.learner.trim(), at });
      store.set("fb_teachback", list.slice(-50)); S.fresh = at; sound.warm(); buzz(30); go("link"); break; }
    case "copy": {
      const text = chainText(), ok = () => toast(T().copied);
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok).catch(fb); else fb();
      function fb() { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (_) {} ta.remove(); ok(); }
      break; }
    case "clear":
      if (!S.clearArmed) { S.clearArmed = true; toast(T().clearSure); a.style.color = "var(--accent)"; a.style.borderColor = "var(--accent)"; return; }
      store.set("fb_teachback", []); toast(T().cleared); S.clearArmed = false; render(); break;
  }
});

window.__app = { S, go, render, timer, chain };

/* ---------- facilitator guide ---------- */
const drawer = $("drawer");
function openGuide() {
  const t = T();
  $("panel").innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
      <div><span class="kicker">${esc(t.gKicker)}</span><h3 id="g-title">${esc(t.gTitle)}</h3></div>
      <button class="x" data-close aria-label="${esc(t.close)}">✕</button>
    </div>
    <h4>${esc(t.gWhy)}</h4><p>${esc(t.gWhyTxt)}</p>
    <h4>${esc(t.gSteps)}</h4><ol>${t.gStepList.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    <h4>${esc(t.gDebrief)}</h4><ul>${t.gDebriefList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
    <h4>${esc(t.gNotes)}</h4><ul>${t.gNotesList.map(s => `<li>${esc(s)}</li>`).join("")}</ul>`;
  drawer.classList.add("show");
  setTimeout(() => drawer.querySelector("[data-close]").focus({ preventScroll: true }), 60);
}
function closeGuide() { drawer.classList.remove("show"); $("btn-guide").focus({ preventScroll: true }); }
drawer.addEventListener("click", e => { if (e.target === drawer || e.target.closest("[data-close]")) closeGuide(); });
$("btn-guide").addEventListener("click", openGuide);
window.addEventListener("keydown", e => { if (e.key === "Escape" && drawer.classList.contains("show")) closeGuide(); });

/* ---------- language + sound ---------- */
function paintSound() {
  const b = $("btn-sound"), t = T();
  b.innerHTML = sound.muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
  b.setAttribute("aria-label", sound.muted ? t.soundOff : t.soundOn); b.title = b.getAttribute("aria-label");
}
$("btn-sound").addEventListener("click", () => { sound.muted = !sound.muted; store.set("fb_muted", sound.muted); sound.init(); paintSound(); if (!sound.muted) sound.tap(); });

function applyLang(l) {
  lang = LANGS.includes(l) ? l : "en";
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.title = T().title;
  $("lang-lbl").textContent = LANG_LBL[lang];
  $("btn-guide").setAttribute("aria-label", T().guide); drawer.setAttribute("aria-label", T().guide);
  document.querySelectorAll("[data-t]").forEach(el => { const v = T()[el.dataset.t]; if (typeof v === "string") el.textContent = v; });
  paintSound();
  render();               // the clock object survives a re-render
  timer.paint();
  const pb = $("pauseBtn"); if (pb && !timer.running && !timer.ended) pb.textContent = T().resume;
  if (drawer.classList.contains("show")) openGuide();
  try { localStorage.setItem("wm_preferred_lang", lang); localStorage.setItem("wm_cases_lang", lang); } catch (e) {}
}
$("btn-lang").addEventListener("click", () => applyLang(LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]));

/* ---------- boot ---------- */
let saved = null;
try { saved = localStorage.getItem("wm_preferred_lang") || localStorage.getItem("wm_cases_lang"); } catch (e) {}
const nav = (navigator.language || "").toLowerCase();
applyLang(LANGS.includes(saved) ? saved : nav.startsWith("zh") ? "zh" : nav.startsWith("es") ? "es" : "en");
document.addEventListener("visibilitychange", () => { if (!document.hidden && timer.running) keepAwake(true); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("/free_builder/sw.js", { scope: "/free_builder/" }).catch(() => {}); // offline cache
})();
</script>
</body>
